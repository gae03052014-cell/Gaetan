<script>
/* ============================================================
   CONFIGURATION : colle ici l'URL de ta Firebase Realtime Database
   ex. "https://mon-projet-default-rtdb.europe-west1.firebasedatabase.app"
   (si tu la laisses vide, l'appli te la demandera une fois)
   ============================================================ */
var FIREBASE_URL = "";

/* ---- Stockage : window.storage (Firebase pour le partagé, localStorage pour le privé) ---- */
(function () {
  var base = (FIREBASE_URL || localStorage.getItem("st_fb") || "").trim();
  if (!base) {
    base = (window.prompt("Colle l'URL de ta Firebase Realtime Database\n(ex. https://xxxx-default-rtdb.firebaseio.com)") || "").trim();
    if (base) localStorage.setItem("st_fb", base);
  }
  base = base.replace(/\/+$/, "");
  window.__FB = base;
  function enc(k) { return k.replace(/[.$#\[\]\/%]/g, function (c) { return "%" + ("0" + c.charCodeAt(0).toString(16)).slice(-2); }); }
  function dec(k) { return k.replace(/%([0-9a-f]{2})/gi, function (m, h) { return String.fromCharCode(parseInt(h, 16)); }); }
  function nf() { return new Error("not found"); }
  window.storage = {
    get: async function (key, shared) {
      if (!shared || !base) {
        var v = localStorage.getItem((shared ? "sh:" : "pv:") + key);
        if (v === null) throw nf();
        return { key: key, value: v, shared: !!shared };
      }
      var r = await fetch(base + "/s/" + encodeURIComponent(enc(key)) + ".json");
      if (!r.ok) throw new Error("network " + r.status);
      var d = await r.json();
      if (d === null) throw nf();
      return { key: key, value: typeof d === "string" ? d : JSON.stringify(d), shared: true };
    },
    set: async function (key, value, shared) {
      if (!shared || !base) { localStorage.setItem((shared ? "sh:" : "pv:") + key, value); return { key: key, value: value, shared: !!shared }; }
      var r = await fetch(base + "/s/" + encodeURIComponent(enc(key)) + ".json", { method: "PUT", body: JSON.stringify(String(value)) });
      if (!r.ok) throw new Error("network " + r.status);
      return { key: key, value: value, shared: true };
    },
    delete: async function (key, shared) {
      if (!shared || !base) { localStorage.removeItem((shared ? "sh:" : "pv:") + key); return { key: key, deleted: true, shared: !!shared }; }
      var r = await fetch(base + "/s/" + encodeURIComponent(enc(key)) + ".json", { method: "DELETE" });
      if (!r.ok) throw new Error("network " + r.status);
      return { key: key, deleted: true, shared: true };
    },
    list: async function (prefix, shared) {
      prefix = prefix || "";
      var keys;
      if (!shared || !base) {
        var p = shared ? "sh:" : "pv:";
        keys = [];
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(p) === 0) keys.push(k.slice(p.length)); }
      } else {
        var r = await fetch(base + "/s.json?shallow=true");
        if (!r.ok) throw new Error("network " + r.status);
        var d = await r.json();
        keys = Object.keys(d || {}).map(dec);
      }
      return { keys: keys.filter(function (k) { return k.indexOf(prefix) === 0; }), prefix: prefix, shared: !!shared };
    }
  };
})();

/* ---- Installation (bannière / bouton Réglages) ---- */
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  window.__installPrompt = e;
  window.dispatchEvent(new Event("installready"));
});
</script>

      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

async function sha256Hex(text) {
  try {
    const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    return sha256Js(text);
  }
}

async function hashPassword(password, salt) {
  return sha256Hex(salt + ":" + password);
}

const ADMIN_ID = "admin";
const ADMIN_CODE = "GAETAN";
const ADMIN_SEED = { salt: "gaetan-admin-seed-01", hash: "1887775f0acf9753dfce8ffd455cb46eed835589e6adb48935ff954ebad8d20d" };

function isReservedPseudo(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, "") === "gaetan";
}

async function safeList(prefix) {
  try {
    const r = await window.storage.list(prefix, true);
    return (r && r.keys) || [];
  } catch (e) {
    return [];
  }
}

async function probe(key) {
  try {
    const r = await window.storage.get(key, true);
    return r ? "yes" : "no";
  } catch (e) {
    return /not found/i.test(String((e && e.message) || e)) ? "no" : "err";
  }
}

async function ensureAdmin() {
  const exists = await safeGet("account:" + ADMIN_CODE, true);
  if (exists) return;
  const createdAt = Date.now();
  await safeSet("account:" + ADMIN_CODE, JSON.stringify({ id: ADMIN_ID, pseudo: "Gaëtan", salt: ADMIN_SEED.salt, hash: ADMIN_SEED.hash, createdAt: createdAt, admin: true }), true);
  await safeSet("profile:" + ADMIN_ID, JSON.stringify({ pseudo: "Gaëtan", code: ADMIN_CODE, createdAt: createdAt }), true);
  await safeSet("codeIndex:" + ADMIN_CODE, ADMIN_ID, true);
}

async function deleteAccountData(id, code) {
  const keys = await safeList("");
  const mine = ["account:" + code, "codeIndex:" + code, "profile:" + id, "seen:" + id, "inbox:" + id, "banned:" + id, "groups:" + id];
  const rel = keys.filter((k) => /^(conv|last|read|unread|typing):/.test(k) && k.indexOf(id) !== -1);
  await Promise.all(mine.concat(rel).map((k) => safeDelete(k, true)));
  const inboxes = keys.filter((k) => k.indexOf("inbox:") === 0 && k !== "inbox:" + id);
  for (let i = 0; i < inboxes.length; i++) {
    const raw = await safeGet(inboxes[i], true);
    if (!raw) continue;
    const arr = JSON.parse(raw);
    if (arr.indexOf(id) !== -1) await safeSet(inboxes[i], JSON.stringify(arr.filter((x) => x !== id)), true);
  }
  const gkeys = keys.filter((k) => k.indexOf("group:") === 0);
  for (let i = 0; i < gkeys.length; i++) {
    const graw = await safeGet(gkeys[i], true);
    if (!graw) continue;
    const g = JSON.parse(graw);
    if (g.members.indexOf(id) === -1) continue;
    g.members = g.members.filter((x) => x !== id);
    if (!g.members.length) await deleteGroupData(gkeys[i].slice(6));
    else {
      if (g.admin === id) g.admin = g.members[0];
      await safeSet(gkeys[i], JSON.stringify(g), true);
    }
  }
}


function compressImage(file, maxDim, quality) {
  const dim = maxDim || 900;
  const q = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lecture du fichier impossible"));
    reader.onload = () => {
      const img = new window.Image();
      img.onerror = () => reject(new Error("Image invalide"));
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height && width > dim) {
          height = Math.round((height * dim) / width);
          width = dim;
        } else if (height > dim) {
          width = Math.round((width * dim) / height);
          height = dim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", q));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function safeGet(key, shared) {
  try {
    const r = await window.storage.get(key, shared);
    return r ? r.value : null;
  } catch (e) {
    return null;
  }
}
async function safeSet(key, value, shared) {
  try {
    await window.storage.set(key, value, shared);
    return true;
  } catch (e) {
    return false;
  }
}
async function safeDelete(key, shared) {
  try {
    await window.storage.delete(key, shared);
    return true;
  } catch (e) {
    return false;
  }
}

async function generateUniqueCode() {
  for (let i = 0; i < 6; i++) {
    const candidate = generateCodeCandidate(6);
    const taken = await safeGet("codeIndex:" + candidate, true);
    if (!taken) return candidate;
  }
  return generateCodeCandidate(8);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

function SignUp({ onBack, onDone }) {
  const [step, setStep] = useState("form"); // form | reveal
  const [pseudo, setPseudo] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [session, setSession] = useState(null);
  const [copied, setCopied] = useState(false);

  const submit = async () => {
    const cleanPseudo = pseudo.trim();
    if (cleanPseudo.length < 2) {
      setErr("Choisis un pseudo d'au moins 2 caractères.");
      return;
    }
    if (isReservedPseudo(cleanPseudo)) {
      setErr("Ce pseudo est réservé.");
      return;
    }
    if (password.length < 4) {
      setErr("Le mot de passe doit faire au moins 4 caractères.");
      return;
    }
    if (password !== confirm) {
      setErr("Les deux mots de passe ne correspondent pas.");
      return;
    }
    setBusy(true);
    setErr("");
    const id = generateId();
    const code = await generateUniqueCode();
    const salt = randomSalt();
    const hash = await hashPassword(password, salt);
    const createdAt = Date.now();
    const account = { id: id, pseudo: cleanPseudo, salt: salt, hash: hash, createdAt: createdAt };
    const profilePublic = { pseudo: cleanPseudo, code: code, createdAt: createdAt };
    const newSession = { id: id, pseudo: cleanPseudo, code: code, createdAt: createdAt };
    const ok1 = await safeSet("account:" + code, JSON.stringify(account), true);
    const ok2 = await safeSet("profile:" + id, JSON.stringify(profilePublic), true);
    const ok3 = await safeSet("codeIndex:" + code, id, true);
    const ok4 = await safeSet("profile", JSON.stringify(newSession), false);
    setBusy(false);
    if (!ok1 || !ok2 || !ok3 || !ok4) {
      setErr("Connexion au stockage impossible. Réessaie.");
      return;
    }
    setSession(newSession);
    setStep("reveal");
  };

  const copyCode = async () => {
    const ok = await copyToClipboard(session.code);
    setCopied(ok);
    setTimeout(() => setCopied(false), 1500);
  };

  if (step === "reveal" && session) {
    return (
      <div className="h-full flex flex-col justify-center px-7" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>

        <div
          className="rounded-2xl p-5 mb-5"
          style={{ background: "linear-gradient(135deg, var(--card2), var(--card))", border: "1px dashed color-mix(in srgb, var(--accent) 40%, transparent)" }}
        >
          <div className="flex items-center gap-3 mb-5">
            <Avatar code={session.id} pseudo={session.pseudo} size={44} />
            <div>
              <div className="text-[10px] uppercase tracking-widest" style={{ color: "var(--muted)" }}>
                Carte membre
              </div>
              <div className="font-semibold">{session.pseudo}</div>
            </div>
          </div>
          <div className="text-[10px] uppercase tracking-widest mb-1" style={{ color: "var(--muted)" }}>
            Ton code ami
          </div>
          <div className="text-3xl font-mono font-bold" style={{ color: "var(--accent-text)", letterSpacing: "0.2em" }}>
            {session.code}
          </div>
          <button
            onClick={copyCode}
            className="mt-4 text-xs flex items-center gap-1.5 px-3 py-1.5 rounded-full"
            style={{ background: "var(--bg)", border: "1px solid var(--line)", color: "var(--fg)" }}
          >
            {copied ? <Check size={13} /> : <Copy size={13} />}
            {copied ? "Copié" : "Copier le code"}
          </button>
        </div>

        <div className="mb-6">
          <Callout icon={Key} title="Retiens bien ces deux infos">
            Code ami + mot de passe → pour te reconnecter plus tard.<br />
            Code ami seul → pour te faire ajouter par d'autres.
          </Callout>
        </div>

        <button
          onClick={() => onDone(session)}
          className="w-full rounded-2xl py-4 text-base font-semibold"
          style={{ background: "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))", color: "var(--on-accent)", boxShadow: "0 8px 22px -8px color-mix(in srgb, var(--accent) 65%, transparent)" }}
        >
          Continuer
        </button>
      </div>
    );
  }

  return (
    <div className="h-full flex flex-col justify-center px-7" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>
      <button
        onClick={onBack}

      >
        <ArrowLeft size={20} />

      return;

    setBusy(true);

    const rawAcc = await safeGet("account:" + code, true);

      setErr("Aucun compte avec ce code.");

        style={{ background: "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))", color: "var(--on-accent)", boxShadow: "0 8px 22px -8px color-mix(in srgb, var(--accent) 65%, transparent)" }}
      >
        {busy ? <Loader2 size={18} className="animate-spin" /> : "Se connecter"}
      </button>
    </div>
  );
}

// ---------- Home ----------

function Home({ me, onOpenChat, onLogout, onProfileUpdate, onSettings, prefs, onPrefs }) {
  const [contacts, setContacts] = useState([]);
  const [adding, setAdding] = useState(false);
  const [q, setQ] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [addBusy, setAddBusy] = useState(false);
  const [addErr, setAddErr] = useState("");
  const [loading, setLoading] = useState(true);
  const [copied, setCopied] = useState(false);
  const [confirmRegen, setConfirmRegen] = useState(false);
  const [regenBusy, setRegenBusy] = useState(false);
  const inst = useInstall();
  const [instHide, setInstHide] = useState(false);
  const [grpOpen, setGrpOpen] = useState(false);
  const [grpName, setGrpName] = useState("");
  const [grpSel, setGrpSel] = useState({});
  const [grpEmoji, setGrpEmoji] = useState("👥");
  const [grpBusy, setGrpBusy] = useState(false);

  const sigRef = useRef("");
  const refresh = useCallback(async () => {
    const rawContacts = await safeGet("contacts:" + me.id, false);
    const myIds = rawContacts ? JSON.parse(rawContacts) : [];
    const rawInbox = await safeGet("inbox:" + me.id, true);
    const inboxIds = rawInbox ? JSON.parse(rawInbox) : [];
    const merged = Array.from(new Set(myIds.concat(inboxIds))).filter((id) => id !== me.id);
    const hydratedAll = await Promise.all(
      merged.map(async (id) => {
        const cid = convId(me.id, id);
        const r = await Promise.all([
          safeGet("profile:" + id, true),
          safeGet("last:" + cid, true),
          safeGet("unread:" + cid + ":" + me.id, true),
        ]);
        const pr = r[0] ? JSON.parse(r[0]) : null;
        if (!pr) return null;
        if (pr.avatar) AVATARS[id] = pr.avatar; else delete AVATARS[id];
        return { id: id, pseudo: pr.pseudo, avatar: pr.avatar || null, last: r[1] ? JSON.parse(r[1]) : null, unread: parseInt(r[2], 10) || 0 };
      })
    );
    const gRaw = await safeGet("groups:" + me.id, true);
    const gids = gRaw ? JSON.parse(gRaw) : [];
    const gh = await Promise.all(gids.map(async (gid) => {
      const r = await Promise.all([safeGet("group:" + gid, true), safeGet("last:" + gid, true), safeGet("unread:" + gid + ":" + me.id, true)]);
      const g = r[0] ? JSON.parse(r[0]) : null;
      if (!g || g.members.indexOf(me.id) === -1) return null;
      if (g.avatar) AVATARS[gid] = g.avatar;
      return { id: gid, pseudo: g.name, isGroup: true, members: g.members, admin: g.admin, avatar: g.avatar || null, last: r[1] ? JSON.parse(r[1]) : null, unread: parseInt(r[2], 10) || 0 };
    }));
    const hydrated = hydratedAll.filter(Boolean).concat(gh.filter(Boolean));
    hydrated.sort((a, b) => (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0));
    const sig = JSON.stringify(hydrated);
    if (sig !== sigRef.current) {
      sigRef.current = sig;
      setContacts(hydrated);
    }
    setLoading(false);
  }, [me.id]);

  useEffect(() => {
    refresh();
    const t = setInterval(() => { if (!document.hidden) refresh(); }, 6000);
    return () => clearInterval(t);
  }, [refresh]);

  const addContact = async () => {
    const raw = codeInput.trim();
    if (!raw) return;
    setAddErr("");
    setAddBusy(true);
    const code = extractCode(raw);
    const theirId = await safeGet("codeIndex:" + code, true);
    if (!theirId) {
      setAddBusy(false);
      setAddErr("Aucun compte avec ce code.");
      return;
    }
    if (theirId === me.id) {
      setAddBusy(false);
      setAddErr("C'est ton propre code !");
      return;
    }
    const rawProfile = await safeGet("profile:" + theirId, true);
    const theirProfile = rawProfile ? JSON.parse(rawProfile) : { pseudo: "Inconnu" };
    const rawContacts = await safeGet("contacts:" + me.id, false);
    const list = rawContacts ? JSON.parse(rawContacts) : [];
    if (list.indexOf(theirId) === -1) {
      await safeSet("contacts:" + me.id, JSON.stringify(list.concat([theirId])), false);
    }
    setAddBusy(false);
    setCodeInput("");
    setAdding(false);
    refresh();
    onOpenChat({ id: theirId, pseudo: theirProfile.pseudo });
  };

  const copyMyCode = async () => {
    const ok = await copyToClipboard(me.code);
    setCopied(ok);
    setTimeout(() => setCopied(false), 1500);
  };

  const pinnedIds = prefs.pinned || [];
  const mutedIds = prefs.muted || [];
  const blockedIds = prefs.blocked || [];

    .filter((c) => blockedIds.indexOf(c.id) === -1 && c.pseudo.toLowerCase().indexOf(q.toLowerCase()) !== -1)

    await safeSet("group:" + gid, JSON.stringify({ name: name, members: members, admin: me.id, createdAt: Date.now(), avatar: avatar }), true);
    for (let i = 0; i < members.length; i++) await addToIndex(members[i], gid);
    await appendGroupMsg(gid, members, me.id, { id: Date.now() + "-" + Math.random(), from: me.id, type: "system", content: me.pseudo + " a créé le groupe « " + name + " »", ts: Date.now() });
    AVATARS[gid] = avatar;
    setGrpBusy(false);
    setGrpOpen(false);
    setGrpName("");
    setGrpSel({});
    setAdding(false);
    onOpenChat({ id: gid, pseudo: name, isGroup: true, members: members, admin: me.id, avatar: avatar });
  };

  const doRegenerate = async () => {
    setRegenBusy(true);
    const newCode = await generateUniqueCode();
    const rawAcc = await safeGet("account:" + me.code, true);
    const acc = rawAcc ? JSON.parse(rawAcc) : { id: me.id, pseudo: me.pseudo, salt: "", hash: "", createdAt: me.createdAt };
    await safeSet("account:" + newCode, JSON.stringify(acc), true);
    await safeDelete("account:" + me.code, true);
    await safeSet("codeIndex:" + newCode, me.id, true);
    await safeDelete("codeIndex:" + me.code, true);
    const rawProfile = await safeGet("profile:" + me.id, true);
    const p = rawProfile ? JSON.parse(rawProfile) : { pseudo: me.pseudo, createdAt: me.createdAt };
    const updatedProfilePublic = Object.assign({}, p, { code: newCode });
    await safeSet("profile:" + me.id, JSON.stringify(updatedProfilePublic), true);
    const updatedSession = Object.assign({}, me, { code: newCode });
    await safeSet("profile", JSON.stringify(updatedSession), false);
    setRegenBusy(false);
    setConfirmRegen(false);
    onProfileUpdate(updatedSession);
  };

  return (
    <div className="h-full flex flex-col" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>
      <div className="px-5 pt-6 pb-4" style={{ borderBottom: "1px solid var(--line)" }}>
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-3">
            <button onClick={onSettings} title="Réglages"><Avatar code={me.id} pseudo={me.pseudo} size={44} /></button>
            <div>
              <div className="text-2xl font-bold tracking-tight leading-none">Messages</div>
              <div className="text-xs mt-1" style={{ color: "var(--muted)" }}>{me.pseudo}</div>
            </div>
          </div>
          <button
            onClick={() => setAdding((a) => !a)}
            className="w-11 h-11 rounded-full flex items-center justify-center"
            style={{ background: "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))", color: "var(--on-accent)" }}
          >
            {adding ? <X size={20} /> : <Plus size={20} />}

        <div className="flex items-center gap-1.5 flex-wrap">
          <div

            style={{ background: "var(--card)", border: "1px solid var(--line)" }}

            <Key size={13} style={{ color: "var(--muted)" }} />
            <span className="font-mono font-semibold" style={{ letterSpacing: "0.1em", color: "var(--accent-text)" }}>
              {me.code}

            <button onClick={copyMyCode} className="w-6 h-6 rounded-full flex items-center justify-center">
              {copied ? <Check size={12} /> : <Copy size={12} />}

          </div>
          <button

              Un nouveau code sera créé. Il te faudra ce nouveau code (avec ton mot de passe habituel) pour te

            </p>
            <div className="flex gap-2">
              <button

                className="px-3 py-1 rounded-full"

            </div>
          </div>

        {adding && (

      {inst.prompt && !inst.standalone && !instHide && (
        <div className="mx-4 mt-3 rounded-2xl px-3 py-2.5 flex items-center gap-3" style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>

      {contacts.length > 3 && (
        <div className="px-4 pt-3">
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher une conversation" className="w-full rounded-full px-4 py-2.5 text-sm outline-none" style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }} />

        {loading ? (
          <div className="flex justify-center pt-10" style={{ color: "var(--muted)" }}>
            <Loader2 size={20} className="animate-spin" />
          </div>
        ) : visible.length === 0 ? (
          <div className="px-6 pt-14 text-center" style={{ color: "var(--muted)" }}>

          </div>
        ) : (
          visible.map((c) => (
            <button
              key={c.id}
              onClick={() => onOpenChat(c)}
              className="w-full flex items-center gap-3.5 px-5 py-3.5 text-left"
              style={{ borderBottom: "1px solid var(--line)" }}
            >
              <Avatar code={c.id} pseudo={c.pseudo} size={50} />
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between gap-2">
                  <span className="font-medium truncate">{pinnedIds.indexOf(c.id) !== -1 ? "📌 " : ""}{c.pseudo}{mutedIds.indexOf(c.id) !== -1 ? " 🔇" : ""}</span>
                  <span className="text-[11px] shrink-0" style={{ color: "var(--muted)" }}>{c.last ? fmtTime(c.last.ts) : ""}</span>
                </div>
                <div className="flex items-center justify-between gap-2">
                  <span className="text-sm truncate" style={{ color: "var(--muted)" }}>
                    {c.last ? (c.last.from === me.id ? "Toi : " : "") + c.last.preview : "Nouvelle conversation"}
                  </span>
                  {c.unread > 0 && (
                    <span className="text-[11px] font-semibold rounded-full px-1.5 min-w-[20px] text-center shrink-0" style={{ background: mutedIds.indexOf(c.id) !== -1 ? "var(--muted)" : "var(--accent)", color: "var(--on-accent)" }}>
                      {c.unread}
                    </span>
                  )}
                </div>
              </div>
            </button>
          ))
        )}
        {blockedList.length > 0 && (
          <div className="px-5 py-4">
            <div className="text-xs uppercase tracking-widest mb-2" style={{ color: "var(--muted)" }}>Bloqués</div>
            {blockedList.map((c) => (
              <div key={c.id} className="flex items-center justify-between py-1.5 text-sm">
                <span>{c.pseudo}</span>
                <button
                  onClick={() => onPrefs(Object.assign({}, prefs, { blocked: blockedIds.filter((x) => x !== c.id) }))}
                  className="text-xs underline"
                >
                  Débloquer
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function dayLabel(ts) {
  const d = new Date(ts);
  const t = new Date();
  const y = new Date();
  y.setDate(t.getDate() - 1);
  const k = (x) => x.getFullYear() + "-" + x.getMonth() + "-" + x.getDate();
  if (k(d) === k(t)) return "Aujourd'hui";
  if (k(d) === k(y)) return "Hier";
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}

function linkify(text) {
  return text.split(/(https?:\/\/[^\s]+)/g).map((s, i) =>
    /^https?:\/\//.test(s) ? (
      <a key={i} href={s} target="_blank" rel="noopener noreferrer" className="underline break-all" onClick={(e) => e.stopPropagation()}>{s}</a>
    ) : (
      s
    )
  );
}

const FILE_MAX = 700000;

function fmtDur(s) {
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function fmtSize(n) {
  if (n < 1024) return n + " o";
  if (n < 1048576) return Math.round(n / 1024) + " Ko";
  return (n / 1048576).toFixed(1) + " Mo";
}

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("lecture"));
    r.readAsDataURL(file);
  });
}

function previewOf(m) {
  if (m.type === "text") return m.content.slice(0, 60);
  if (m.type === "image") return "📷 Photo";
  if (m.type === "file") return "📎 " + m.name;
  if (m.type === "audio") return "🎤 Message vocal";
  if (m.type === "system") return m.content;
  if (m.type === "calllog") return (m.kind === "video" ? "📹 " : "📞 ") + (m.result === "missed" ? "Appel manqué" : m.result === "declined" ? "Appel refusé" : "Appel · " + fmtDur(m.dur || 0));
  return m.type === "sticker" ? "Sticker" : "📞 Appel";
}

function Chat({ me, other, onBack, prefs, onPrefs, onCall }) {
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);
  const [loading, setLoading] = useState(true);
  const [panel, setPanel] = useState(null);
  const [otherRead, setOtherRead] = useState(0);
  const [selected, setSelected] = useState(null);
  const [replyTo, setReplyTo] = useState(null);
  const [typing, setTyping] = useState(false);
  const [menu, setMenu] = useState(false);
  const [search, setSearch] = useState(null);
  const [editing, setEditing] = useState(null);
  const [viewer, setViewer] = useState(null);
  const [seen, setSeen] = useState(0);

  const [newCount, setNewCount] = useState(0);
  const scrollRef = useRef(null);
  const fileRef = useRef(null);
  const rawRef = useRef(null);
  const firstLoad = useRef(true);
  const firstScroll = useRef(true);
  const lastTyping = useRef(0);
  const seenWrite = useRef(0);
  const [notice, setNotice] = useState("");
  const [recording, setRecording] = useState(false);
  const [recSecs, setRecSecs] = useState(0);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const timerRef = useRef(null);
  const cancelRef = useRef(false);
  const durRef = useRef(0);
  const id = other.isGroup ? other.id : convId(me.id, other.id);
  const pinned = (prefs.pinned || []).indexOf(other.id) !== -1;
  const muted = (prefs.muted || []).indexOf(other.id) !== -1;
  const [hidden, setHidden] = useState([]);
  const [clearedAt, setClearedAt] = useState(0);
  const [selMode, setSelMode] = useState(false);
  const [picked, setPicked] = useState({});
  const [confirmDel, setConfirmDel] = useState(null);
  const [gmembers, setGMembers] = useState(other.members || []);
  const [names, setNames] = useState({});
  const [gInfo, setGInfo] = useState(false);

  useEffect(() => {
    if (!other.isGroup) return;
    (async () => {
      const o = {};
      await Promise.all(gmembers.map(async (u) => {
        const pr = await safeGet("profile:" + u, true);
        if (pr) { const pp = JSON.parse(pr); o[u] = pp.pseudo; if (pp.avatar) AVATARS[u] = pp.avatar; }
      }));
      setNames(o);
    })();
  }, [gmembers.join(",")]);

  useEffect(() => {
    (async () => {
      const h = await safeGet("hidden:" + me.id + ":" + id, false);
      if (h) setHidden(JSON.parse(h));
      const cl = await safeGet("cleared:" + me.id + ":" + id, false);
      if (cl) setClearedAt(parseInt(cl, 10) || 0);
    })();
  }, [id]);

  const load = useCallback(async () => {
    if (document.hidden) return;
    const res = await Promise.all([
      safeGet("conv:" + id, true),
      safeGet("read:" + id + ":" + other.id, true),
      safeGet("typing:" + id + ":" + other.id, true),
      safeGet("seen:" + other.id, true),
    ]);
    const raw = res[0];
    const key = raw || "";
    if (key !== rawRef.current) {
      rawRef.current = key;
      const list = raw ? JSON.parse(raw) : [];
      setMessages(list);
      const last = list[list.length - 1];
      if (!prefs.noReceipts && (firstLoad.current || (last && last.from !== me.id))) {
        safeSet("read:" + id + ":" + me.id, String(Date.now()), true);
        safeSet("unread:" + id + ":" + me.id, "0", true);
      }
    }
    firstLoad.current = false;
    setOtherRead(parseInt(res[1], 10) || 0);
    setTyping(Date.now() - (parseInt(res[2], 10) || 0) < 4000);
    setSeen(parseInt(res[3], 10) || 0);
    const now = Date.now();
    if (!prefs.noPresence && now - seenWrite.current > 20000) {
      seenWrite.current = now;
      safeSet("seen:" + me.id, String(now), true);
    }
    setLoading(false);
  }, [id]);

  useEffect(() => {
    load();
    const t = setInterval(load, 2500);
    return () => clearInterval(t);
  }, [load]);

  const onScroll = () => {
    const el = scrollRef.current;
    if (!el) return;
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    setAtBottom(near);
    if (near) setNewCount(0);
  };

  useEffect(() => {
    const el = scrollRef.current;
    const last = messages[messages.length - 1];
    if (!el || !last) return;
    if (firstScroll.current || atBottom || last.from === me.id) {
      el.scrollTop = el.scrollHeight;
      firstScroll.current = false;
    } else {
      setNewCount((n) => n + 1);
    }
  }, [messages.length]);

  const mutate = async (mid, fn) => {
    const raw = await safeGet("conv:" + id, true);
    const list = raw ? JSON.parse(raw) : [];
    const updated = list.map((x) => (x.id === mid ? fn(x) : x));
    const s = JSON.stringify(updated);
    await safeSet("conv:" + id, s, true);
    rawRef.current = s;
    setMessages(updated);
    setSelected(null);
  };

  const pushMessage = async (msg) => {
    const raw = await safeGet("conv:" + id, true);
    const list = raw ? JSON.parse(raw) : [];
    const updated = list.concat([msg]);
    const s = JSON.stringify(updated);
    await safeSet("conv:" + id, s, true);
    rawRef.current = s;
    setMessages(updated);
    await safeSet("last:" + id, JSON.stringify({ from: me.id, preview: previewOf(msg), ts: msg.ts }), true);
    if (other.isGroup) {
      const gm = await loadGroup(other.id);
      const mem = gm ? gm.members : gmembers;
      for (let k = 0; k < mem.length; k++) {
        if (mem[k] === me.id) continue;
        const ru = await safeGet("unread:" + id + ":" + mem[k], true);
        await safeSet("unread:" + id + ":" + mem[k], String((parseInt(ru, 10) || 0) + 1), true);
      }
    } else {
      const rawU = await safeGet("unread:" + id + ":" + other.id, true);
      await safeSet("unread:" + id + ":" + other.id, String((parseInt(rawU, 10) || 0) + 1), true);
    }
    const pairs = other.isGroup ? [] : [[me.id, other.id], [other.id, me.id]];
    for (let i = 0; i < pairs.length; i++) {
      const rawInbox = await safeGet("inbox:" + pairs[i][0], true);
      const inbox = rawInbox ? JSON.parse(rawInbox) : [];
      if (inbox.indexOf(pairs[i][1]) === -1) {
        await safeSet("inbox:" + pairs[i][0], JSON.stringify(inbox.concat([pairs[i][1]])), true);
      }
    }
  };

  const newId = () => Date.now() + "-" + Math.random();
  const flashNotice = (t) => {
    setNotice(t);
    setTimeout(() => setNotice(""), 3500);
  };

  const sendText = async () => {
    const clean = text.trim();
    if (!clean) return;
    setText("");
    if (editing) {
      const eid = editing;
      setEditing(null);
      await mutate(eid, (x) => Object.assign({}, x, { content: clean, edited: true }));
      return;
    }
    const rt = replyTo;
    setReplyTo(null);
    safeSet("typing:" + id + ":" + me.id, "0", true);
    setSending(true);
    await pushMessage({ id: newId(), from: me.id, type: "text", content: clean, ts: Date.now(), replyTo: rt });
    setSending(false);
  };

  const sendImage = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setSending(true);
    try {
      if (file.type.indexOf("image/") === 0) {
        const dataUrl = await compressImage(file);
        await pushMessage({ id: newId(), from: me.id, type: "image", content: dataUrl, ts: Date.now() });
      } else if (file.size > FILE_MAX) {
        flashNotice("Fichier trop lourd (max " + fmtSize(FILE_MAX) + ").");
      } else {
        const dataUrl = await readAsDataURL(file);
        await pushMessage({ id: newId(), from: me.id, type: "file", name: file.name, size: file.size, mime: file.type, content: dataUrl, ts: Date.now() });
      }
    } catch (e2) {
      flashNotice("Impossible d'envoyer ce fichier.");
    }
    setSending(false);
  };

  const startRec = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream);
      chunksRef.current = [];
      cancelRef.current = false;
      durRef.current = 0;
      mr.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunksRef.current.push(ev.data); };
      mr.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        clearInterval(timerRef.current);
        setRecording(false);
        setRecSecs(0);
        if (cancelRef.current) return;
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || "audio/webm" });
        if (blob.size > 900000) { flashNotice("Message vocal trop long."); return; }
        const dataUrl = await readAsDataURL(blob);
        setSending(true);
        await pushMessage({ id: newId(), from: me.id, type: "audio", content: dataUrl, dur: durRef.current, ts: Date.now() });
        setSending(false);
      };
      recorderRef.current = mr;
      mr.start();
      setRecording(true);
      timerRef.current = setInterval(() => {
        durRef.current += 1;
        setRecSecs(durRef.current);
        if (durRef.current >= 60) mr.stop();
      }, 1000);
    } catch (err) {
      flashNotice("Micro non autorisé ou indisponible.");
    }
  };
  const stopRec = () => { if (recorderRef.current && recorderRef.current.state !== "inactive") recorderRef.current.stop(); };
  const cancelRec = () => { cancelRef.current = true; stopRec(); };

  const sendSticker = async (stickerId) => {
    setPanel(null);
    await pushMessage({ id: newId(), from: me.id, type: "sticker", content: stickerId, ts: Date.now() });
  };

  const sendCallRequest = async () => {
    await pushMessage({ id: newId(), from: me.id, type: "call", content: "", ts: Date.now() });
  };

  const togglePick = (mid) => setPicked((pk) => { const n = Object.assign({}, pk); if (n[mid]) delete n[mid]; else n[mid] = true; return n; });

  const askDelete = (ids) => {
    const allMine = ids.every((i) => {
      const m = messages.filter((x) => x.id === i)[0];
      return m && m.from === me.id && !m.deleted && m.type !== "calllog";
    });
    setConfirmDel({ ids: ids, allMine: allMine });
    setSelected(null);
  };

  const doDelete = async (mode) => {
    const d = confirmDel;
    if (!d) return;
    if (d.clearAll) {
      const now = Date.now();
      setClearedAt(now);
      await safeSet("cleared:" + me.id + ":" + id, String(now), false);
    } else if (mode === "all") {
      const raw = await safeGet("conv:" + id, true);
      const list = raw ? JSON.parse(raw) : [];
      const updated = list.map((x) => (d.ids.indexOf(x.id) !== -1 && x.from === me.id ? Object.assign({}, x, { deleted: true, content: "", reactions: {} }) : x));
      const s = JSON.stringify(updated);
      await safeSet("conv:" + id, s, true);
      rawRef.current = s;
      setMessages(updated);
      const lastMsg = updated[updated.length - 1];
      if (lastMsg && d.ids.indexOf(lastMsg.id) !== -1) await safeSet("last:" + id, JSON.stringify({ from: lastMsg.from, preview: "🚫 Message supprimé", ts: lastMsg.ts }), true);
    } else {
      const next = Array.from(new Set(hidden.concat(d.ids)));
      setHidden(next);
      await safeSet("hidden:" + me.id + ":" + id, JSON.stringify(next), false);
    }
    setConfirmDel(null);
    setSelMode(false);
    setPicked({});
  };

  const deleteMessage = (mid) => mutate(mid, (x) => Object.assign({}, x, { deleted: true, content: "", reactions: {} }));

  const reactTo = (mid, emoji) =>
    mutate(mid, (x) => {
      const r = Object.assign({}, x.reactions || {});
      if (r[me.id] === emoji) delete r[me.id];
      else r[me.id] = emoji;
      return Object.assign({}, x, { reactions: r });
    });

  const copyText = async (m) => {
    await copyToClipboard(m.content);
    setSelected(null);
  };

  const notifyTyping = () => {
    if (prefs.noTyping) return;
    const now = Date.now();
    if (now - lastTyping.current > 2000) {
      lastTyping.current = now;
      safeSet("typing:" + id + ":" + me.id, String(now), true);
    }
  };

  const toggleIn = (key) => {
    const list = prefs[key] || [];
    const next = list.indexOf(other.id) === -1 ? list.concat([other.id]) : list.filter((x) => x !== other.id);
    onPrefs(Object.assign({}, prefs, { [key]: next }));
    setMenu(false);
  };

  const q = search ? search.toLowerCase() : "";
  const nameOf = (uid) => (uid === me.id ? "Toi" : other.isGroup ? names[uid] || "…" : other.pseudo);
  const vis = messages.filter((m) => hidden.indexOf(m.id) === -1 && m.ts > clearedAt);
  const shown = q ? vis.filter((m) => m.type === "text" && !m.deleted && m.content.toLowerCase().indexOf(q) !== -1) : vis;
  const online = seen && Date.now() - seen < 45000;
  const subtitle = other.isGroup ? gmembers.length + " membres" : typing ? "écrit…" : online ? "en ligne" : seen ? "vu " + (dayLabel(seen) === "Aujourd'hui" ? "à " + fmtTime(seen) : dayLabel(seen).toLowerCase()) : "";

  return (
    <div className="h-full flex flex-col relative" style={{ background: "var(--bg)", color: "var(--fg)" }}>
      <style>{`
        @keyframes stkBeat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.25); } 50% { transform: scale(0.95); } 75% { transform: scale(1.15); } }
        @keyframes stkWave { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(18deg); } 75% { transform: rotate(-14deg); } }
        @keyframes stkSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes stkBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
        @keyframes stkPop { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.3) rotate(8deg); } }
        @keyframes stkShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-6deg); } 75% { transform: translateX(6px) rotate(6deg); } }
      `}</style>

      <div className="px-2 pt-4 pb-2.5 flex items-center gap-2" style={{ borderBottom: "1px solid var(--line)", background: "var(--bg)" }}>
        <button onClick={onBack} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0"><ArrowLeft size={20} /></button>
        <Avatar code={other.id} pseudo={other.pseudo} size={38} />
        <div className="min-w-0 flex-1">
          <div className="font-semibold leading-tight truncate">{other.pseudo}</div>
          <div className="text-[11px] leading-tight" style={{ color: typing || online ? "var(--accent-text)" : "var(--muted)" }}>{subtitle || "\u00A0"}</div>
        </div>
        <button onClick={() => setSearch(search === null ? "" : null)} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ background: search !== null ? "var(--card2)" : "transparent" }}>🔍</button>
        <button onClick={() => onCall("video")} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-lg" style={{ display: other.isGroup ? "none" : "flex" }} title="Appel vidéo">🎥</button>
        <button onClick={() => onCall("audio")} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style={{ color: "var(--accent-text)", display: other.isGroup ? "none" : "flex" }} title="Appel audio"><Phone size={18} /></button>
        <div className="relative shrink-0">
          <button onClick={() => setMenu((v) => !v)} className="w-9 h-9 rounded-full flex items-center justify-center text-xl">⋯</button>
          {menu && (
            <div className="absolute right-0 top-11 z-30 rounded-2xl p-1 w-52 text-sm" style={{ background: "var(--bg)", border: "1px solid var(--line2)", boxShadow: "0 12px 30px -10px rgba(0,0,0,0.5)" }}>
              <button onClick={() => { setSelMode(true); setPicked({}); setMenu(false); }} className="w-full text-left px-3 py-2.5 rounded-xl">Sélectionner des messages</button>
              <button onClick={() => { setConfirmDel({ clearAll: true }); setMenu(false); }} className="w-full text-left px-3 py-2.5 rounded-xl">Vider la discussion</button>
              <button onClick={() => toggleIn("pinned")} className="w-full text-left px-3 py-2.5 rounded-xl">{pinned ? "Désépingler" : "Épingler"}</button>
              <button onClick={() => toggleIn("muted")} className="w-full text-left px-3 py-2.5 rounded-xl">{muted ? "Réactiver le son" : "Mettre en sourdine"}</button>
              {other.isGroup ? (
                <button onClick={() => { setGInfo(true); setMenu(false); }} className="w-full text-left px-3 py-2.5 rounded-xl">Infos du groupe</button>
              ) : (
                <button onClick={() => { toggleIn("blocked"); onBack(); }} className="w-full text-left px-3 py-2.5 rounded-xl" style={{ color: "#FF6B5D" }}>Bloquer</button>
              )}
            </div>
          )}
        </div>
      </div>

      {selMode && (
        <div className="px-3 py-2 flex items-center justify-between" style={{ borderBottom: "1px solid var(--line)", background: "var(--card)" }}>
          <button onClick={() => { setSelMode(false); setPicked({}); }} className="text-sm">Annuler</button>
          <span className="text-sm font-semibold">{Object.keys(picked).length} sélectionné(s)</span>
          <button disabled={!Object.keys(picked).length} onClick={() => askDelete(Object.keys(picked))} className="text-sm font-semibold disabled:opacity-40" style={{ color: "#FF6B5D" }}>Supprimer</button>
        </div>
      )}
      {search !== null && (
        <div className="px-3 py-2 flex items-center gap-2" style={{ borderBottom: "1px solid var(--line)" }}>
          <input autoFocus value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Rechercher dans la conversation" className="flex-1 rounded-full px-4 py-2 text-sm outline-none" style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }} />
          <span className="text-xs shrink-0" style={{ color: "var(--muted)" }}>{q ? shown.length + " résultat" + (shown.length > 1 ? "s" : "") : ""}</span>
        </div>
      )}

      <div
        ref={scrollRef}
        onScroll={onScroll}
        className="flex-1 overflow-y-auto px-3 py-3 flex flex-col"
        style={{ background: "radial-gradient(70% 40% at 85% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent)" }}
      >
        {loading ? (
          <div className="flex justify-center pt-8" style={{ color: "var(--muted)" }}><Loader2 size={18} className="animate-spin" /></div>
        ) : shown.length === 0 ? (
          <div className="text-center text-sm pt-10" style={{ color: "var(--muted)" }}>{q ? "Aucun message trouvé." : "Dis bonjour à " + other.pseudo + " 👋"}</div>
        ) : (
          shown.map((m, i) => {
            const mine = m.from === me.id;
            const prev = shown[i - 1];
            const next = shown[i + 1];
            const newDay = !prev || dayLabel(prev.ts) !== dayLabel(m.ts);
            const gTop = prev && !newDay && prev.from === m.from && m.ts - prev.ts < 120000;
            const gBot = next && next.from === m.from && next.ts - m.ts < 120000 && dayLabel(next.ts) === dayLabel(m.ts);
            const sep = newDay ? (
              <div className="self-center text-[11px] rounded-full px-3 py-1 my-3" style={{ background: "var(--card2)", color: "var(--muted)" }}>{dayLabel(m.ts)}</div>
            ) : null;
            if (m.type === "system") {
              return (
                <React.Fragment key={m.id}>
                  {sep}
                  <div className="self-center text-[11px] rounded-full px-3 py-1 my-1 text-center" style={{ background: "var(--card2)", color: "var(--muted)" }}>{m.content}</div>
                </React.Fragment>
              );
            }
            if (m.type === "sticker") {
              const def = STICKERS.filter((s) => s.id === m.content)[0];
              return (
                <React.Fragment key={m.id}>
                  {sep}
                  <div className={"flex flex-col " + (mine ? "items-end" : "items-start")} onClick={() => selMode && togglePick(m.id)} style={{ marginTop: gTop ? 2 : 8, outline: picked[m.id] ? "2px solid var(--accent)" : "none", outlineOffset: 2, borderRadius: 12 }}>
                    <span style={{ fontSize: 60, lineHeight: 1, display: "inline-block", animation: def ? def.anim.replace("infinite", "3") : "none" }}>{def ? def.emoji : "❓"}</span>
                    <div className="text-[10px] mt-0.5 opacity-60">{fmtTime(m.ts)}</div>
                  </div>
                </React.Fragment>
              );
            }
            const R = 18;
            const S = 5;
            const radius = mine
              ? R + "px " + (gTop ? S : R) + "px " + (gBot ? S : 4) + "px " + R + "px"
              : (gTop ? S : R) + "px " + R + "px " + R + "px " + (gBot ? S : 4) + "px";
            return (
              <React.Fragment key={m.id}>
                {sep}
                <div className={"flex " + (mine ? "justify-end" : "justify-start")} style={{ marginTop: gTop ? 2 : 8 }}>
                  <div
                    className="max-w-[80%] px-3.5 py-2"
                    onClick={() => (selMode ? togglePick(m.id) : !m.deleted && setSelected(selected === m.id ? null : m.id))}
                    style={{
                      borderRadius: radius,
                      outline: picked[m.id] ? "2px solid var(--accent)" : "none",
                      outlineOffset: 2,
                      background: mine ? "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))" : "var(--card2)",
                      color: mine ? "var(--on-accent)" : "var(--fg)",
                      border: mine ? "none" : "1px solid var(--line)",
                    }}
                  >
                    {other.isGroup && !mine && !gTop && <div className="text-[11px] font-semibold mb-0.5" style={{ color: colorFor(m.from) }}>{names[m.from] || "…"}</div>}
                    {m.replyTo && !m.deleted && (
                      <div className="text-[11px] rounded-lg px-2 py-1 mb-1 truncate" style={{ background: "rgba(0,0,0,0.15)", borderLeft: "2px solid currentColor" }}>
                        {nameOf(m.replyTo.from)} : {m.replyTo.preview}
                      </div>
                    )}
                    {m.deleted ? (
                      <div className="text-sm italic opacity-70">🚫 Message supprimé</div>
                    ) : m.type === "text" ? (
                      <div className="whitespace-pre-wrap break-words" style={{ fontSize: "var(--fs)" }}>{linkify(m.content)}</div>
                    ) : m.type === "image" ? (
                      <img src={m.content} alt="photo envoyée" className="rounded-xl max-w-full" onClick={(e) => { e.stopPropagation(); setViewer(m.content); }} />
                    ) : m.type === "file" ? (
                      <a href={m.content} download={m.name} onClick={(e) => e.stopPropagation()} className="flex items-center gap-3 min-w-[180px]">
                        <span className="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0" style={{ background: "rgba(0,0,0,0.15)" }}>📄</span>
                        <span className="min-w-0">
                          <span className="block text-sm font-medium truncate">{m.name}</span>
                          <span className="block text-[11px] opacity-70">{fmtSize(m.size || 0)} · Télécharger</span>
                        </span>
                      </a>
                    ) : m.type === "calllog" ? (
                      <div className="flex items-center gap-2 text-sm">
                        <span>{m.kind === "video" ? "📹" : "📞"}</span>
                        <span>{m.result === "missed" ? (mine ? "Appel sans réponse" : "Appel manqué") : m.result === "declined" ? "Appel refusé" : "Appel " + (m.kind === "video" ? "vidéo " : "") + "· " + fmtDur(m.dur || 0)}</span>
                      </div>
                    ) : m.type === "audio" ? (
                      <div onClick={(e) => e.stopPropagation()}>
                        <audio controls src={m.content} style={{ height: 36, maxWidth: "100%" }} />
                        {m.dur ? <div className="text-[10px] opacity-60 mt-0.5">🎤 {m.dur} s</div> : null}
                      </div>
                    ) : (
                      <div className="flex items-center gap-2 text-sm">
                        <Phone size={15} />
                        <span>{mine ? "Tu as demandé à appeler" : other.pseudo + " souhaite t'appeler"}</span>
                      </div>
                    )}
                    {!gBot && (
                      <div className="text-[10px] mt-0.5 opacity-60 text-right">
                        {m.edited && !m.deleted ? "modifié · " : ""}
                        {fmtTime(m.ts)}
                        {mine && !m.deleted ? (m.ts <= otherRead ? " ✓✓" : " ✓") : ""}
                      </div>
                    )}
                    {m.reactions && Object.keys(m.reactions).length > 0 && (
                      <div className="flex gap-1 mt-1 flex-wrap">
                        {REACTS.map((em) => {
                          const n = Object.keys(m.reactions).filter((u) => m.reactions[u] === em).length;
                          return n > 0 ? <span key={em} className="text-[11px] rounded-full px-1.5" style={{ background: "rgba(0,0,0,0.15)" }}>{em} {n}</span> : null;
                        })}
                      </div>
                    )}
                    {selected === m.id && !m.deleted && (
                      <div className="mt-1.5 flex items-center gap-1.5 flex-wrap" onClick={(e) => e.stopPropagation()}>
                        {REACTS.map((em) => (
                          <button key={em} onClick={() => reactTo(m.id, em)} className="text-base leading-none px-0.5">{em}</button>
                        ))}
                        <button onClick={() => { setReplyTo({ id: m.id, from: m.from, preview: previewOf(m).slice(0, 50) }); setSelected(null); }} className="text-[11px] underline ml-1">Répondre</button>
                        {m.type === "text" && <button onClick={() => copyText(m)} className="text-[11px] underline">Copier</button>}
                        {mine && m.type === "text" && <button onClick={() => { setEditing(m.id); setText(m.content); setSelected(null); }} className="text-[11px] underline">Modifier</button>}
                        <button onClick={() => { setSelMode(true); setPicked({ [m.id]: true }); setSelected(null); }} className="text-[11px] underline">Sélectionner</button>
                        <button onClick={() => askDelete([m.id])} className="text-[11px] underline" style={{ color: "#FF6B5D" }}>Supprimer</button>
                      </div>
                    )}
                  </div>
                </div>
              </React.Fragment>
            );
          })
        )}
      </div>

      {!atBottom && (
        <button

// ---------- Settings ----------

async function loadGroup(gid) {
  const raw = await safeGet("group:" + gid, true);
  return raw ? JSON.parse(raw) : null;
}

async function addToIndex(uid, gid) {
  const raw = await safeGet("groups:" + uid, true);
  const arr = raw ? JSON.parse(raw) : [];
  if (arr.indexOf(gid) === -1) await safeSet("groups:" + uid, JSON.stringify(arr.concat([gid])), true);
}

async function removeFromIndex(uid, gid) {
  const raw = await safeGet("groups:" + uid, true);
  if (!raw) return;
  await safeSet("groups:" + uid, JSON.stringify(JSON.parse(raw).filter((x) => x !== gid)), true);
}

async function appendGroupMsg(gid, members, fromId, msg) {
  const raw = await safeGet("conv:" + gid, true);
  const list = raw ? JSON.parse(raw) : [];
  await safeSet("conv:" + gid, JSON.stringify(list.concat([msg])), true);
  await safeSet("last:" + gid, JSON.stringify({ from: fromId, preview: previewOf(msg), ts: msg.ts }), true);
  for (let i = 0; i < members.length; i++) {
    if (members[i] === fromId) continue;
    const ru = await safeGet("unread:" + gid + ":" + members[i], true);
    await safeSet("unread:" + gid + ":" + members[i], String((parseInt(ru, 10) || 0) + 1), true);
  }
}

async function deleteGroupData(gid) {
  const g = await loadGroup(gid);
  if (g) { for (let i = 0; i < g.members.length; i++) await removeFromIndex(g.members[i], gid); }
  const un = await safeList("unread:" + gid + ":");
  await Promise.all(["group:" + gid, "conv:" + gid, "last:" + gid].concat(un).map((k) => safeDelete(k, true)));
}

function GroupInfo({ me, gid, onClose, onLeft, onChanged }) {
  const [g, setG] = useState(null);
  const [names, setNames] = useState({});
  const [friends, setFriends] = useState([]);
  const [sel, setSel] = useState({});
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);

  const load = async () => {
    const grp = await loadGroup(gid);
    if (!grp) return;
    setG(grp);
    setName(grp.name);
    const o = {};
    await Promise.all(grp.members.map(async (u) => {
      const pr = await safeGet("profile:" + u, true);
      if (pr) { const pp = JSON.parse(pr); o[u] = pp.pseudo; if (pp.avatar) AVATARS[u] = pp.avatar; }
    }));
    setNames(o);
    const fr = await getFriendIds(me);
    const fl = await Promise.all(fr.filter((x) => grp.members.indexOf(x) === -1).map(async (u) => {
      const pr = await safeGet("profile:" + u, true);
      return pr ? { id: u, pseudo: JSON.parse(pr).pseudo } : null;
    }));
    setFriends(fl.filter(Boolean));
  };
  useEffect(() => { load(); }, []);

  const sysMsg = (text) => ({ id: Date.now() + "-" + Math.random(), from: me.id, type: "system", content: text, ts: Date.now() });
  const save = async (ng, text) => {
    await safeSet("group:" + gid, JSON.stringify(ng), true);
    if (text) await appendGroupMsg(gid, ng.members, me.id, sysMsg(text));
    onChanged(ng);
    await load();
  };

  const isAdmin = g && g.admin === me.id;
  const rename = async () => {
    const n = name.trim();
    if (n.length < 2 || n === g.name) return;
    await save(Object.assign({}, g, { name: n }), me.pseudo + " a renommé le groupe « " + n + " »");
  };
  const removeMember = async (u) => {
    await removeFromIndex(u, gid);
    await save(Object.assign({}, g, { members: g.members.filter((x) => x !== u) }), me.pseudo + " a retiré " + (names[u] || "un membre"));
  };
  const addMembers = async () => {
    const ids = Object.keys(sel);
    if (!ids.length) return;
    for (let i = 0; i < ids.length; i++) await addToIndex(ids[i], gid);
    const nm = friends.filter((f) => sel[f.id]).map((f) => f.pseudo).join(", ");
    setSel({});
    await save(Object.assign({}, g, { members: g.members.concat(ids) }), me.pseudo + " a ajouté " + nm);
  };
  const leave = async () => {
    setBusy(true);
    const rest = g.members.filter((x) => x !== me.id);
    await removeFromIndex(me.id, gid);
    if (rest.length === 0) {
      await deleteGroupData(gid);
    } else {
      const ng = Object.assign({}, g, { members: rest, admin: g.admin === me.id ? rest[0] : g.admin });
      await safeSet("group:" + gid, JSON.stringify(ng), true);
      await appendGroupMsg(gid, rest, me.id, sysMsg(me.pseudo + " a quitté le groupe"));
    }
    setBusy(false);
    onLeft();
  };

  const card = { background: "var(--card)", border: "1px solid var(--line)" };
  return (
    <div className="px-4 pt-5 pb-10 overflow-y-auto" style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0, zIndex: 45, background: "var(--bg)", color: "var(--fg)" }}>
      <div className="flex items-center gap-2 mb-5">
        <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center"><ArrowLeft size={20} /></button>
        <h1 className="text-xl font-bold">Infos du groupe</h1>
      </div>
      {!g ? <div className="flex justify-center pt-8"><Loader2 size={20} className="animate-spin" /></div> : (
        <>
          <div className="flex flex-col items-center mb-5">
            <Avatar code={gid} pseudo={g.name} size={84} />
            <input value={name} onChange={(e) => setName(e.target.value)} disabled={!isAdmin} maxLength={30} className="mt-3 text-center text-lg font-bold rounded-xl px-3 py-2 outline-none w-full" style={{ background: isAdmin ? "var(--card)" : "transparent", color: "var(--fg)", border: isAdmin ? "1px solid var(--line)" : "none" }} />
            {isAdmin && name.trim() !== g.name && <button onClick={rename} className="mt-2 rounded-xl px-4 py-2 text-xs font-semibold" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>Renommer</button>}
          </div>
          <div className="text-[11px] uppercase tracking-widest mb-2 px-1" style={{ color: "var(--muted)" }}>Membres ({g.members.length})</div>
          <div className="rounded-2xl p-2 mb-5" style={card}>
            {g.members.map((u) => (
              <div key={u} className="flex items-center gap-3 px-2 py-2">
                <Avatar code={u} pseudo={names[u] || "?"} size={36} />
                <div className="flex-1 min-w-0 text-sm font-medium truncate">{u === me.id ? "Toi" : names[u] || "…"}</div>
                {g.admin === u && <span className="text-[10px] rounded-full px-2 py-0.5" style={{ background: "var(--card2)" }}>Admin</span>}
                {isAdmin && u !== me.id && <button onClick={() => removeMember(u)} className="text-xs" style={{ color: "#FF6B5D" }}>Retirer</button>}
              </div>
            ))}
          </div>
          {friends.length > 0 && (
            <>
              <div className="text-[11px] uppercase tracking-widest mb-2 px-1" style={{ color: "var(--muted)" }}>Ajouter des membres</div>
              <div className="rounded-2xl p-2 mb-3" style={card}>
                {friends.map((f) => (
                  <button key={f.id} onClick={() => setSel((s) => { const n = Object.assign({}, s); if (n[f.id]) delete n[f.id]; else n[f.id] = true; return n; })} className="w-full flex items-center gap-3 px-2 py-2 text-left">
                    <Avatar code={f.id} pseudo={f.pseudo} size={32} />
                    <span className="flex-1 text-sm">{f.pseudo}</span>
                    <span>{sel[f.id] ? "☑️" : "⬜"}</span>
                  </button>
                ))}
              </div>
              <button onClick={addMembers} disabled={!Object.keys(sel).length} className="w-full rounded-xl py-3 text-sm font-semibold mb-6 disabled:opacity-40" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>Ajouter</button>
            </>
          )}
          <button onClick={leave} disabled={busy} className="w-full rounded-2xl py-3.5 text-sm font-semibold" style={{ background: "rgba(255,107,93,0.15)", color: "#FF6B5D" }}>Quitter le groupe</button>
        </>
      )}
    </div>
  );
}

function useInstall() {
  const [prompt, setPrompt] = useState(window.__installPrompt || null);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const h = () => setPrompt(window.__installPrompt || null);
    const d = () => setDone(true);
    window.addEventListener("installready", h);
    window.addEventListener("appinstalled", d);
    return () => { window.removeEventListener("installready", h); window.removeEventListener("appinstalled", d); };
  }, []);
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true || done;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const install = async () => {
    if (!prompt) return;
    prompt.prompt();
    try { await prompt.userChoice; } catch (e) { /* ignore */ }
    window.__installPrompt = null;
    setPrompt(null);
  };
  return { prompt: prompt, standalone: standalone, ios: ios, install: install };
}

function Settings({ me, prefs, onPrefs, onProfileUpdate, onBack, onLogout, onAdmin }) {
  const [pseudo, setPseudo] = useState(me.pseudo);
  const [oldPw, setOldPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [msg, setMsg] = useState("");
  const [copied, setCopied] = useState(false);
  const set = (patch) => onPrefs(Object.assign({}, prefs, patch));
  const field = "w-full rounded-xl px-4 py-3 text-sm outline-none mb-2";
  const fieldStyle = { background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--line)" };
  const btn = "rounded-xl px-4 py-2.5 text-sm font-semibold";
  const btnStyle = { background: "var(--accent)", color: "var(--on-accent)" };
  const [delOpen, setDelOpen] = useState(false);
  const [delPw, setDelPw] = useState("");
  const inst = useInstall();
  const avFile = useRef(null);
  const sizes = [[14, "Petit"], [15, "Normal"], [17, "Grand"]];

  const soundFile = useRef(null);
  const [soundUrl, setSoundUrl] = useState("");
  const [soundBusy, setSoundBusy] = useState(false);
  useEffect(() => { safeGet("sound:" + me.id, false).then((u) => setSoundUrl(u || "")); }, []);
  const pickSound = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > SOUND_MAX) { flash("Fichier trop lourd (max " + fmtSize(SOUND_MAX) + ")."); return; }
    setSoundBusy(true);
    try {
      const dataUrl = await readAsDataURL(f);
      await safeSet("sound:" + me.id, dataUrl, false);
      setCustomSoundCache(dataUrl);
      setSoundUrl(dataUrl);
      flash("Sonnerie enregistrée ✓");
    } catch (err) { flash("Fichier audio illisible."); }
    setSoundBusy(false);
  };
  const removeSound = async () => {
    await safeDelete("sound:" + me.id, false);
    setCustomSoundCache("");
    setSoundUrl("");
  };

  const [camRes, setCamRes] = useState(null);
  const [camBusy, setCamBusy] = useState(false);
  const testDevices = async () => {
    setCamBusy(true);
    setCamRes(null);
    const out = { mic: "non testé", cam: "non testé" };
    try {
      const s1 = await navigator.mediaDevices.getUserMedia({ audio: true });
      out.mic = "✅ Micro OK";
      s1.getTracks().forEach((t) => t.stop());
    } catch (e) { out.mic = "❌ Micro refusé ou indisponible (" + (e && e.name) + ")"; }
    try {
      const s2 = await navigator.mediaDevices.getUserMedia({ video: true });
      out.cam = "✅ Caméra OK";
      s2.getTracks().forEach((t) => t.stop());
    } catch (e) { out.cam = "❌ Caméra refusée ou indisponible (" + (e && e.name) + ")"; }
    setCamRes(out);
    setCamBusy(false);
  };

  const perm = typeof Notification !== "undefined" ? Notification.permission : "unsupported";
  const toggleNotif = async () => {
    if (notifOn(prefs)) { set({ notif: false }); return; }
    if (typeof Notification === "undefined") { flash("Notifications non supportées sur ce navigateur."); return; }
    const r = await Notification.requestPermission();
    if (r === "granted") { set({ notif: true }); notify("Notifications activées", "Tu seras prévenu des nouveaux messages.", "test"); }
    else flash("Autorise les notifications dans les réglages du navigateur.");
  };

  const deleteMine = async () => {
    const rawAcc = await safeGet("account:" + me.code, true);
    if (!rawAcc) { flash("Compte introuvable."); return; }
    const acc = JSON.parse(rawAcc);
    const check = await hashPassword(delPw, acc.salt);
