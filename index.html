<style id="v54">
.stNav{backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(0,0,0,.18)}
.stNav button{transition:transform .15s ease,color .2s}
.stNav button:active{transform:scale(.88)}
.stCard{box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .2s ease}
button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
.fluxCard button{background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center}

.fluxCard{animation:fxIn .35s ease}
::-webkit-scrollbar{width:0;height:0}
input:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(120,200,190,.25)}
.wlc{position:relative;overflow:hidden}
.wBlob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none;animation:wFloat 9s ease-in-out infinite}
.wB1{width:260px;height:260px;background:var(--accent);top:-60px;right:-80px}
.wB2{width:220px;height:220px;background:#FF6B5D;bottom:-40px;left:-80px;animation-delay:-4s}
.wlc>:not(.wBlob){position:relative;z-index:1}
@keyframes wFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-25px)}}
.wLogo{animation:wBob 3.5s ease-in-out infinite}
@keyframes wBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
html.hc{filter:contrast(1.22) saturate(1.05)}
html.hc button,html.hc input,html.hc textarea{border-width:2px}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}

  t("stories vidéo : expirées exclues, actives gardées", function () { var raw = JSON.stringify([{ id: "a", ts: now, st: 1, n: 1 }, { id: "b", ts: now - 3e8, st: 1, n: 1 }, { id: "c", ts: now, n: 1 }]), r = vidStories(raw); eq(r.length, 1); eq(r[0].id, "a"); eq(r[0].k, "vid"); });
  t("identifiant de conversation symétrique", function () { eq(convId("a", "b"), convId("b", "a")); });
  t("version affichée dans l'appli", function () { eq(document.body.innerText.indexOf("v5.4.3.2") !== -1 || !!document.getElementById("stVer"), true); });
  async function run(box) {
    var ok = 0, ko = 0; box.innerHTML = "";
    for (var i = 0; i < T.length; i++) {
      var row = document.createElement("div"), err = "";
      try { await T[i][1](); ok++; } catch (e) { ko++; err = String(e && e.message || e); }
      row.style.cssText = "padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px";
      row.textContent = (err ? "❌ " : "✅ ") + T[i][0] + (err ? " — " + err : ""); box.appendChild(row);
    }
    return { ok: ok, ko: ko };
  }
  function show() {
    if (document.getElementById("stTests")) return;
    var ov = document.createElement("div"); ov.id = "stTests";
    ov.style.cssText = "position:fixed;inset:0;z-index:300;background:#0c0c12;color:#fff;overflow:auto;padding:20px;font-family:system-ui,sans-serif";
    ov.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b style="font-size:18px">🧪 Tests automatiques · v5.4.3.2</b><button id="stTx" style="font-size:20px;color:#fff">✕</button></div><div id="stTs2" style="font-size:14px;margin-bottom:10px;opacity:.85">Exécution…</div><div id="stTl"></div>';
    document.body.appendChild(ov);
    ov.querySelector("#stTx").onclick = function () { ov.remove(); if (location.hash === "#tests") history.replaceState(null, "", location.pathname + location.search); };
    run(ov.querySelector("#stTl")).then(function (r) { ov.querySelector("#stTs2").textContent = r.ko ? "❌ " + r.ko + " échec(s) sur " + (r.ok + r.ko) : "✅ Tous les tests réussis (" + r.ok + ")"; });
  }
  window.__showTests = show; window.__runTests = function () { var d = document.createElement("div"); return run(d); };
  if (/(^|[?&#])tests\b/.test(location.search + location.hash)) setTimeout(show, 1200);
})();
