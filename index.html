// ---------- Messages programmés ----------
function readSched(meId) { try { return JSON.parse(localStorage.getItem("st_sched:" + meId) || "[]"); } catch (e) { return []; } }
function writeSched(meId, l) { try { localStorage.setItem("st_sched:" + meId, JSON.stringify(l)); } catch (e) { /* plein */ } }
function MsgScheduler({ me }) {
  useEffect(() => {
    let busy = false;
    const run = async () => {
      if (busy || !navigator.onLine) return;
      const l = readSched(me.id);
      const now = Date.now();
      const due = l.filter((x) => x.at <= now);
      if (!due.length) return;
      busy = true;
      for (let i = 0; i < due.length; i++) {
        try {
          const it = due[i];
          await sendTo(me, it.to, { id: Date.now() + "-" + Math.random(), from: me.id, type: "text", content: it.text, ts: Date.now() });
          writeSched(me.id, readSched(me.id).filter((x) => x.sid !== it.sid));
        } catch (e) { /* on réessaiera */ }
      }
      busy = false;
    };
    run();
    const t = setInterval(run, 8000);
    return () => clearInterval(t);
  }, [me.id]);
  return null;
}

// ---------- Position (toujours avec accord explicite) ----------
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) { rej(new Error("nogeo")); return; }
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0) }), (e) => rej(e), { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  });
}
function readShares(meId) { try { return JSON.parse(localStorage.getItem("st_locshare:" + meId) || "{}"); } catch (e) { return {}; } }
function writeShares(meId, o) { try { localStorage.setItem("st_locshare:" + meId, JSON.stringify(o)); } catch (e) { /* plein */ } }
const osmEmbed = (l) => "https://www.openstreetmap.org/export/embed.html?bbox=" + [l.lng - 0.004, l.lat - 0.0025, l.lng + 0.004, l.lat + 0.0025].join("%2C") + "&layer=mapnik&marker=" + l.lat + "%2C" + l.lng;
const osmLink = (l) => "https://www.openstreetmap.org/?mlat=" + l.lat + "&mlon=" + l.lng + "#map=16/" + l.lat + "/" + l.lng;
function LocationSharer({ me }) {
  useEffect(() => {
    let busy = false;
    const run = async () => {
      if (busy) return;
      const sh = readShares(me.id);
      const ids = Object.keys(sh);
      if (!ids.length) return;
      busy = true;
      const now = Date.now();
      let changed = false;
      let pos = null;
      for (let i = 0; i < ids.length; i++) {
        const oid = ids[i];
        if (sh[oid] < now) { delete sh[oid]; changed = true; await safeDelete("loc:" + me.id + ":" + oid, true); continue; }
        try {
          if (!pos) pos = await getPos();
          await safeSet("loc:" + me.id + ":" + oid, JSON.stringify({ lat: pos.lat, lng: pos.lng, acc: pos.acc, ts: Date.now(), exp: sh[oid] }), true);
        } catch (e) { /* position indisponible pour l'instant */ }
      }
      if (changed) writeShares(me.id, sh);
      busy = false;
    };
    run();
    const t = setInterval(run, 20000);
    return () => clearInterval(t);
  }, [me.id]);
  return null;
}
function LocationBubble({ l }) {

function LockScreen({ me, onUnlock, onLogout }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);
  const [tries, setTries] = useState(0);
  const [until, setUntil] = useState(0);
  const press = async (d) => {
    if (Date.now() < until) return;
    const n = (pin + d).slice(0, 4);
    setPin(n);
    if (n.length < 4) return;
    const raw = await safeGet("lock:" + me.id, false);
    let l = null;
    try { l = raw ? JSON.parse(raw) : null; } catch (e) { l = null; }
    const h = l ? await hashPassword(n, l.salt) : "";
    if (l && h === l.hash) { onUnlock(); return; }
    setErr(true);
    const t = tries + 1;
    setTries(t);
    if (t % 5 === 0) setUntil(Date.now() + 30000);
    setTimeout(() => { setPin(""); setErr(false); }, 500);
  };
  const locked = Date.now() < until;
  return (
    <div className="fixed inset-0 z-[100] flex flex-col items-center justify-center px-8" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>

      <div className="flex gap-3 mb-8">
        {[0, 1, 2, 3].map((i) => <span key={i} style={{ width: 14, height: 14, borderRadius: 7, background: i < pin.length ? (err ? "#FF6B5D" : "var(--accent)") : "var(--line2)", transition: "background .15s" }} />)}
      </div>
      <div className="grid grid-cols-3 gap-4" style={{ width: 240 }}>
        {["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map((k, i) => k === "" ? <span key={i} /> : (
          <button key={i} onClick={() => (k === "⌫" ? setPin((p) => p.slice(0, -1)) : press(k))} className="h-16 rounded-full text-2xl font-semibold" style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>{k}</button>
        ))}
      </div>
      <button onClick={onLogout} className="mt-8 text-xs underline" style={{ color: "var(--muted)" }}>Code oublié ? Se déconnecter</button>
    </div>
  );
}

      const reg = await getSW();
      if (!reg) L.push("Test : service worker introuvable (sw.js absent de GitHub ?)");
      else { await reg.showNotification("Test local", { body: "Si tu vois ceci, les notifications locales marchent.", icon: "icon-192.png", badge: "badge.png", tag: "msg-test" }); L.push("Test local : notification envoyée ✓"); }
    } catch (e) { L.push("Test local : erreur « " + (e && e.message) + " »"); }
    setDiag(L.join("\n"));
  };
  const loadShares = async () => {
    const sh = readShares(me.id);
    const out = [];
    for (const oid of Object.keys(sh)) { if (sh[oid] > Date.now()) { const pr = await safeGet("profile:" + oid, true); out.push({ id: oid, exp: sh[oid], pseudo: pr ? JSON.parse(pr).pseudo : "?" }); } }
    setShares(out);
  };
  const stopOne = async (oid) => { const sh = readShares(me.id); delete sh[oid]; writeShares(me.id, sh); await safeDelete("loc:" + me.id + ":" + oid, true); loadShares(); };
  const field = "w-full rounded-xl px-4 py-3 text-sm outline-none mb-2";
  const fieldStyle = { background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--line)" };
  const refresh = async () => {
    setE2e(!!(await safeGet("e2e:priv:" + me.id, false)));
    setHasPin(!!(await safeGet("lock:" + me.id, false)));
    setPush(await registerPush(me));
  };
  useEffect(() => { refresh(); loadShares(); }, []);
  const note = (t) => { setMsg(t); setTimeout(() => setMsg(""), 4000); };
  const enableE2E = async () => {
    setBusy(true);
    const rawAcc = await safeGet("account:" + me.code, true);
    const acc = rawAcc ? JSON.parse(rawAcc) : null;
    if (!acc || (await hashPassword(pw, acc.salt)) !== acc.hash) { setBusy(false); note("Mot de passe incorrect."); return; }
    const ok = await e2eSetup(me.id, pw);
    setPw("");
    setBusy(false);
    note(ok ? "Chiffrement activé ✓" : "Chiffrement indisponible sur ce navigateur (https requis).");
    refresh();
  };
  const savePin = async () => {
    if (!/^\d{4}$/.test(pin)) { note("Le code doit faire 4 chiffres."); return; }
    const salt = randomSalt();
    await safeSet("lock:" + me.id, JSON.stringify({ salt: salt, hash: await hashPassword(pin, salt) }), false);
    setPin("");
    window.dispatchEvent(new Event("st-lock-changed"));
    note("Code de verrouillage activé ✓");
    refresh();
  };
  const removePin = async () => { await safeDelete("lock:" + me.id, false); window.dispatchEvent(new Event("st-lock-changed")); note("Verrouillage désactivé."); refresh(); };
  const testPush = async () => {
    if (push !== "ok") { note("Active d'abord les notifications (voir ci-dessous)."); return; }
    await pingPush([me.id], "Sans-Trace", "Test réussi ✅ Les notifications fonctionnent appli fermée.", "msg-test");
    note("Test envoyé : ferme complètement l'appli, la notification arrive dans quelques secondes.");
  };
  const pushLabel = { ok: "✅ Actives (même appli fermée)", noserver: "⚠️ Serveur de notifications non configuré (voir le guide)", unsupported: "⚠️ Non supportées par ce navigateur", noperm: "⚠️ Autorise d'abord les notifications ci-dessous", nosw: "⚠️ Service worker absent : ouvre l'appli en https" }[push] || (String(push).indexOf("err") === 0 ? "❌ " + push : "…");
  return (
    <Card title="Sécurité">
      <Row label="Chiffrement de bout en bout" hint={e2e ? "Actif : tes messages privés sont illisibles pour le serveur" : "Inactif sur cet appareil"} right={<span className="text-lg">{e2e ? "🔒" : "🔓"}</span>} />
      {e2e === false && (
        <div className="mb-3">
          <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} placeholder="Ton mot de passe pour l'activer" className={field} style={fieldStyle} />
          <button onClick={enableE2E} disabled={busy || !pw} className="rounded-xl px-4 py-2.5 text-sm font-semibold disabled:opacity-40" style={pBtn}>Activer le chiffrement</button>
        </div>
      )}
      <p className="text-[11px] mb-3" style={{ color: "var(--muted)" }}>Les discussions de groupe ne sont pas chiffrées de bout en bout. Si l'administrateur réinitialise ton mot de passe, tes anciens messages chiffrés deviennent illisibles.</p>
      {prefs && onPrefs && <div className="pt-3" style={{ borderTop: "1px solid var(--line)" }}><Row label="Flouter l'appli en arrière-plan" hint="Cache le contenu dans la liste des applis récentes" right={<Toggle on={!!prefs.blurBg} onClick={() => onPrefs(Object.assign({}, prefs, { blurBg: !prefs.blurBg }))} />} /></div>}
      <div className="pt-3" style={{ borderTop: "1px solid var(--line)" }}>
        <Row label="Verrouiller l'appli par un code" hint={hasPin ? "Code actif (verrouillage après 30 s en arrière-plan)" : "Code à 4 chiffres"} right={<span className="text-lg">{hasPin ? "🔐" : "🔓"}</span>} />
        {!hasPin ? (
          <div className="flex gap-2">
            <input inputMode="numeric" maxLength={4} value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, ""))} placeholder="4 chiffres" className="flex-1 rounded-xl px-4 py-3 text-sm outline-none" style={fieldStyle} />
            <button onClick={savePin} className="rounded-xl px-4 text-sm font-semibold" style={pBtn}>Activer</button>
          </div>
        ) : <button onClick={removePin} className="rounded-xl px-4 py-2.5 text-sm font-semibold" style={cBtn}>Désactiver le code</button>}
      </div>
      <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--line)" }}>
        <Row label="Notifications en arrière-plan" hint={pushLabel} right={<span />} />
        <div className="flex gap-2">
          <button onClick={async () => { setPush(await registerPush(me)); }} className="flex-1 rounded-xl py-2.5 text-xs font-semibold" style={cBtn}>Réactiver</button>
          <button onClick={testPush} className="flex-1 rounded-xl py-2.5 text-xs font-semibold" style={pBtn}>Tester (appli fermée)</button>
        </div>
        <button onClick={runDiag} className="w-full rounded-xl py-2.5 text-xs font-semibold mt-2" style={cBtn}>🔍 Diagnostic des notifications</button>
        {diag && <pre className="mt-2 text-[11px] rounded-xl px-3 py-2" style={{ background: "var(--card2)", whiteSpace: "pre-wrap" }}>{diag}</pre>}
      </div>
      <div className="mt-3 pt-3" style={{ borderTop: "1px solid var(--line)" }}>
        <Row label="Partages de position" hint={shares.length ? "Ces contacts voient ta position" : "Tu ne partages ta position avec personne"} right={<span className="text-lg">📍</span>} />
        {shares.map((s) => (
          <div key={s.id} className="flex items-center justify-between py-1.5 text-sm">
            <span>{s.pseudo} <span className="text-[11px]" style={{ color: "var(--muted)" }}>· {s.exp - Date.now() > 5e11 ? "en permanence" : "jusqu'à " + new Date(s.exp).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}</span></span>
            <button onClick={() => stopOne(s.id)} className="rounded-lg px-3 py-1 text-xs font-semibold" style={{ background: "rgba(255,107,93,0.15)", color: "#FF6B5D" }}>Arrêter</button>
          </div>
        ))}
      </div>
      {msg && <div className="mt-3 text-xs rounded-xl px-3 py-2" style={{ background: "var(--card2)" }}>{msg}</div>}
    </Card>
  );
}

// ---------- Appels de groupe (maillage WebRTC, signalisation via Firebase) ----------
function Tile({ stream, name, mine, pseudo, id }) {
  const ref = useRef(null);
  const [hasVid, setHasVid] = useState(false);
  useEffect(() => {
    if (ref.current && stream && ref.current.srcObject !== stream) ref.current.srcObject = stream;
    const check = () => setHasVid(!!stream && stream.getVideoTracks().some((t) => t.enabled && t.readyState === "live"));
    check();
    const t = setInterval(check, 1500);
    return () => clearInterval(t);
  }, [stream]);
  return (
    <div className="relative rounded-2xl overflow-hidden flex items-center justify-center" style={{ background: "#16191f", minHeight: 150 }}>
      <div className="absolute inset-0 flex items-center justify-center"><Avatar code={id} pseudo={pseudo} size={64} /></div>
      <video ref={ref} autoPlay playsInline muted={!!mine} className="absolute inset-0 w-full h-full" style={{ objectFit: "cover", opacity: hasVid ? 1 : 0, transform: mine ? "scaleX(-1)" : "none" }} />
      <div className="absolute left-2 bottom-2 text-[11px] rounded-full px-2 py-0.5" style={{ background: "rgba(0,0,0,0.55)", color: "#fff" }}>{name}</div>
    </div>
  );
}
function GroupCall({ me, group, members, names, kind, onClose }) {
  const [tiles, setTiles] = useState({});
  const [localStream, setLocalStream] = useState(null);
  const [muted, setMuted] = useState(false);
  const [camOn, setCamOn] = useState(kind === "video");
  const [err, setErr] = useState("");
  const [parts, setParts] = useState([]);
  const streamRef = useRef(null);
  const peers = useRef({});
  const myJ = useRef(Math.random().toString(36).slice(2, 8));
  const alive = useRef(true);
  const gid = group.id;

  useEffect(() => {
    alive.current = true;
    let hb = null, poll = null, busy = false;
    const closePeer = (u) => {
      const P = peers.current[u];
      if (P) { try { P.pc.close(); } catch (e) { /* ignore */ } delete peers.current[u]; }
      setTiles((t) => { const n = Object.assign({}, t); delete n[u]; return n; });
    };
    const flush = async (u, P) => {
      if (P.dirty) { P.dirty = false; await safeSet("gsig:" + gid + ":" + me.id + ":" + u, JSON.stringify({ sid: P.sid, desc: P.desc, ice: P.ice }), true); }
    };
    const openPeer = async (u, theirJ) => {
      const pc = new RTCPeerConnection(ICE_CONFIG);
      const P = { pc: pc, theirJ: theirJ, offerer: me.id < u, sid: null, ice: [], desc: null, dirty: false, remoteSet: false, icesSeen: 0 };
      peers.current[u] = P;
      streamRef.current.getTracks().forEach((t) => pc.addTrack(t, streamRef.current));
      pc.ontrack = (ev) => { setTiles((t) => Object.assign({}, t, { [u]: ev.streams[0] })); };
      pc.onicecandidate = (ev) => { if (ev.candidate) { P.ice.push(ev.candidate.toJSON()); P.dirty = true; } };
      if (P.offerer) {
        P.sid = myJ.current + "-" + theirJ;
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        P.desc = { type: "offer", sdp: offer.sdp };
        P.dirty = true;
      }
    };
    const servePeer = async (u) => {
      const P = peers.current[u];
      if (!P) return;
      const raw = await safeGet("gsig:" + gid + ":" + u + ":" + me.id, true);
      let s = null;
      try { s = raw ? JSON.parse(raw) : null; } catch (e) { s = null; }
      if (s && s.sid) {
        if (P.offerer) {
          if (s.sid === P.sid && s.desc && s.desc.type === "answer" && !P.remoteSet) { await P.pc.setRemoteDescription(s.desc); P.remoteSet = true; }
        } else if (s.desc && s.desc.type === "offer" && s.sid === P.theirJ + "-" + myJ.current && !P.remoteSet) {
          await P.pc.setRemoteDescription(s.desc);
          P.remoteSet = true;
          P.sid = s.sid;
          const ans = await P.pc.createAnswer();
          await P.pc.setLocalDescription(ans);
          P.desc = { type: "answer", sdp: ans.sdp };
          P.dirty = true;
        }
        if (P.remoteSet && s.sid === P.sid && Array.isArray(s.ice)) {
          while (P.icesSeen < s.ice.length) { try { await P.pc.addIceCandidate(s.ice[P.icesSeen]); } catch (e) { /* ignore */ } P.icesSeen++; }
        }
      }
      await flush(u, P);
    };
    const tick = async () => {
      if (!alive.current || busy) return;
      busy = true;
      try {
        const others = members.filter((u) => u !== me.id);
        const pres = await Promise.all(others.map(async (u) => {
          const r = await safeGet("gcp:" + gid + ":" + u, true);
          try { const p = r ? JSON.parse(r) : null; return p && Date.now() - p.t < 14000 ? { u: u, j: p.j } : null; } catch (e) { return null; }
        }));
        const live = pres.filter(Boolean);
        setParts(live.map((x) => x.u));
        Object.keys(peers.current).forEach((u) => { const l = live.filter((x) => x.u === u)[0]; if (!l || l.j !== peers.current[u].theirJ) closePeer(u); });
        for (let i = 0; i < live.length; i++) {
          if (!alive.current) break;
          if (!peers.current[live[i].u]) await openPeer(live[i].u, live[i].j);
          await servePeer(live[i].u);
        }
      } catch (e) { /* on réessaiera */ }
      busy = false;
    };
    (async () => {
      if (!window.RTCPeerConnection) { setErr("Appels non supportés par ce navigateur."); return; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === "video" ? { facingMode: "user" } : false }); }
      catch (e) { setErr("Micro ou caméra refusé ou indisponible (https requis)."); return; }
      if (!alive.current) { stream.getTracks().forEach((t) => t.stop()); return; }
      streamRef.current = stream;
      setLocalStream(stream);
      const beat = () => { safeSet("gcp:" + gid + ":" + me.id, JSON.stringify({ t: Date.now(), j: myJ.current }), true); safeSet("gcall:" + gid, JSON.stringify({ kind: kind, ts: Date.now(), by: me.id }), true); };
      beat();
      hb = setInterval(beat, 4000);
      poll = setInterval(tick, 1500);
      tick();
      // prévenir le groupe
      appendGroupMsg(gid, members, me.id, { id: Date.now() + "-" + Math.random(), from: me.id, type: "system", content: "📞 " + me.pseudo + " a lancé un appel " + (kind === "video" ? "vidéo " : "") + "de groupe", ts: Date.now() });
      pingPush(members.filter((x) => x !== me.id), me.pseudo + " · " + group.pseudo, "Appel " + (kind === "video" ? "vidéo " : "") + "de groupe en cours", "call");
    })();
    return () => {
      alive.current = false;
      clearInterval(hb);
      clearInterval(poll);
      Object.keys(peers.current).forEach((u) => { try { peers.current[u].pc.close(); } catch (e) { /* ignore */ } });
      peers.current = {};
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
      safeDelete("gcp:" + gid + ":" + me.id, true);
    };
  }, []);

  const toggleMute = () => { const n = !muted; setMuted(n); if (streamRef.current) streamRef.current.getAudioTracks().forEach((t) => { t.enabled = !n; }); };
  const toggleCam = () => { const n = !camOn; setCamOn(n); if (streamRef.current) streamRef.current.getVideoTracks().forEach((t) => { t.enabled = n; }); };
  const ids = Object.keys(tiles);
  return (
    <div className="fixed inset-0 z-[90] flex flex-col" style={{ background: "#0B0D10", color: "#fff" }}>
      <div className="px-4 pt-5 pb-2 text-center">
        <div className="font-semibold">{group.pseudo}</div>
        <div className="text-xs opacity-70">{err ? err : parts.length ? (parts.length + 1) + " participants" : "En attente des autres membres…"}</div>
      </div>
      <div className="flex-1 overflow-y-auto p-3 grid gap-3" style={{ gridTemplateColumns: ids.length >= 1 ? "1fr 1fr" : "1fr", alignContent: "start" }}>
        <Tile stream={localStream} name="Toi" mine pseudo={me.pseudo} id={me.id} />
        {parts.map((u) => <Tile key={u} stream={tiles[u]} name={names[u] || "…"} pseudo={names[u] || "?"} id={u} />)}
      </div>
      <div className="flex items-center justify-center gap-4 pb-8 pt-3">
        <button onClick={toggleMute} className="w-14 h-14 rounded-full text-xl" style={{ background: muted ? "#FF6B5D" : "rgba(255,255,255,0.14)" }}>{muted ? "🔇" : "🎤"}</button>
        {kind === "video" && <button onClick={toggleCam} className="w-14 h-14 rounded-full text-xl" style={{ background: camOn ? "rgba(255,255,255,0.14)" : "#FF6B5D" }}>{camOn ? "📹" : "🚫"}</button>}
        <button onClick={onClose} className="w-16 h-16 rounded-full text-2xl" style={{ background: "#FF3B30" }}>📞</button>
      </div>
    </div>
  );
}

// ---------- Administration : signalements ----------
function ReportsPanel({ flash, card, title, label, adminId }) {
  const [list, setList] = useState(null);
  const [open, setOpen] = useState(null);
  const load = async () => {
    const keys = await safeList("report:");
    const arr = await Promise.all(keys.map(async (k) => { const r = await safeGet(k, true); try { return r ? JSON.parse(r) : null; } catch (e) { return null; } }));
    setList(arr.filter(Boolean).sort((a, b) => b.ts - a.ts));
  };
  useEffect(() => { load(); }, []);
  const setStatus = async (r, status) => { await safeSet("report:" + r.id, JSON.stringify(Object.assign({}, r, { status: status })), true); await load(); };
  const logAct = async (t) => { const raw = await safeGet("adminlog", true); let l = []; try { l = raw ? JSON.parse(raw) : []; } catch (e) { l = []; } await safeSet("adminlog", JSON.stringify(l.concat([{ ts: Date.now(), t: t }]).slice(-60)), true); };
  const ban = async (r) => { await safeSet("banned:" + r.against, "1", true); await logAct("Suspension de " + r.againstName + " (signalement)"); await setStatus(r, "actioned"); flash(r.againstName + " suspendu ✓"); };
  const warn = async (r) => { await safeSet("warn:" + r.against, JSON.stringify({ text: "L'administrateur a reçu un signalement te concernant (" + r.reason + "). Merci de respecter les autres utilisateurs.", ts: Date.now() }), true); await logAct("Avertissement envoyé à " + r.againstName); await setStatus(r, "actioned"); flash("Avertissement envoyé ✓"); };
  const delMsg = async (r) => {
    const raw = await safeGet("conv:" + r.cid, true);
    if (raw) {
      const l = JSON.parse(raw).map((m) => (m.id === r.mid ? Object.assign({}, m, { deleted: true, content: "", reactions: {}, enc: undefined }) : m));
      await safeSet("conv:" + r.cid, JSON.stringify(l), true);
    }
    await logAct("Message supprimé (signalement de " + r.byName + ")");
    await setStatus(r, "actioned");
    flash("Message supprimé ✓");
  };
  const del = async (r) => { await safeDelete("report:" + r.id, true); await load(); };
  const openN = (list || []).filter((r) => r.status === "open").length;
  return (
    <div className="mb-5">
      <div className="mt-6">{label("🚩 Signalements" + (openN ? " (" + openN + " à traiter)" : ""))}</div>
      {list === null ? <div className="flex justify-center py-4"><Loader2 size={16} className="animate-spin" /></div> : list.length === 0 ? <div className="rounded-2xl p-4 text-sm" style={Object.assign({}, card, title)}>Aucun signalement.</div> : list.slice(0, 30).map((r) => (
        <div key={r.id} className="rounded-2xl p-3 mb-2" style={Object.assign({}, card, { borderColor: r.status === "open" ? "rgba(255,107,93,0.5)" : undefined })}>
          <div className="flex items-start justify-between gap-2">
            <div className="text-sm"><b>{r.byName}</b> signale <b>{r.againstName}</b></div>
            <span className="text-[10px] rounded-full px-2 py-0.5 shrink-0" style={{ background: r.status === "open" ? "rgba(255,107,93,0.18)" : "var(--card2)", color: r.status === "open" ? "#FF6B5D" : "var(--muted)" }}>{r.status === "open" ? "à traiter" : r.status === "actioned" ? "traité" : "ignoré"}</span>
          </div>
          <div className="text-xs mt-1" style={title}>{r.reason}{r.comment ? " · « " + r.comment + " »" : ""} · {new Date(r.ts).toLocaleString("fr-FR")}</div>
          {r.content && r.mtype === "text" && <div className="text-xs mt-2 rounded-lg px-2 py-1.5" style={{ background: "var(--card2)" }}>{r.content}</div>}
          {r.content && r.mtype === "image" && <img src={r.content} alt="signalé" className="mt-2 rounded-lg" style={{ maxHeight: 160 }} onClick={() => setOpen(r.content)} />}
          {!r.content && <div className="text-[11px] mt-1 italic" style={title}>Contenu non joint (message chiffré).</div>}
          <div className="flex gap-1.5 mt-2.5 flex-wrap">
            {r.status === "open" && <button onClick={() => setStatus(r, "dismissed")} className="rounded-lg px-2.5 py-1.5 text-[11px] font-semibold" style={{ background: "var(--card2)" }}>Ignorer</button>}
            <button onClick={() => warn(r)} className="rounded-lg px-2.5 py-1.5 text-[11px] font-semibold" style={{ background: "var(--card2)" }}>Avertir</button>
            <button onClick={() => delMsg(r)} className="rounded-lg px-2.5 py-1.5 text-[11px] font-semibold" style={{ background: "var(--card2)" }}>Supprimer le message</button>
            <button onClick={() => ban(r)} className="rounded-lg px-2.5 py-1.5 text-[11px] font-semibold" style={{ background: "rgba(255,107,93,0.15)", color: "#FF6B5D" }}>Suspendre</button>
            <button onClick={() => del(r)} className="rounded-lg px-2.5 py-1.5 text-[11px]" style={title}>Effacer</button>
          </div>
        </div>
      ))}
      {open && <div className="fixed inset-0 z-[80] flex items-center justify-center p-3" style={{ background: "rgba(0,0,0,0.92)" }} onClick={() => setOpen(null)}><img src={open} alt="" style={{ maxWidth: "100%", maxHeight: "100%" }} /></div>}
    </div>
  );
}
function AdminLog({ card, title, label }) {
  const [log, setLog] = useState([]);
  useEffect(() => { (async () => { const raw = await safeGet("adminlog", true); try { setLog(raw ? JSON.parse(raw).reverse() : []); } catch (e) { setLog([]); } })(); }, []);
  if (!log.length) return null;
  return (
    <div className="mb-5">
      {label("📜 Journal des actions")}
      <div className="rounded-2xl p-3" style={card}>
        {log.slice(0, 12).map((l, i) => <div key={i} className="text-xs py-1" style={Object.assign({}, title, i ? { borderTop: "1px solid var(--line)" } : {})}>{new Date(l.ts).toLocaleString("fr-FR")} · <span style={{ color: "var(--fg)" }}>{l.t}</span></div>)}
      </div>
    </div>
  );
}

// ---------- Avatars dessinés (style personnage, 100 % original) ----------
const AV_SKIN = ["#FFDFC4", "#F5C9A0", "#E3B084", "#C68642", "#8D5524", "#5C3A21"];
const AV_HAIR = ["#1B1210", "#4A2E1B", "#8B5A2B", "#C9A24B", "#EBD58A", "#B8372B", "#7B3FA0", "#2E86DE", "#EDEDED", "#FF77B5"];

// ---------- Admin : courbe des inscriptions ----------
function SignupChart({ rows, card, title, label }) {
  if (!rows) return null;
  const days = [];
  const start = new Date(); start.setHours(0, 0, 0, 0);
  for (let i = 13; i >= 0; i--) { const d = start.getTime() - i * 86400000; days.push({ d: d, n: rows.filter((r) => r.createdAt >= d && r.createdAt < d + 86400000).length }); }
  const max = Math.max(1, ...days.map((x) => x.n));
  const online = rows.filter((r) => Date.now() - r.seen < 45000);
  return (
    <div className="mb-4">
      {label("📈 Inscriptions · 14 derniers jours")}
      <div className="rounded-2xl p-4" style={card}>
        <div className="flex items-end gap-1.5" style={{ height: 90 }}>
          {days.map((x, i) => (
            <div key={i} className="flex-1 flex flex-col items-center justify-end" style={{ height: "100%" }}>
              <div className="text-[9px] mb-0.5" style={title}>{x.n || ""}</div>
              <div style={{ width: "100%", height: Math.max(3, (x.n / max) * 62), borderRadius: 6, background: "linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent))" }} />
            </div>
          ))}
        </div>
        <div className="flex justify-between text-[9px] mt-1" style={title}><span>{new Date(days[0].d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</span><span>aujourd'hui</span></div>
        {online.length > 0 && <div className="flex items-center gap-1.5 mt-3 flex-wrap"><span className="text-[11px]" style={title}>En ligne :</span>{online.slice(0, 8).map((o) => <span key={o.id} className="flex items-center gap-1 rounded-full pl-1 pr-2 py-0.5 text-[11px]" style={{ background: "var(--card2)" }}><Avatar code={o.id} pseudo={o.pseudo} size={16} />{o.pseudo}</span>)}</div>}
      </div>
    </div>
  );
}

    canvas.width = Math.max(1, width);
    canvas.height = Math.max(1, height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", q);
  };
  const viaElement = () => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new window.Image();
    const to = setTimeout(() => { URL.revokeObjectURL(url); reject(fail("Délai dépassé")); }, 15000);
    img.onerror = () => { clearTimeout(to); URL.revokeObjectURL(url); reject(fail("Format non lisible (les photos HEIC/HEIF ne marchent pas : choisis un JPEG ou un PNG, ou prends la photo avec l'appareil photo de l'appli)")); };
    img.onload = () => { clearTimeout(to); try { resolve(draw(img, img.naturalWidth || img.width, img.naturalHeight || img.height)); } catch (e) { reject(fail("Image trop grande pour ce téléphone")); } finally { URL.revokeObjectURL(url); } };
    img.src = url;
  });
  if (!file || (file.type && file.type.indexOf("image/") !== 0)) return Promise.reject(fail("Ce fichier n'est pas une image"));
  if (typeof createImageBitmap === "function") {
    return createImageBitmap(file, { imageOrientation: "from-image" })
      .then((bmp) => { const out = draw(bmp, bmp.width, bmp.height); if (bmp.close) bmp.close(); return out; })
      .catch(() => viaElement());
  }
  return viaElement();
}

// ---------- Texte enrichi : *gras* _italique_ ~barré~ `code` ----------
function fmtInline(s, keyBase) {
  const parts = s.split(/(\*[^*\n]+\*|_[^_\n]+_|~[^~\n]+~|`[^`\n]+`)/g);
  return parts.map((p, i) => {
    const k = keyBase + "-" + i;
    if (p.length > 2 && p[0] === "*" && p[p.length - 1] === "*") return <b key={k}>{p.slice(1, -1)}</b>;
    if (p.length > 2 && p[0] === "_" && p[p.length - 1] === "_") return <i key={k}>{p.slice(1, -1)}</i>;
    if (p.length > 2 && p[0] === "~" && p[p.length - 1] === "~") return <s key={k}>{p.slice(1, -1)}</s>;
    if (p.length > 2 && p[0] === "`" && p[p.length - 1] === "`") return <code key={k} style={{ background: "rgba(0,0,0,0.2)", borderRadius: 6, padding: "1px 5px", fontSize: "0.9em" }}>{p.slice(1, -1)}</code>;
    return p;
  });
}

// ---------- Ne pas déranger ----------
function dndNow(p) {
  const d = p && p.dnd;
  if (!d || !d.on) return false;
  const toMin = (t) => { const x = String(t || "00:00").split(":"); return (parseInt(x[0], 10) || 0) * 60 + (parseInt(x[1], 10) || 0); };
  const now = new Date();
  const m = now.getHours() * 60 + now.getMinutes();
  const a = toMin(d.from), b = toMin(d.to);
  return a <= b ? m >= a && m < b : m >= a || m < b;
}

// ---------- Admin : changer le code ami ----------
function CodeEditModal({ acc, onClose, onDone }) {
  const [v, setV] = useState(acc.code || "");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const save = async () => {
    const nc = v.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (nc.length < 3 || nc.length > 12) { setErr("3 à 12 lettres ou chiffres, sans espace ni accent."); return; }
    if (nc === acc.code) { onClose(); return; }
    setBusy(true);
    const taken = (await safeGet("account:" + nc, true)) || (await safeGet("codeIndex:" + nc, true));
    if (taken) { setErr("Ce code est déjà utilisé."); setBusy(false); return; }
    const rawAcc = await safeGet("account:" + acc.code, true);
    if (!rawAcc) { setErr("Compte introuvable."); setBusy(false); return; }
    await safeSet("account:" + nc, rawAcc, true);
    await safeSet("codeIndex:" + nc, acc.id, true);
    const rp = await safeGet("profile:" + acc.id, true);
    const p = rp ? JSON.parse(rp) : {};
    await safeSet("profile:" + acc.id, JSON.stringify(Object.assign({}, p, { code: nc })), true);
    await safeDelete("account:" + acc.code, true);
    await safeDelete("codeIndex:" + acc.code, true);
    const lr = await safeGet("adminlog", true);
    let l = [];
    try { l = lr ? JSON.parse(lr) : []; } catch (e) { l = []; }
    await safeSet("adminlog", JSON.stringify(l.concat([{ ts: Date.now(), t: "Code de " + acc.pseudo + " : " + acc.code + " → " + nc }]).slice(-60)), true);
    setBusy(false);
    onDone("Code de " + acc.pseudo + " changé en " + nc + " ✓");
  };
  return (
    <Sheet title={"✏️ Code ami de " + acc.pseudo} onClose={onClose}>
      <p className="text-xs mb-3" style={{ color: "var(--muted)" }}>Choisis un code facile à retenir (ex. : son prénom). Il sert à se connecter et à être ajouté par ses amis. Ses contacts n'ont rien à refaire.</p>
      <input value={v} maxLength={12} onChange={(e) => { setV(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "")); setErr(""); }} className="w-full rounded-xl px-4 py-3 text-center text-xl font-bold tracking-widest outline-none mb-2" style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }} />
      {err && <div className="text-xs mb-2" style={{ color: "#FF6B5D" }}>{err}</div>}
      <button onClick={save} disabled={busy} className="w-full rounded-xl py-3 text-sm font-semibold" style={pBtn}>{busy ? "Enregistrement…" : "Enregistrer le nouveau code"}</button>
    </Sheet>
  );
}

const AI_SYSTEM = "Tu es l'assistant intégré à la messagerie Sans-Trace. Réponds toujours en français, de façon claire, courte et bienveillante, sauf si on te demande une autre langue.";
async function aiAsk(messages, system) {
  if (!PUSH_URL) throw new Error("nosrv");
  const r = await fetch(PUSH_URL.replace(/\/+$/, "") + "/ai", { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ messages: messages.slice(-14), system: system || AI_SYSTEM }) });
  if (!r.ok) throw new Error("http " + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return String(d.reply || "").trim();

  const [msgs, setMsgs] = useState(load);
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(msgs.slice(-60))); } catch (e) { /* ignore */ } if (endRef.current) endRef.current.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy]);
  const send = async (t) => {
    const q = (t || text).trim();
    if (!q || busy) return;
    setText("");
    const next = msgs.concat([{ role: "user", content: q }]);
    setMsgs(next);
    setBusy(true);
    try { const a = await aiAsk(next); setMsgs(next.concat([{ role: "assistant", content: a || "…" }])); }
    catch (e) { setMsgs(next.concat([{ role: "assistant", content: aiErr(e), err: true }])); }
    setBusy(false);
  };
  const chips = ["✍️ Aide-moi à écrire un message sympa", "🌍 Traduis en anglais : ", "🔧 Corrige mon texte : ", "😄 Donne-moi une blague", "💡 Idée de réponse à un ami qui est triste"];
  return (
    <div className="h-full flex flex-col relative" style={{ background: "radial-gradient(90% 40% at 80% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent), var(--bg)", color: "var(--fg)" }}>
      <div className="px-3 py-3 flex items-center gap-2.5" style={{ borderBottom: "1px solid var(--line)", background: "color-mix(in srgb, var(--bg) 82%, transparent)", backdropFilter: "blur(12px)" }}>
        <button onClick={onBack} className="w-9 h-9 rounded-full flex items-center justify-center"><ArrowLeft size={20} /></button>
        <div className="w-10 h-10 rounded-full flex items-center justify-center text-xl" style={{ background: "linear-gradient(135deg, var(--accent), #8B5CF6)" }}>✨</div>
        <div className="flex-1 min-w-0"><div className="font-semibold leading-tight">Assistant IA</div><div className="text-[11px]" style={{ color: "var(--muted)" }}>Écrire, traduire, corriger, idées</div></div>
        <button onClick={() => { if (window.confirm("Effacer la conversation avec l'assistant ?")) setMsgs([]); }} className="text-xs underline" style={{ color: "var(--muted)" }}>Effacer</button>
      </div>
      <div className="flex-1 overflow-y-auto px-3 py-3">
        {msgs.length === 0 && (
          <div className="text-center mt-8 mb-4">
            <div className="text-4xl mb-2">✨</div>
            <div className="font-semibold mb-1">Salut {me.pseudo} !</div>
            <p className="text-sm mb-4" style={{ color: "var(--muted)" }}>Je peux t'aider à écrire, traduire, corriger ou trouver des idées. Tes échanges avec moi restent sur cet appareil.</p>
            <div className="flex flex-wrap gap-2 justify-center">{chips.map((c) => <button key={c} onClick={() => (c.slice(-2) === " " || c.slice(-2) === ": " ? setText(c.replace(/^\S+\s/, "")) : send(c.replace(/^\S+\s/, "")))} className="rounded-full px-3 py-2 text-xs" style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>{c}</button>)}</div>
          </div>
        )}
        {msgs.map((m, i) => (
          <div key={i} className={"flex mb-2 " + (m.role === "user" ? "justify-end" : "justify-start")}>
            <div className="stMsg px-3.5 py-2 text-[15px] whitespace-pre-wrap break-words" style={{ maxWidth: "84%", borderRadius: 20, background: m.role === "user" ? "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))" : "var(--card2)", color: m.role === "user" ? "var(--on-accent)" : m.err ? "#FF6B5D" : "var(--fg)", border: m.role === "user" ? "none" : "1px solid var(--line)" }}>
              {m.content}
              {m.role === "assistant" && !m.err && <button onClick={() => { try { navigator.clipboard.writeText(m.content); } catch (e) { /* ignore */ } }} className="block text-[10px] underline mt-1 opacity-70">Copier</button>}
            </div>
          </div>
        ))}
        {busy && <div className="flex mb-2"><div className="px-4 py-2 text-sm rounded-2xl" style={{ background: "var(--card2)" }}>✨ réfléchit…</div></div>}
        <div ref={endRef} />
      </div>
      <div className="px-3 py-2.5 flex gap-2 items-center" style={{ borderTop: "1px solid var(--line)" }}>
        <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Pose ta question…" className="bare flex-1 rounded-full px-4 py-3 text-[15px] outline-none" style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }} />
        <button onClick={() => send()} disabled={busy || !text.trim()} className="w-11 h-11 rounded-full flex items-center justify-center disabled:opacity-40" style={{ background: "var(--accent)", color: "var(--on-accent)" }}><Send size={18} /></button>
      </div>
    </div>
  );
}

// Outils IA dans une discussion : résumer, suggérer une réponse, traduire un message
function AiSheet({ kind, messages, me, other, target, onUse, onClose }) {
  const [out, setOut] = useState("");
  const [busy, setBusy] = useState(true);
  const [err, setErr] = useState("");
  const [lang, setLang] = useState("anglais");
  const transcript = () => messages.filter((m) => m.type === "text" && !m.deleted && m.content).slice(-30).map((m) => (m.from === me.id ? "Moi" : other.isGroup ? "Un membre" : other.pseudo) + " : " + m.content).join("\n");
  const run = async (l) => {
    setBusy(true); setErr(""); setOut("");
    try {
      let a;
      if (kind === "summary") a = await aiAsk([{ role: "user", content: "Voici une discussion de messagerie. Résume-la en 3 à 4 phrases courtes en français.\n\n" + transcript() }]);
      else if (kind === "reply") a = await aiAsk([{ role: "user", content: "Voici une discussion. Propose 3 réponses courtes, naturelles et différentes que je pourrais envoyer ensuite. Écris une réponse par ligne, sans numéro ni guillemets.\n\n" + transcript() }]);
      else a = await aiAsk([{ role: "user", content: "Traduis ce message en " + (l || lang) + ". Réponds uniquement avec la traduction.\n\n" + target.content }]);
      setOut(a);
    } catch (e) { setErr(aiErr(e)); }
    setBusy(false);
  };
  useEffect(() => { run(); }, []);
  const lines = kind === "reply" ? out.split("\n").map((x) => x.replace(/^[-*\d.)\s]+/, "").trim()).filter(Boolean).slice(0, 4) : [];
  return (
    <Sheet title={kind === "summary" ? "✨ Résumé de la discussion" : kind === "reply" ? "✨ Idées de réponse" : "🌍 Traduction"} onClose={onClose}>
      {kind === "translate" && (
        <div className="flex gap-1.5 flex-wrap mb-3">{["anglais", "français", "espagnol", "arabe", "allemand", "italien"].map((l) => <button key={l} onClick={() => { setLang(l); run(l); }} className="rounded-full px-3 py-1.5 text-xs font-semibold" style={lang === l ? pBtn : cBtn}>{l}</button>)}</div>
      )}
      {busy && <div className="flex items-center gap-2 py-4 text-sm"><Loader2 size={16} className="animate-spin" /> L'IA réfléchit…</div>}
      {err && <div className="text-sm rounded-xl px-3 py-2" style={{ background: "rgba(255,107,93,0.14)", color: "#FF6B5D" }}>{err}</div>}
      {!busy && !err && kind !== "reply" && <div className="rounded-2xl px-4 py-3 text-[15px] whitespace-pre-wrap" style={{ background: "var(--card)", border: "1px solid var(--line)" }}>{out}</div>}
      {!busy && !err && kind === "reply" && lines.map((l, i) => <button key={i} onClick={() => { onUse(l); onClose(); }} className="w-full text-left rounded-2xl px-4 py-3 mb-2 text-[15px]" style={{ background: "var(--card)", border: "1px solid var(--line)" }}>{l}</button>)}
      <p className="text-[11px] mt-3" style={{ color: "var(--muted)" }}>Pour cette demande, le texte concerné est envoyé au service d'IA (hors chiffrement de bout en bout). Rien n'est envoyé sans ton action.</p>
    </Sheet>
  );
}

function colorFor(seed) {
  let h = 0;
  const s = seed || "?";
  for (let i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}

function generateId() {
  if (window.crypto && window.crypto.getRandomValues) {
    const arr = new Uint8Array(10);
    window.crypto.getRandomValues(arr);
    return Array.from(arr, (b) => b.toString(16).padStart(2, "0")).join("");
  }
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function generateCodeCandidate(len) {
  const n = len || 6;
  let out = "";
  for (let i = 0; i < n; i++) out += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return out;
}

function extractCode(raw) {
  const parts = (raw || "").trim().split(".");
  const code = parts.length > 1 ? parts[parts.length - 1] : parts[0];
  return code.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s+/g, "");
}

function randomSalt(len) {
  const n = len || 16;
  if (window.crypto && window.crypto.getRandomValues) {
    const arr = new Uint8Array(n);
    window.crypto.getRandomValues(arr);
    return Array.from(arr, (b) => b.toString(16).padStart(2, "0")).join("");
  }
  let out = "";
  for (let i = 0; i < n; i++) out += Math.floor(Math.random() * 16).toString(16);
  return out;
}

function sha256Js(str) {
  const bytes = Array.from(new TextEncoder().encode(str));
  const K = [];
  const H = [];
  let n = 2;
  while (K.length < 64) {
    let p = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; }
    if (p) {
      if (H.length < 8) H.push(((Math.sqrt(n) % 1) * 4294967296) >>> 0);
      K.push(((Math.cbrt(n) % 1) * 4294967296) >>> 0);
    }
    n++;
  }
  const l = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  [Math.floor(l / 4294967296), l >>> 0].forEach((v) => { bytes.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255); });
  const rotr = (x, k) => (x >>> k) | (x << (32 - k));
  for (let i = 0; i < bytes.length; i += 64) {
    const w = new Array(64);
    for (let t = 0; t < 16; t++) w[t] = (bytes[i + 4 * t] << 24) | (bytes[i + 4 * t + 1] << 16) | (bytes[i + 4 * t + 2] << 8) | bytes[i + 4 * t + 3];
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) | 0;
    }
    let a = H[0] | 0, b = H[1] | 0, cc = H[2] | 0, d = H[3] | 0, e = H[4] | 0, f = H[5] | 0, g = H[6] | 0, h = H[7] | 0;
    for (let t = 0; t < 64; t++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[t] + w[t]) | 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & cc) ^ (b & cc);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + cc) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

async function sha256Hex(text) {
  try {
    const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    return sha256Js(text);
  }
}

async function hashPassword(password, salt) {
  return sha256Hex(salt + ":" + password);
}

const ADMIN_ID = "admin";
const ADMIN_CODE = "GAETAN";
const ADMIN_SEED = { salt: "gaetan-admin-seed-01", hash: "1887775f0acf9753dfce8ffd455cb46eed835589e6adb48935ff954ebad8d20d" };

function isReservedPseudo(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, "") === "gaetan";
}

async function safeList(prefix) {
  try {
    const r = await window.storage.list(prefix, true);
    return (r && r.keys) || [];
  } catch (e) {
    return [];
  }
}

async function probe(key) {
  try {
    const r = await window.storage.get(key, true);
    return r ? "yes" : "no";
  } catch (e) {
    return /not found/i.test(String((e && e.message) || e)) ? "no" : "err";
  }
}

async function ensureAdmin() {
  const exists = await safeGet("account:" + ADMIN_CODE, true);
  if (exists) return;
  const createdAt = Date.now();
  await safeSet("account:" + ADMIN_CODE, JSON.stringify({ id: ADMIN_ID, pseudo: "Gaëtan", salt: ADMIN_SEED.salt, hash: ADMIN_SEED.hash, createdAt: createdAt, admin: true }), true);
  await safeSet("profile:" + ADMIN_ID, JSON.stringify({ pseudo: "Gaëtan", code: ADMIN_CODE, createdAt: createdAt }), true);
  await safeSet("codeIndex:" + ADMIN_CODE, ADMIN_ID, true);
}

async function deleteAccountData(id, code) {
  const keys = await safeList("");
  const mine = ["account:" + code, "codeIndex:" + code, "profile:" + id, "seen:" + id, "inbox:" + id, "banned:" + id, "groups:" + id, "pub:" + id, "keybak:" + id, "push:" + id, "notif:" + id, "warn:" + id, "kick:" + id];
  const rel = keys.filter((k) => /^(conv|last|read|unread|typing):/.test(k) && k.indexOf(id) !== -1);
  await Promise.all(mine.concat(rel).map((k) => safeDelete(k, true)));
  const inboxes = keys.filter((k) => k.indexOf("inbox:") === 0 && k !== "inbox:" + id);
  for (let i = 0; i < inboxes.length; i++) {
    const raw = await safeGet(inboxes[i], true);
    if (!raw) continue;
    const arr = JSON.parse(raw);
    if (arr.indexOf(id) !== -1) await safeSet(inboxes[i], JSON.stringify(arr.filter((x) => x !== id)), true);
  }
  const gkeys = keys.filter((k) => k.indexOf("group:") === 0);
  for (let i = 0; i < gkeys.length; i++) {
    const graw = await safeGet(gkeys[i], true);
    if (!graw) continue;
    const g = JSON.parse(graw);
    if (g.members.indexOf(id) === -1) continue;
    g.members = g.members.filter((x) => x !== id);
    if (!g.members.length) await deleteGroupData(gkeys[i].slice(6));
    else {
      if (g.admin === id) g.admin = g.members[0];
      await safeSet(gkeys[i], JSON.stringify(g), true);
    }
  }
}



async function safeGet(key, shared) {
  try {
    const r = await window.storage.get(key, shared);
    return r ? r.value : null;
  } catch (e) {
    return null;
  }
}
async function safeSet(key, value, shared) {
  try {
    await window.storage.set(key, value, shared);
    return true;
  } catch (e) {
    return false;
  }
}
async function safeDelete(key, shared) {
  try {
    await window.storage.delete(key, shared);
    return true;
  } catch (e) {
    return false;
  }
}

async function generateUniqueCode() {
  for (let i = 0; i < 6; i++) {
    const candidate = generateCodeCandidate(6);
    const taken = await safeGet("codeIndex:" + candidate, true);
    if (!taken) return candidate;
  }
  return generateCodeCandidate(8);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

function SignUp({ onBack, onDone }) {
  const [step, setStep] = useState("form"); // form | reveal
  const [pseudo, setPseudo] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [session, setSession] = useState(null);
  const [copied, setCopied] = useState(false);

  const submit = async () => {
    const cleanPseudo = pseudo.trim();
    if (cleanPseudo.length < 2) {
      setErr("Choisis un pseudo d'au moins 2 caractères.");
      return;
    }
    if (isReservedPseudo(cleanPseudo)) {
      setErr("Ce pseudo est réservé.");
      return;
    }
    if (password.length < 4) {
      setErr("Le mot de passe doit faire au moins 4 caractères.");
      return;
    }
    if (password !== confirm) {
      setErr("Les deux mots de passe ne correspondent pas.");
      return;
    }
    setBusy(true);
    setErr("");
    const id = generateId();
    const code = await generateUniqueCode();
    const salt = randomSalt();
    const hash = await hashPassword(password, salt);
    const createdAt = Date.now();
    const account = { id: id, pseudo: cleanPseudo, salt: salt, hash: hash, createdAt: createdAt };
    const profilePublic = { pseudo: cleanPseudo, code: code, createdAt: createdAt };
    const newSession = { id: id, pseudo: cleanPseudo, code: code, createdAt: createdAt };
    const ok1 = await safeSet("account:" + code, JSON.stringify(account), true);
    const ok2 = await safeSet("profile:" + id, JSON.stringify(profilePublic), true);
    const ok3 = await safeSet("codeIndex:" + code, id, true);
    const ok4 = await safeSet("profile", JSON.stringify(newSession), false);
    setBusy(false);
    if (!ok1 || !ok2 || !ok3 || !ok4) {
      setErr("Connexion au stockage impossible. Réessaie.");
      return;
    }
    setSession(newSession);
    setStep("reveal");
  };

  const copyCode = async () => {
    const ok = await copyToClipboard(session.code);
    setCopied(ok);
    setTimeout(() => setCopied(false), 1500);
  };

  if (step === "reveal" && session) {
    return (
      <div className="h-full flex flex-col justify-center px-7" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>

          Compte créé, bienvenue {session.pseudo}
        </p>
        <div
          className="rounded-2xl p-5 mb-5"
          style={{ background: "linear-gradient(135deg, var(--card2), var(--card))", border: "1px dashed color-mix(in srgb, var(--accent) 40%, transparent)" }}
        >
          <div className="flex items-center gap-3 mb-5">
            <Avatar code={session.id} pseudo={session.pseudo} size={44} />
            <div>
              <div className="text-[10px] uppercase tracking-widest" style={{ color: "var(--muted)" }}>
                Carte membre
              </div>
              <div className="font-semibold">{session.pseudo}</div>
            </div>
          </div>
          <div className="text-[10px] uppercase tracking-widest mb-1" style={{ color: "var(--muted)" }}>
            Ton code ami
          </div>
          <div className="text-3xl font-mono font-bold" style={{ color: "var(--accent-text)", letterSpacing: "0.2em" }}>
            {session.code}
          </div>
          <button
            onClick={copyCode}
            className="mt-4 text-xs flex items-center gap-1.5 px-3 py-1.5 rounded-full"
            style={{ background: "var(--bg)", border: "1px solid var(--line)", color: "var(--fg)" }}
          >
            {copied ? <Check size={13} /> : <Copy size={13} />}
            {copied ? "Copié" : "Copier le code"}
          </button>
        </div>

        <div className="mb-6">
          <Callout icon={Key} title="Retiens bien ces deux infos">
            Code ami + mot de passe → pour te reconnecter plus tard.<br />
            Code ami seul → pour te faire ajouter par d'autres.
          </Callout>
        </div>

        <button
          onClick={async () => { try { await e2eSetup(session.id, password); } catch (e) { /* ignore */ } safeSet("loginAt", String(Date.now()), false); onDone(session); }}
          className="w-full rounded-2xl py-4 text-base font-semibold"
          style={{ background: "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))", color: "var(--on-accent)", boxShadow: "0 8px 22px -8px color-mix(in srgb, var(--accent) 65%, transparent)" }}
        >
          Continuer
        </button>
      </div>
    );
  }

  return (
    <div className="h-full flex flex-col justify-center px-7" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>

function SignIn({ onBack, onDone }) {

      setErr("Entre ton code ami.");
      return;
    }
    if (!password) {
      setErr("Entre ton mot de passe.");
      return;
    }
    setBusy(true);
    setErr("");
    const code = extractCode(raw);
    if (code === ADMIN_CODE) await ensureAdmin();
    const rawAcc = await safeGet("account:" + code, true);
    if (!rawAcc) {
      setBusy(false);
      setErr("Aucun compte avec ce code.");
      return;
    }
    const acc = JSON.parse(rawAcc);
    const computed = await hashPassword(password, acc.salt);
    if (computed !== acc.hash) {
      setBusy(false);
      setErr("Mot de passe incorrect.");
      return;
    }
    if ((await probe("banned:" + acc.id)) === "yes") {
      setBusy(false);
      setErr("Ce compte est suspendu par l'administrateur.");
      return;
    }
    const newSession = { id: acc.id, pseudo: acc.pseudo, code: code, createdAt: acc.createdAt, admin: !!acc.admin };
    const ok = await safeSet("profile", JSON.stringify(newSession), false);
    setBusy(false);
    if (!ok) {
      setErr("Connexion au stockage impossible. Réessaie.");
      return;
    }
    setSession(newSession);
    setStep("welcome");
  };

  const copyCode = async () => {
    const ok = await copyToClipboard(session.code);

    setTimeout(() => setCopied(false), 1500);
  };

        >

  return (

        <ArrowLeft size={20} />
      </button>
      <h1 className="text-2xl font-semibold tracking-tight mb-1">Se connecter</h1>
      <p className="text-sm mb-6" style={{ color: "var(--muted)" }}>Entre ton code ami et ton mot de passe.</p>

      <label className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>
        Code ami
      </label>
      <input
        value={codeInput}
        onChange={(e) => setCodeInput(e.target.value)}
        placeholder="ex. K7XQ2P"
        className="w-full rounded-xl px-4 py-3 outline-none mb-4 font-mono"
        style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)", letterSpacing: "0.1em" }}
      />

      <label className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>
        Mot de passe
      </label>
      <PasswordField
        value={password}
        onChange={(e) => setPassword(e.target.value)}
        onKeyDown={(e) => e.key === "Enter" && submit()}
        placeholder="ton mot de passe"
        autoComplete="current-password"
      />

      {err && <p className="text-sm mb-3" style={{ color: "#FF6B5D" }}>{err}</p>}

      <button
        onClick={submit}
        disabled={busy}
        className="w-full rounded-2xl py-4 text-base font-semibold flex items-center justify-center gap-2 disabled:opacity-60 mt-1"
        style={{ background: "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))", color: "var(--on-accent)", boxShadow: "0 8px 22px -8px color-mix(in srgb, var(--accent) 65%, transparent)" }}
      >
        {busy ? <Loader2 size={18} className="animate-spin" /> : "Se connecter"}
      </button>
      <SupportButton />
    </div>
  );
}

// ---------- Home ----------

function Home({ me, onOpenChat, onLogout, onProfileUpdate, onSettings, prefs, onPrefs }) {
  const [contacts, setContacts] = useState([]);
  const [adding, setAdding] = useState(false);
  const [q, setQ] = useState("");
  const [codeInput, setCodeInput] = useState("");
  const [addBusy, setAddBusy] = useState(false);
  const [addErr, setAddErr] = useState("");
  const [loading, setLoading] = useState(true);
  const [copied, setCopied] = useState(false);
  const [confirmRegen, setConfirmRegen] = useState(false);
  const [regenBusy, setRegenBusy] = useState(false);
  const inst = useInstall();
  const [instHide, setInstHide] = useState(false);
  const [grpOpen, setGrpOpen] = useState(false);
  const [grpName, setGrpName] = useState("");
  const [grpSel, setGrpSel] = useState({});
  const [grpEmoji, setGrpEmoji] = useState("👥");
  const [grpBusy, setGrpBusy] = useState(false);

  const sigRef = useRef("");
  const refresh = useCallback(async () => {
    if (!navigator.onLine) return;
    const rawContacts = await safeGet("contacts:" + me.id, false);
    const myIds = rawContacts ? JSON.parse(rawContacts) : [];
    const rawInbox = await safeGet("inbox:" + me.id, true);
    const inboxIds = rawInbox ? JSON.parse(rawInbox) : [];
    const merged = Array.from(new Set(myIds.concat(inboxIds))).filter((id) => id !== me.id);
    const hydratedAll = await Promise.all(
      merged.map(async (id) => {
        const cid = convId(me.id, id);
        const r = await Promise.all([
          safeGet("profile:" + id, true),
          safeGet("last:" + cid, true),
          safeGet("unread:" + cid + ":" + me.id, true),
        ]);
        const pr = r[0] ? JSON.parse(r[0]) : null;
        if (!pr) return null;
        if (pr.avatar) AVATARS[id] = pr.avatar; else delete AVATARS[id];
        return { id: id, pseudo: pr.pseudo, avatar: pr.avatar || null, last: r[1] ? JSON.parse(await decLastRaw(r[1], me.id, id)) : null, unread: parseInt(r[2], 10) || 0 };
      })
    );
    const gRaw = await safeGet("groups:" + me.id, true);
    const gids = gRaw ? JSON.parse(gRaw) : [];
    const gh = await Promise.all(gids.map(async (gid) => {
      const r = await Promise.all([safeGet("group:" + gid, true), safeGet("last:" + gid, true), safeGet("unread:" + gid + ":" + me.id, true)]);
      const g = r[0] ? JSON.parse(r[0]) : null;
      if (!g || g.members.indexOf(me.id) === -1) return null;
      if (g.avatar) AVATARS[gid] = g.avatar;
      return { id: gid, pseudo: g.name, isGroup: true, members: g.members, admin: g.admin, avatar: g.avatar || null, last: r[1] ? JSON.parse(r[1]) : null, unread: parseInt(r[2], 10) || 0 };
    }));
    const hydrated = hydratedAll.filter(Boolean).concat(gh.filter(Boolean));
    hydrated.sort((a, b) => (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0));
    const sig = JSON.stringify(hydrated);
    if (sig !== sigRef.current) {
      sigRef.current = sig;
      setContacts(hydrated);
    }
    setLoading(false);
  }, [me.id]);

  useEffect(() => {
    refresh();
    const t = setInterval(() => { if (!document.hidden) refresh(); }, 6000);
    return () => clearInterval(t);
  }, [refresh]);

  const addContact = async () => {
    const raw = codeInput.trim();
    if (!raw) return;
    setAddErr("");
    setAddBusy(true);
    const code = extractCode(raw);
    const theirId = await safeGet("codeIndex:" + code, true);
    if (!theirId) {
      setAddBusy(false);
      setAddErr("Aucun compte avec ce code.");
      return;
    }
    if (theirId === me.id) {
      setAddBusy(false);
      setAddErr("C'est ton propre code !");
      return;
    }
    const rawProfile = await safeGet("profile:" + theirId, true);
    const theirProfile = rawProfile ? JSON.parse(rawProfile) : { pseudo: "Inconnu" };
    const rawContacts = await safeGet("contacts:" + me.id, false);
    const list = rawContacts ? JSON.parse(rawContacts) : [];
    if (list.indexOf(theirId) === -1) {
      await safeSet("contacts:" + me.id, JSON.stringify(list.concat([theirId])), false);
    }
    setAddBusy(false);
    setCodeInput("");
    setAdding(false);
    refresh();
    onOpenChat({ id: theirId, pseudo: theirProfile.pseudo });
  };

  const copyMyCode = async () => {
    const ok = await copyToClipboard(me.code);
    setCopied(ok);
    setTimeout(() => setCopied(false), 1500);
  };

  const pinnedIds = prefs.pinned || [];
  const mutedIds = prefs.muted || [];
  const blockedIds = prefs.blocked || [];

  const blockedList = contacts.filter((c) => blockedIds.indexOf(c.id) !== -1);

  const createGroup = async () => {
    const name = grpName.trim();
    const sel = Object.keys(grpSel);
    if (name.length < 2 || sel.length < 1) { setAddErr("Donne un nom (2 caractères min) et choisis au moins 1 membre."); return; }

    const gid = "g" + generateId();
    const members = [me.id].concat(sel);

    await safeSet("group:" + gid, JSON.stringify({ name: name, members: members, admin: me.id, createdAt: Date.now(), avatar: avatar }), true);
    for (let i = 0; i < members.length; i++) await addToIndex(members[i], gid);
    await appendGroupMsg(gid, members, me.id, { id: Date.now() + "-" + Math.random(), from: me.id, type: "system", content: me.pseudo + " a créé le groupe « " + name + " »", ts: Date.now() });
    AVATARS[gid] = avatar;
    setGrpBusy(false);
    setGrpOpen(false);
    setGrpName("");
    setGrpSel({});
    setAdding(false);
    onOpenChat({ id: gid, pseudo: name, isGroup: true, members: members, admin: me.id, avatar: avatar });
  };

  const doRegenerate = async () => {
    setRegenBusy(true);
    const newCode = await generateUniqueCode();
    const rawAcc = await safeGet("account:" + me.code, true);
    const acc = rawAcc ? JSON.parse(rawAcc) : { id: me.id, pseudo: me.pseudo, salt: "", hash: "", createdAt: me.createdAt };
    await safeSet("account:" + newCode, JSON.stringify(acc), true);
    await safeDelete("account:" + me.code, true);
    await safeSet("codeIndex:" + newCode, me.id, true);
    await safeDelete("codeIndex:" + me.code, true);
    const rawProfile = await safeGet("profile:" + me.id, true);
    const p = rawProfile ? JSON.parse(rawProfile) : { pseudo: me.pseudo, createdAt: me.createdAt };
    const updatedProfilePublic = Object.assign({}, p, { code: newCode });
    await safeSet("profile:" + me.id, JSON.stringify(updatedProfilePublic), true);
    const updatedSession = Object.assign({}, me, { code: newCode });
    await safeSet("profile", JSON.stringify(updatedSession), false);
    setRegenBusy(false);
    setConfirmRegen(false);
    onProfileUpdate(updatedSession);
  };

  return (
    <div className="h-full flex flex-col" style={{ background: "radial-gradient(120% 70% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>
      <div className="px-5 pt-6 pb-4" style={{ borderBottom: "1px solid var(--line)" }}>
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-3">
            <button onClick={onSettings} title="Réglages"><Avatar code={me.id} pseudo={me.pseudo} size={44} /></button>
            <div>
              <div className="text-2xl font-bold tracking-tight leading-none" style={{ backgroundImage: "linear-gradient(90deg, var(--fg), var(--accent-text))", WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" }}>Messages</div>
              <div className="text-xs mt-1" style={{ color: "var(--muted)" }}>{me.pseudo}</div>
            </div>
          </div>
          <button
            onClick={() => setAdding((a) => !a)}
            className="w-11 h-11 rounded-full flex items-center justify-center"
            style={{ background: "linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 78%, #3B82F6))", color: "var(--on-accent)" }}
          >
            {adding ? <X size={20} /> : <Plus size={20} />}
          </button>
        </div>

        <div className="flex items-center gap-1.5 flex-wrap">
          <div
            className="flex items-center gap-1.5 rounded-full pl-3 pr-1.5 py-1 text-xs"
            style={{ background: "var(--card)", border: "1px solid var(--line)" }}
          >
            <Key size={13} style={{ color: "var(--muted)" }} />
            <span className="font-mono font-semibold" style={{ letterSpacing: "0.1em", color: "var(--accent-text)" }}>
              {me.code}

            <button onClick={copyMyCode} className="w-6 h-6 rounded-full flex items-center justify-center">
              {copied ? <Check size={12} /> : <Copy size={12} />}

          </div>
          <button
            onClick={() => setConfirmRegen((c) => !c)}
            className="w-7 h-7 rounded-full flex items-center justify-center"
            style={{ background: "var(--card)", border: "1px solid var(--line)", color: "var(--muted)" }}
            title="Régénérer mon code"

            <RefreshCw size={12} />
          </button>
        </div>

        {confirmRegen && (

            <p className="mb-2" style={{ color: "var(--muted)" }}>
              Un nouveau code sera créé. Il te faudra ce nouveau code (avec ton mot de passe habituel) pour te
              reconnecter, et les personnes qui n'ont que l'ancien ne pourront plus t'ajouter. Tes conversations
              actuelles restent intactes.
            </p>
            <div className="flex gap-2">
              <button
                onClick={() => setConfirmRegen(false)}
                className="px-3 py-1 rounded-full"
                style={{ background: "var(--bg)", border: "1px solid var(--line)" }}

                Annuler

              <button
                onClick={doRegenerate}
                disabled={regenBusy}
                className="px-3 py-1 rounded-full flex items-center gap-1"

              >
                {regenBusy ? <Loader2 size={12} className="animate-spin" /> : "Régénérer"}
              </button>
            </div>
          </div>
        )}

        {adding && (
          <div className="mt-3">
            <div className="flex gap-2">
              <input
                autoFocus
                value={codeInput}
                onChange={(e) => setCodeInput(e.target.value)}

                style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }}
              />

      {inst.prompt && !inst.standalone && !instHide && (

        {loading ? (
          <div className="flex justify-center pt-10" style={{ color: "var(--muted)" }}>
            <Loader2 size={20} className="animate-spin" />

        ) : visible.length === 0 ? (
          <div className="px-6 pt-14 text-center" style={{ color: "var(--muted)" }}>

        ) : (

            <button
              key={c.id}

              className="stRow flex items-center gap-3.5 px-4 py-3 text-left"
              style={{ width: "calc(100% - 20px)", margin: "0 10px 6px", borderRadius: 20, background: c.unread > 0 ? "color-mix(in srgb, var(--accent) 10%, var(--card))" : "var(--card)", border: "1px solid var(--line)" }}
            >
              <Avatar code={c.id} pseudo={c.pseudo} size={50} />
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between gap-2">
                  <span className={"truncate " + (c.unread > 0 ? "font-bold" : "font-medium")}>{pinnedIds.indexOf(c.id) !== -1 ? "📌 " : ""}{c.pseudo}{mutedIds.indexOf(c.id) !== -1 ? " 🔇" : ""}</span>
                  <span className="text-[11px] shrink-0" style={{ color: "var(--muted)" }}>{c.last ? fmtTime(c.last.ts) : ""}</span>
                </div>
                <div className="flex items-center justify-between gap-2">
                  <span className="text-sm truncate" style={{ color: "var(--muted)" }}>
                    {c.last ? (c.last.from === me.id ? "Toi : " : "") + c.last.preview : "Nouvelle conversation"}
                  </span>
                  {c.unread > 0 && (
                    <span className="text-[11px] font-semibold rounded-full px-1.5 min-w-[20px] text-center shrink-0" style={{ background: mutedIds.indexOf(c.id) !== -1 ? "var(--muted)" : "var(--accent)", color: "var(--on-accent)" }}>
                      {c.unread}
                    </span>
                  )}
                </div>
              </div>
            </button>
          ))
        )}
        {blockedList.length > 0 && (
          <div className="px-5 py-4">
            <div className="text-xs uppercase tracking-widest mb-2" style={{ color: "var(--muted)" }}>Bloqués</div>
            {blockedList.map((c) => (
              <div key={c.id} className="flex items-center justify-between py-1.5 text-sm">
                <span>{c.pseudo}</span>
                <button
                  onClick={() => onPrefs(Object.assign({}, prefs, { blocked: blockedIds.filter((x) => x !== c.id) }))}
                  className="text-xs underline"
                >
                  Débloquer
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function dayLabel(ts) {
  const d = new Date(ts);
  const t = new Date();
  const y = new Date();
  y.setDate(t.getDate() - 1);
  const k = (x) => x.getFullYear() + "-" + x.getMonth() + "-" + x.getDate();
  if (k(d) === k(t)) return "Aujourd'hui";
  if (k(d) === k(y)) return "Hier";
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}

function linkify(text) {
  return text.split(/(https?:\/\/[^\s]+)/g).map((s, i) =>
    /^https?:\/\//.test(s) ? (
      <a key={i} href={s} target="_blank" rel="noopener noreferrer" className="underline break-all" onClick={(e) => e.stopPropagation()}>{s}</a>
    ) : (
      fmtInline(s, "f" + i)
    )
  );
}

const FILE_MAX = 700000;

function fmtDur(s) {
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function fmtSize(n) {
  if (n < 1024) return n + " o";
  if (n < 1048576) return Math.round(n / 1024) + " Ko";
  return (n / 1048576).toFixed(1) + " Mo";
}

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("lecture"));
    r.readAsDataURL(file);
  });
}

function previewOf(m) {
  if (m.type === "text") return m.content.slice(0, 60);
  if (m.type === "image") return m.cap ? "📷 " + String(m.cap).slice(0, 40) : "📷 Photo";
  if (m.type === "file") return "📎 " + m.name;
  if (m.type === "audio") return "🎤 Message vocal";
  if (m.type === "location") return "📍 Position";
  if (m.type === "poll") return "📊 Sondage";
  if (m.type === "system") return m.content;
  if (m.type === "calllog") return (m.kind === "video" ? "📹 " : "📞 ") + (m.result === "missed" ? "Appel manqué" : m.result === "declined" ? "Appel refusé" : "Appel · " + fmtDur(m.dur || 0));
  return m.type === "sticker" ? "Sticker" : "📞 Appel";
}
