<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sans-Trace">
<title>Sans-Trace</title>
<style>
  html, body, #root { height: 100%; margin: 0; background: #0F1115; }
  body { -webkit-font-smoothing: antialiased; }
  #mode { position: fixed; top: 0; left: 0; right: 0; z-index: 99; font: 11px system-ui; text-align: center; padding: 3px; background: #E8A33D; color: #0F1115; display: none; pointer-events: none; }
  #err { position: fixed; inset: auto 0 0 0; z-index: 100; font: 12px monospace; background: #b91c1c; color: #fff; padding: 8px; display: none; white-space: pre-wrap; }
</style>
<script>
  // === CONFIG ===
  // firebaseUrl vide = mode local (messages sur cet appareil seulement).
  // Pour discuter entre appareils, colle l'URL de ta Realtime Database Firebase, par exemple :
  // "https://mon-projet-default-rtdb.europe-west1.firebasedatabase.app"
  window.SANSTRACE_CONFIG = { firebaseUrl: "https://messagame-e5a03-default-rtdb.europe-west1.firebasedatabase.app" };
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body>
<div id="mode">Mode local : les messages restent sur cet appareil (voir CONFIG dans index.html)</div>
<div id="err"></div>
<div id="root"></div>
<script>
  window.addEventListener("error", function (e) {
    var b = document.getElementById("err");
    b.style.display = "block";
    b.textContent = "Erreur : " + (e.message || e.error);
  });
  // Remplace window.storage (API des artefacts Claude) par localStorage / Firebase REST.
  (function () {
    var CFG = window.SANSTRACE_CONFIG || {};
    var remote = !!CFG.firebaseUrl;
    if (!remote) { var mb = document.getElementById("mode"); mb.style.display = "block"; setTimeout(function () { mb.style.display = "none"; }, 6000); }
    var base = remote ? CFG.firebaseUrl.replace(/\/$/, "") + "/s/" : "";
    function url(key) { return base + encodeURIComponent(key) + ".json"; }
    function showErr(msg) {
      var b = document.getElementById("err");
      b.style.display = "block";
      b.textContent = msg;
      clearTimeout(showErr.t);
      showErr.t = setTimeout(function () { b.style.display = "none"; }, 9000);
    }
    async function fb(key, opts) {
      var r;
      try { r = await fetch(url(key), opts); }
      catch (e) { showErr("Impossible de joindre Firebase. Vérifie ta connexion et l'URL dans index.html."); throw e; }
      if (!r.ok) {
        if (r.status === 401 || r.status === 403) showErr("Firebase refuse l'accès. Dans Firebase > Realtime Database > Règles, mets \".read\": true et \".write\": true, puis Publier.");
        else showErr("Erreur Firebase (HTTP " + r.status + ").");
        throw new Error("firebase " + r.status);
      }
      return r;
    }
    window.storage = {
      get: async function (key, shared) {
        if (shared && remote) {
          var r = await fb(key);
          var v = await r.json();
          if (v === null) throw new Error("not found");
          return { key: key, value: v, shared: true };
        }
        var l = localStorage.getItem((shared ? "s:" : "p:") + key);
        if (l === null) throw new Error("not found");
        return { key: key, value: l, shared: !!shared };
      },
      set: async function (key, value, shared) {
        if (shared && remote) {
          await fb(key, { method: "PUT", body: JSON.stringify(value) });
          return { key: key, value: value, shared: true };
        }
        localStorage.setItem((shared ? "s:" : "p:") + key, value);
        return { key: key, value: value, shared: !!shared };
      },
      delete: async function (key, shared) {
        if (shared && remote) { await fb(key, { method: "DELETE" }); return { key: key, deleted: true, shared: true }; }
        localStorage.removeItem((shared ? "s:" : "p:") + key);
        return { key: key, deleted: true, shared: !!shared };
      },
      list: async function (prefix, shared) {
        var p = prefix || "";
        var keys = [];
        if (shared && remote) {
          var r = await fetch(CFG.firebaseUrl.replace(/\/$/, "") + "/s.json?shallow=true");
          if (!r.ok) throw new Error("firebase " + r.status);
          var o = (await r.json()) || {};
          keys = Object.keys(o);
        } else {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k.indexOf(shared ? "s:" : "p:") === 0) keys.push(k.slice(2));
          }
        }
        return { keys: keys.filter(function (k) { return k.indexOf(p) === 0; }), prefix: p, shared: !!shared };
      }
    };
  })();
</script>
