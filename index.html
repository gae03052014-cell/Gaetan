// ---------- Settings ----------

async function loadGroup(gid) {
  const raw = await safeGet("group:" + gid, true);
  return raw ? JSON.parse(raw) : null;
}

async function addToIndex(uid, gid) {
  const raw = await safeGet("groups:" + uid, true);
  const arr = raw ? JSON.parse(raw) : [];
  if (arr.indexOf(gid) === -1) await safeSet("groups:" + uid, JSON.stringify(arr.concat([gid])), true);
}

async function removeFromIndex(uid, gid) {
  const raw = await safeGet("groups:" + uid, true);
  if (!raw) return;
  await safeSet("groups:" + uid, JSON.stringify(JSON.parse(raw).filter((x) => x !== gid)), true);
}

async function appendGroupMsg(gid, members, fromId, msg) {
  const raw = await safeGet("conv:" + gid, true);
  const list = raw ? JSON.parse(raw) : [];
  await safeSet("conv:" + gid, JSON.stringify(list.concat([msg])), true);
  await safeSet("last:" + gid, JSON.stringify({ from: fromId, preview: previewOf(msg), ts: msg.ts }), true);
  for (let i = 0; i < members.length; i++) {
    if (members[i] === fromId) continue;
    const ru = await safeGet("unread:" + gid + ":" + members[i], true);
    await safeSet("unread:" + gid + ":" + members[i], String((parseInt(ru, 10) || 0) + 1), true);
  }
}

async function deleteGroupData(gid) {
  const g = await loadGroup(gid);
  if (g) { for (let i = 0; i < g.members.length; i++) await removeFromIndex(g.members[i], gid); }
  const un = await safeList("unread:" + gid + ":");
  await Promise.all(["group:" + gid, "conv:" + gid, "last:" + gid].concat(un).map((k) => safeDelete(k, true)));
}

function GroupInfo({ me, gid, onClose, onLeft, onChanged }) {
  const [g, setG] = useState(null);
  const [names, setNames] = useState({});
  const [friends, setFriends] = useState([]);
  const [sel, setSel] = useState({});
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);

  const load = async () => {
    const grp = await loadGroup(gid);
    if (!grp) return;
    setG(grp);
    setName(grp.name);
    const o = {};
    await Promise.all(grp.members.map(async (u) => {
      const pr = await safeGet("profile:" + u, true);
      if (pr) { const pp = JSON.parse(pr); o[u] = pp.pseudo; if (pp.avatar) AVATARS[u] = pp.avatar; }
    }));
    setNames(o);
    const fr = await getFriendIds(me);
    const fl = await Promise.all(fr.filter((x) => grp.members.indexOf(x) === -1).map(async (u) => {
      const pr = await safeGet("profile:" + u, true);
      return pr ? { id: u, pseudo: JSON.parse(pr).pseudo } : null;
    }));
    setFriends(fl.filter(Boolean));
  };
  useEffect(() => { load(); }, []);

  const sysMsg = (text) => ({ id: Date.now() + "-" + Math.random(), from: me.id, type: "system", content: text, ts: Date.now() });
  const save = async (ng, text) => {
    await safeSet("group:" + gid, JSON.stringify(ng), true);
    if (text) await appendGroupMsg(gid, ng.members, me.id, sysMsg(text));
    onChanged(ng);
    await load();
  };

  const isAdmin = g && g.admin === me.id;
  const rename = async () => {
    const n = name.trim();
    if (n.length < 2 || n === g.name) return;
    await save(Object.assign({}, g, { name: n }), me.pseudo + " a renommé le groupe « " + n + " »");
  };
  const removeMember = async (u) => {
    await removeFromIndex(u, gid);
    await save(Object.assign({}, g, { members: g.members.filter((x) => x !== u) }), me.pseudo + " a retiré " + (names[u] || "un membre"));
  };
  const addMembers = async () => {
    const ids = Object.keys(sel);
    if (!ids.length) return;
    for (let i = 0; i < ids.length; i++) await addToIndex(ids[i], gid);
    const nm = friends.filter((f) => sel[f.id]).map((f) => f.pseudo).join(", ");
    setSel({});
    await save(Object.assign({}, g, { members: g.members.concat(ids) }), me.pseudo + " a ajouté " + nm);
  };
  const leave = async () => {
    setBusy(true);
    const rest = g.members.filter((x) => x !== me.id);
    await removeFromIndex(me.id, gid);
    if (rest.length === 0) {
      await deleteGroupData(gid);
    } else {
      const ng = Object.assign({}, g, { members: rest, admin: g.admin === me.id ? rest[0] : g.admin });
      await safeSet("group:" + gid, JSON.stringify(ng), true);
      await appendGroupMsg(gid, rest, me.id, sysMsg(me.pseudo + " a quitté le groupe"));
    }
    setBusy(false);
    onLeft();
  };

  const card = { background: "var(--card)", border: "1px solid var(--line)" };
  return (
    <div className="px-4 pt-5 pb-10 overflow-y-auto" style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0, zIndex: 45, background: "var(--bg)", color: "var(--fg)" }}>
      <div className="flex items-center gap-2 mb-5">
        <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center"><ArrowLeft size={20} /></button>
        <h1 className="text-xl font-bold">Infos du groupe</h1>
      </div>
      {!g ? <div className="flex justify-center pt-8"><Loader2 size={20} className="animate-spin" /></div> : (
        <>
          <div className="flex flex-col items-center mb-5">
            <Avatar code={gid} pseudo={g.name} size={84} />
            <input value={name} onChange={(e) => setName(e.target.value)} disabled={!isAdmin} maxLength={30} className="mt-3 text-center text-lg font-bold rounded-xl px-3 py-2 outline-none w-full" style={{ background: isAdmin ? "var(--card)" : "transparent", color: "var(--fg)", border: isAdmin ? "1px solid var(--line)" : "none" }} />
            {isAdmin && name.trim() !== g.name && <button onClick={rename} className="mt-2 rounded-xl px-4 py-2 text-xs font-semibold" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>Renommer</button>}
          </div>
          <div className="text-[11px] uppercase tracking-widest mb-2 px-1" style={{ color: "var(--muted)" }}>Membres ({g.members.length})</div>
          <div className="rounded-2xl p-2 mb-5" style={card}>
            {g.members.map((u) => (
              <div key={u} className="flex items-center gap-3 px-2 py-2">
                <Avatar code={u} pseudo={names[u] || "?"} size={36} />
                <div className="flex-1 min-w-0 text-sm font-medium truncate">{u === me.id ? "Toi" : names[u] || "…"}</div>
                {g.admin === u && <span className="text-[10px] rounded-full px-2 py-0.5" style={{ background: "var(--card2)" }}>Admin</span>}
                {isAdmin && u !== me.id && <button onClick={() => removeMember(u)} className="text-xs" style={{ color: "#FF6B5D" }}>Retirer</button>}
              </div>
            ))}
          </div>
          {friends.length > 0 && (
            <>
              <div className="text-[11px] uppercase tracking-widest mb-2 px-1" style={{ color: "var(--muted)" }}>Ajouter des membres</div>
              <div className="rounded-2xl p-2 mb-3" style={card}>
                {friends.map((f) => (
                  <button key={f.id} onClick={() => setSel((s) => { const n = Object.assign({}, s); if (n[f.id]) delete n[f.id]; else n[f.id] = true; return n; })} className="w-full flex items-center gap-3 px-2 py-2 text-left">
                    <Avatar code={f.id} pseudo={f.pseudo} size={32} />
                    <span className="flex-1 text-sm">{f.pseudo}</span>
                    <span>{sel[f.id] ? "☑️" : "⬜"}</span>
                  </button>
                ))}
              </div>
              <button onClick={addMembers} disabled={!Object.keys(sel).length} className="w-full rounded-xl py-3 text-sm font-semibold mb-6 disabled:opacity-40" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>Ajouter</button>
            </>
          )}
          <button onClick={leave} disabled={busy} className="w-full rounded-2xl py-3.5 text-sm font-semibold" style={{ background: "rgba(255,107,93,0.15)", color: "#FF6B5D" }}>Quitter le groupe</button>
        </>
      )}
    </div>
  );
}

function useInstall() {
  const [prompt, setPrompt] = useState(window.__installPrompt || null);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const h = () => setPrompt(window.__installPrompt || null);
    const d = () => setDone(true);
    window.addEventListener("installready", h);
    window.addEventListener("appinstalled", d);
    return () => { window.removeEventListener("installready", h); window.removeEventListener("appinstalled", d); };
  }, []);
  const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true || done;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const install = async () => {
    if (!prompt) return;
    prompt.prompt();
    try { await prompt.userChoice; } catch (e) { /* ignore */ }
    window.__installPrompt = null;
    setPrompt(null);
  };
  return { prompt: prompt, standalone: standalone, ios: ios, install: install };
}

  const removeSound = async () => {
    await safeDelete("sound:" + me.id, false);
    setCustomSoundCache("");
    setSoundUrl("");
  };

  const [camRes, setCamRes] = useState(null);
  const [camBusy, setCamBusy] = useState(false);
  const testDevices = async () => {
    setCamBusy(true);
    setCamRes(null);
    const out = { mic: "non testé", cam: "non testé" };
    try {
      const s1 = await navigator.mediaDevices.getUserMedia({ audio: true });
      out.mic = "✅ Micro OK";
      s1.getTracks().forEach((t) => t.stop());
    } catch (e) { out.mic = "❌ Micro refusé ou indisponible (" + (e && e.name) + ")"; }
    try {
      const s2 = await navigator.mediaDevices.getUserMedia({ video: true });
      out.cam = "✅ Caméra OK";
      s2.getTracks().forEach((t) => t.stop());
    } catch (e) { out.cam = "❌ Caméra refusée ou indisponible (" + (e && e.name) + ")"; }
    setCamRes(out);
    setCamBusy(false);
  };

  const perm = typeof Notification !== "undefined" ? Notification.permission : "unsupported";
  const toggleNotif = async () => {
    if (notifOn(prefs)) { set({ notif: false }); return; }
    if (typeof Notification === "undefined") { flash("Notifications non supportées sur ce navigateur."); return; }
    const r = await Notification.requestPermission();
    if (r === "granted") { set({ notif: true }); notify("Notifications activées", "Tu seras prévenu des nouveaux messages.", "test"); }
    else flash("Autorise les notifications dans les réglages du navigateur.");
  };

  const deleteMine = async () => {
    const rawAcc = await safeGet("account:" + me.code, true);
    if (!rawAcc) { flash("Compte introuvable."); return; }
    const acc = JSON.parse(rawAcc);
    const check = await hashPassword(delPw, acc.salt);
    if (check !== acc.hash) { flash("Mot de passe incorrect."); return; }
    await deleteAccountData(me.id, me.code);
    await onLogout();
  };

  const saveAvatar = async (av) => {
    const rawP = await safeGet("profile:" + me.id, true);
    const pr = rawP ? JSON.parse(rawP) : {};
    if (av) pr.avatar = av; else delete pr.avatar;
    await safeSet("profile:" + me.id, JSON.stringify(pr), true);
    const updated = Object.assign({}, me, { avatar: av || undefined });
    if (av) AVATARS[me.id] = av; else delete AVATARS[me.id];
    await safeSet("profile", JSON.stringify(updated), false);
    onProfileUpdate(updated);
  };
  const pickPhoto = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try { await saveAvatar({ img: await compressImage(f, 160, 0.72) }); } catch (err) { flash((err && err.message) || "Image illisible."); }
  };
  const curAv = AVATARS[me.id] || {};

  const flash = (t) => {
    setMsg(t);
    setTimeout(() => setMsg(""), 7000);
  };

  const savePseudo = async () => {
    const clean = pseudo.trim();
    if (clean.length < 2) { flash("Pseudo trop court (2 caractères minimum)."); return; }
    if (!me.admin && isReservedPseudo(clean)) { flash("Ce pseudo est réservé."); return; }
    const rawAcc = await safeGet("account:" + me.code, true);
    if (rawAcc) {
      const acc = JSON.parse(rawAcc);
      acc.pseudo = clean;
      await safeSet("account:" + me.code, JSON.stringify(acc), true);
    }
    const rawP = await safeGet("profile:" + me.id, true);
    const pr = rawP ? JSON.parse(rawP) : {};
    await safeSet("profile:" + me.id, JSON.stringify(Object.assign({}, pr, { pseudo: clean })), true);
    const updated = Object.assign({}, me, { pseudo: clean });
    await safeSet("profile", JSON.stringify(updated), false);
    onProfileUpdate(updated);
    flash("Pseudo mis à jour ✓");
  };

  const savePassword = async () => {
    if (newPw.length < 4) { flash("Nouveau mot de passe : 4 caractères minimum."); return; }
    const rawAcc = await safeGet("account:" + me.code, true);

const ICE_CONFIG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };

const SOUND_MAX = 400000;
let customSoundCache = null;

async function loadCustomSound(uid) {
  if (customSoundCache !== null) return customSoundCache;
  try {
    const r = await safeGet("sound:" + uid, false);
    customSoundCache = r || "";
  } catch (e) {
    customSoundCache = "";
  }
  return customSoundCache;
}

function setCustomSoundCache(url) {
  customSoundCache = url || "";
}

function playOnce(url) {
  try {
    const a = new Audio(url);
    a.volume = 0.7;
    a.play().catch(() => {});
  } catch (e) { /* lecture impossible */ }
}

function beep(freq, ms) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = freq || 880;
    g.gain.value = 0.08;
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    setTimeout(() => { o.stop(); ctx.close(); }, ms || 150);
  } catch (e) { /* pas de son */ }
}

function notifOn(p) {
  return typeof Notification !== "undefined" && Notification.permission === "granted" && !(p && p.notif === false) && !dndNow(p);
}
async function getSW() {
  if (!("serviceWorker" in navigator)) return null;
  try { return await Promise.race([navigator.serviceWorker.ready, new Promise((res) => setTimeout(() => res(null), 2500))]); } catch (e) { return null; }
}
async function notify(title, body, tag, opts) {
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const call = tag === "call";
  const o = Object.assign({
    body: body, tag: tag, renotify: true, icon: "icon-192.png", badge: "badge.png",
    vibrate: call ? [400, 200, 400, 200, 400, 200, 400] : [200, 100, 200], requireInteraction: call, timestamp: Date.now(), data: { tag: tag, url: "./" },
  }, opts || {});
  if (String(tag).indexOf("msg-") === 0 && tag !== "msg-test") o.actions = [{ action: "reply", type: "text", title: "Répondre", placeholder: "Ta réponse…" }, { action: "read", title: "Marquer comme lu" }];
  try {
    const reg = await getSW();
    if (reg && reg.showNotification) { await reg.showNotification(title, o); return; }
  } catch (e) { /* repli */ }
  try { new Notification(title, { body: body, tag: tag, icon: "icon-192.png" }); } catch (e) { /* non supporté */ }
}
async function getFriendIds(me) {
  const a = await safeGet("contacts:" + me.id, false);
  const b = await safeGet("inbox:" + me.id, true);
  const ids = (a ? JSON.parse(a) : []).concat(b ? JSON.parse(b) : []);
  return Array.from(new Set(ids)).filter((x) => x !== me.id);
}

async function appendMessage(me, other, msg) {
  const id = convId(me.id, other.id);
  const raw = await safeGet("conv:" + id, true);
  let list = raw ? JSON.parse(raw) : [];
  list = await convDecode(list, me.id, other.id);
  const nowT = Date.now();
  const stored = await convEncode(list.filter((x) => !(x.exp && x.exp < nowT)).concat([msg]), me.id, other.id);
  const encrypted = !!stored[stored.length - 1].enc;
  await safeSet("conv:" + id, JSON.stringify(stored), true);
  await safeSet("last:" + id, JSON.stringify(await lastObj(me.id, other.id, msg)), true);
  const ru = await safeGet("unread:" + id + ":" + other.id, true);
  await safeSet("unread:" + id + ":" + other.id, String((parseInt(ru, 10) || 0) + 1), true);
  if (msg.type !== "system" && msg.type !== "calllog") pingPush([other.id], me.pseudo, previewSafe(msg, encrypted), "msg-" + me.id);
}

function CallManager({ me, req, prefs, viewing, onOpenChat }) {
  const [call, setCall] = useState(null);
  const [incoming, setIncoming] = useState(null);
  const [toast, setToast] = useState(null);
  const [err, setErr] = useState("");
  const [secs, setSecs] = useState(0);
  const [muted, setMuted] = useState(false);
  const [camOff, setCamOff] = useState(false);
  const [tick, setTick] = useState(0);
  const [ann, setAnn] = useState(null);
  const annNotified = useRef({});
  const pcRef = useRef(null);
  const localRef = useRef(null);
  const remoteRef = useRef(null);
  const callRef = useRef(null);
  const incRef = useRef(null);
  const pollRef = useRef(null);
  const iceTimer = useRef(null);
  const localIce = useRef([]);
  const doneIce = useRef(0);
  const answered = useRef(false);
  const finished = useRef(false);
  const connectedAt = useRef(0);
  const handled = useRef({});
  const seenUnread = useRef({});
  const names = useRef({});
  const lastReq = useRef(0);
  const ringTimer = useRef(null);
  const busy = useRef(false);
  const rVid = useRef(null);
  const lVid = useRef(null);
  const prefsRef = useRef(prefs);
  prefsRef.current = prefs;
  const viewRef = useRef(viewing);
  viewRef.current = viewing;
  incRef.current = incoming;
  const soundOn = () => prefsRef.current.sound !== false && !dndNow(prefsRef.current);

  const ringAudio = useRef(null);
  const customSound = useRef("");
  useEffect(() => { loadCustomSound(me.id).then((u) => { customSound.current = u; }); }, [me.id]);

  const startRing = () => {
    clearInterval(ringTimer.current);
    if (customSound.current) {
      try {
        const a = new Audio(customSound.current);
        a.loop = true;
        a.volume = 0.8;
        ringAudio.current = a;
        if (soundOn()) a.play().catch(() => {});
      } catch (e) { /* lecture impossible */ }
    }
    ringTimer.current = setInterval(() => {
      if (!soundOn()) return;
      if (customSound.current) { if (ringAudio.current && ringAudio.current.paused) ringAudio.current.play().catch(() => {}); }
      else { beep(660, 200); setTimeout(() => beep(880, 200), 260); }
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) { /* ignore */ }
    }, 1600);
  };
  const stopRing = () => {
    clearInterval(ringTimer.current);
    if (ringAudio.current) { ringAudio.current.pause(); ringAudio.current = null; }
  };
  const playAlert = () => { if (customSound.current) playOnce(customSound.current); else beep(880, 120); };

  const resetCallState = () => {
    finished.current = false;
    answered.current = false;
    connectedAt.current = 0;
    doneIce.current = 0;
    localIce.current = [];
    setSecs(0);
    setMuted(false);
    setCamOff(false);
  };

  const getMedia = async (kind) => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("nomedia");
    return navigator.mediaDevices.getUserMedia({ audio: true, video: kind === "video" ? { facingMode: "user" } : false });
  };

  const finish = async (result, remote) => {
    if (finished.current) return;
    finished.current = true;
    clearInterval(pollRef.current);
    clearTimeout(iceTimer.current);
    const c = callRef.current;
    if (localRef.current) localRef.current.getTracks().forEach((t) => t.stop());
    if (pcRef.current) { try { pcRef.current.close(); } catch (e) { /* ignore */ } }
    pcRef.current = null;
    localRef.current = null;
    const dur = connectedAt.current ? Math.round((Date.now() - connectedAt.current) / 1000) : 0;
    if (c) {
      setCall(Object.assign({}, c, { status: "ended", dur: dur }));
      if (!remote) {
        const raw = await safeGet("call:" + c.cid, true);
        const cur = raw ? JSON.parse(raw) : null;
        if (cur && cur.callId === c.callId && cur.state !== "ended" && cur.state !== "declined") {
          await safeSet("call:" + c.cid, JSON.stringify(Object.assign({}, cur, { state: result })), true);
        }
      }
      if (c.role === "caller") {
        const res = dur > 0 ? "ended" : result === "declined" ? "declined" : "missed";
        await appendMessage(me, c.other, { id: Date.now() + "-" + Math.random(), from: me.id, type: "calllog", kind: c.kind, result: res, dur: dur, ts: Date.now() });
      }
      safeDelete("ice:" + c.cid + ":" + c.callId + ":" + me.id, true);
    }
    setTimeout(() => { callRef.current = null; setCall(null); }, 1400);
  };

  const makePC = (cid, callId, stream) => {
    const pc = new RTCPeerConnection(ICE_CONFIG);
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    const remote = new MediaStream();
    remoteRef.current = remote;
    pc.ontrack = (e) => { remote.addTrack(e.track); setTick((n) => n + 1); };
    pc.onicecandidate = (e) => {
      if (!e.candidate) return;
      localIce.current.push(e.candidate.toJSON());
      clearTimeout(iceTimer.current);
      iceTimer.current = setTimeout(() => safeSet("ice:" + cid + ":" + callId + ":" + me.id, JSON.stringify(localIce.current), true), 400);
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connected" && !connectedAt.current) {
        connectedAt.current = Date.now();
        setCall((c) => (c ? Object.assign({}, c, { status: "connected" }) : c));
      }
      if (pc.connectionState === "failed") finish("ended", false);
    };
    pcRef.current = pc;
    localRef.current = stream;
    return pc;
  };

  const startPoll = (cid, callId, role, other) => {
    clearInterval(pollRef.current);
    pollRef.current = setInterval(async () => {
      if (finished.current) return;
      const raw = await safeGet("call:" + cid, true);
      const rec = raw ? JSON.parse(raw) : null;
      if (!rec || rec.callId !== callId || ["ended", "declined", "missed"].indexOf(rec.state) !== -1) {
        finish(rec && rec.callId === callId ? rec.state : "ended", true);
        return;
      }
      const pc = pcRef.current;
      if (!pc) return;
      if (role === "caller" && rec.state === "active" && rec.answer && !answered.current) {
        answered.current = true;
        try { await pc.setRemoteDescription(JSON.parse(rec.answer)); } catch (e) { finish("ended", false); return; }
        setCall((c) => (c ? Object.assign({}, c, { status: "connecting" }) : c));
      }
      if (role === "caller" && rec.state === "ringing" && Date.now() - rec.ts > 45000) { finish("missed", false); return; }
      if (pc.remoteDescription) {
        const ri = await safeGet("ice:" + cid + ":" + callId + ":" + other.id, true);
        const arr = ri ? JSON.parse(ri) : [];
        while (doneIce.current < arr.length) {
          try { await pc.addIceCandidate(arr[doneIce.current]); } catch (e) { /* ignore */ }
          doneIce.current++;
        }
      }
    }, 1000);
  };

  const startCall = async (other, kind) => {
    if (callRef.current) return;
    setErr("");
    if (!window.RTCPeerConnection) { setErr("Appels non supportés par ce navigateur."); return; }
    let stream;
    try { stream = await getMedia(kind); } catch (e) { setErr("Micro ou caméra refusé ou indisponible (le site doit être en https)."); return; }
    resetCallState();
    const cid = convId(me.id, other.id);
    const callId = Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    const pc = makePC(cid, callId, stream);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const rec = { callId: callId, state: "ringing", from: me.id, to: other.id, kind: kind, offer: JSON.stringify(pc.localDescription), ts: Date.now() };
    await safeSet("call:" + cid, JSON.stringify(rec), true);
    pingPush([other.id], me.pseudo, "Appel " + (kind === "video" ? "vidéo " : "") + "entrant", "call");
    const c = { cid: cid, callId: callId, other: other, kind: kind, role: "caller", status: "ringing" };
    callRef.current = c;
    setCall(c);
    startPoll(cid, callId, "caller", other);
  };

  const declineWrite = (inc) => safeSet("call:" + inc.cid, JSON.stringify(Object.assign({}, inc.rec, { state: "declined" })), true);

  const acceptIncoming = async () => {
    const inc = incoming;
    if (!inc || callRef.current) return;
    stopRing();
    setIncoming(null);
    setErr("");
    let stream;
    try { stream = await getMedia(inc.rec.kind); } catch (e) { setErr("Micro ou caméra refusé ou indisponible."); await declineWrite(inc); return; }
    resetCallState();
    const pc = makePC(inc.cid, inc.rec.callId, stream);
    await pc.setRemoteDescription(JSON.parse(inc.rec.offer));
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await safeSet("call:" + inc.cid, JSON.stringify(Object.assign({}, inc.rec, { state: "active", answer: JSON.stringify(pc.localDescription) })), true);
    const c = { cid: inc.cid, callId: inc.rec.callId, other: inc.other, kind: inc.rec.kind, role: "callee", status: "connecting" };
    callRef.current = c;
    setCall(c);
    startPoll(inc.cid, inc.rec.callId, "callee", inc.other);
  };

  const declineIncoming = async () => {
    const inc = incoming;
    stopRing();
    setIncoming(null);
    if (inc) await declineWrite(inc);
  };

  const toggleMute = () => {
    const next = !muted;
    if (localRef.current) localRef.current.getAudioTracks().forEach((t) => { t.enabled = !next; });
    setMuted(next);
  };
  const toggleCam = () => {
    const next = !camOff;
    if (localRef.current) localRef.current.getVideoTracks().forEach((t) => { t.enabled = !next; });
    setCamOff(next);
  };

  // appel demandé depuis une conversation
  useEffect(() => {
    if (req && req.n !== lastReq.current) {
      lastReq.current = req.n;
      startCall(req.other, req.kind);
    }
  }, [req]);

  // boucle d'arrière-plan : notifications de messages + appels entrants
  useEffect(() => {
    let stopped = false;
    const run = async () => {
      if (stopped || busy.current) return;
      busy.current = true;
      try {
        const ids = await getFriendIds(me);
        const first = !seenUnread.current.__init;
        let total = 0;
        const data = await Promise.all(ids.map(async (id) => {
          const cid = convId(me.id, id);
          const r = await Promise.all([safeGet("last:" + cid, true), safeGet("unread:" + cid + ":" + me.id, true), safeGet("call:" + cid, true)]);
          if (!names.current[id]) {
            const pr = await safeGet("profile:" + id, true);
            names.current[id] = pr ? JSON.parse(pr).pseudo : "Quelqu'un";
            if (pr && JSON.parse(pr).avatar) AVATARS[id] = JSON.parse(pr).avatar;
          }
          if (r[0]) r[0] = await decLastRaw(r[0], me.id, id);
          return { id: id, cid: cid, r: r };
        }));
        data.forEach((d) => {
          const id = d.id;
          const p = prefsRef.current;
          const off = (p.blocked || []).indexOf(id) !== -1;
          const mute = (p.muted || []).indexOf(id) !== -1;
          const un = parseInt(d.r[1], 10) || 0;
          const last = d.r[0] ? JSON.parse(d.r[0]) : null;
          if (!off && !mute) total += un;
          const viewingNow = viewRef.current === id && !document.hidden;
          if (!first && !off && !mute && un > (seenUnread.current[id] || 0) && last && last.from !== me.id && !viewingNow) {
            if (soundOn()) playAlert();
            if (document.hidden) { if (notifOn(p)) notify(names.current[id], (un > 1 ? un + " nouveaux messages · " : "") + last.preview, "msg-" + id); }
            else setToast({ id: id, pseudo: names.current[id], preview: last.preview, n: Date.now() });
          }
          seenUnread.current[id] = un;
          if (d.r[2] && !off) {
            const rec = JSON.parse(d.r[2]);
            if (incRef.current && incRef.current.rec.callId === rec.callId && rec.state !== "ringing") { stopRing(); setIncoming(null); }
            if (rec.state === "ringing" && rec.to === me.id && Date.now() - rec.ts < 45000 && !handled.current[rec.callId] && !callRef.current) {
              handled.current[rec.callId] = true;
              setIncoming({ cid: d.cid, rec: rec, other: { id: id, pseudo: names.current[id] } });
              startRing();
              if (document.hidden && notifOn(p)) notify("Appel " + (rec.kind === "video" ? "vidéo " : "") + "entrant", names.current[id], "call");
            }
          }
        });
        const grRaw = await safeGet("groups:" + me.id, true);
        const gl = grRaw ? JSON.parse(grRaw) : [];
        const gdata = await Promise.all(gl.map(async (gid) => {
          const r = await Promise.all([safeGet("last:" + gid, true), safeGet("unread:" + gid + ":" + me.id, true)]);
          if (!names.current[gid]) { const gg = await safeGet("group:" + gid, true); names.current[gid] = gg ? JSON.parse(gg).name : "Groupe"; }
          return { gid: gid, r: r };
        }));
        gdata.forEach((d) => {
          const p = prefsRef.current;
          const un = parseInt(d.r[1], 10) || 0;
          const last = d.r[0] ? JSON.parse(d.r[0]) : null;
          const mute = (p.muted || []).indexOf(d.gid) !== -1;
          if (!mute) total += un;
          if (!first && !mute && un > (seenUnread.current[d.gid] || 0) && last && last.from !== me.id && last.preview && !(viewRef.current === d.gid && !document.hidden)) {
            if (soundOn()) playAlert();
            if (document.hidden) { if (notifOn(p)) notify(names.current[d.gid], last.preview, "grp-" + d.gid); }
            else setToast({ id: d.gid, pseudo: names.current[d.gid], preview: last.preview, group: true, n: Date.now() });
          }
          seenUnread.current[d.gid] = un;
        });
        const ra = await safeGet("announce", true);
        if (ra) {
          const list = JSON.parse(ra).filter((a) => a.ts >= (me.createdAt || 0));
          const sr = await safeGet("annSeen:" + me.id, false);
          const seenIds = sr ? JSON.parse(sr) : [];
          const fresh = list.filter((a) => seenIds.indexOf(a.id) === -1);
          if (fresh.length) {
            const a = fresh[fresh.length - 1];
            setAnn({ text: a.text, ids: fresh.map((x) => x.id) });
            if (!annNotified.current[a.id]) {
              annNotified.current[a.id] = true;
              if (soundOn()) playAlert();
              if (document.hidden && notifOn(prefsRef.current)) notify("📢 Annonce", a.text, "ann");
            }
          }
        }
        seenUnread.current.__init = true;
        document.title = total > 0 ? "(" + total + ") Sans-Trace" : "Sans-Trace";
        try { if (navigator.setAppBadge) { if (total > 0) navigator.setAppBadge(total); else navigator.clearAppBadge(); } } catch (e) { /* ignore */ }
      } catch (e) { /* ignore */ }
      busy.current = false;
    };
    run();
    const t = setInterval(run, 3000);
    return () => { stopped = true; clearInterval(t); stopRing(); };
  }, [me.id]);

  useEffect(() => {
    if (!incoming) return;
    const t = setTimeout(() => { stopRing(); setIncoming(null); }, 45000);
    return () => clearTimeout(t);
  }, [incoming]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 5000);
    return () => clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    if (!err) return;
    const t = setTimeout(() => setErr(""), 6000);
    return () => clearTimeout(t);
  }, [err]);

  useEffect(() => {
    if (!call || call.status !== "connected") return;
    const t = setInterval(() => setSecs(Math.round((Date.now() - connectedAt.current) / 1000)), 1000);
    return () => clearInterval(t);
  }, [call && call.status]);

  useEffect(() => {
    if (rVid.current && remoteRef.current) {
      rVid.current.srcObject = remoteRef.current;
      if (rVid.current.play) rVid.current.play().catch(() => {});
    }
    if (lVid.current && localRef.current) lVid.current.srcObject = localRef.current;
  }, [call, tick]);

  const shell = { position: "fixed", top: 0, bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480 };
  const status = !call ? "" : call.status === "ringing" ? "Appel en cours…" : call.status === "connecting" ? "Connexion…" : call.status === "connected" ? "En communication · " + fmtDur(secs) : "Appel terminé" + (call.dur ? " · " + fmtDur(call.dur) : "");
  const round = "w-16 h-16 rounded-full flex items-center justify-center text-2xl";

  return (
    <>
      {err && <div className="fixed top-3 z-[90] rounded-2xl px-4 py-3 text-sm font-medium" style={Object.assign({ background: "#FF6B5D", color: "#0F1115", maxWidth: 360 }, { position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)" })}>{err}</div>}

      {ann && !call && !incoming && (
        <div className="fixed top-3 z-[66] rounded-2xl px-4 py-3 text-sm" style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", width: "calc(100% - 24px)", maxWidth: 420, background: "var(--accent)", color: "var(--on-accent)", boxShadow: "0 12px 30px -10px rgba(0,0,0,0.6)" }}>
          <div className="font-semibold mb-0.5">📢 Annonce</div>
          <div className="mb-2">{ann.text}</div>
          <button onClick={async () => { const sr = await safeGet("annSeen:" + me.id, false); await safeSet("annSeen:" + me.id, JSON.stringify((sr ? JSON.parse(sr) : []).concat(ann.ids)), false); setAnn(null); }} className="rounded-full px-3 py-1 text-xs font-semibold" style={{ background: "rgba(0,0,0,0.2)" }}>OK</button>
        </div>
      )}
      {toast && !call && !incoming && (
        <button onClick={async () => { const t = toast; setToast(null); if (t.group) { const g = await loadGroup(t.id); if (g) onOpenChat({ id: t.id, pseudo: g.name, isGroup: true, members: g.members, admin: g.admin, avatar: g.avatar }); } else onOpenChat({ id: t.id, pseudo: t.pseudo }); }} className="fixed top-3 z-[65] rounded-2xl px-4 py-3 text-left text-sm" style={{ position: "fixed", top: 12, left: "50%", transform: "translateX(-50%)", width: "calc(100% - 24px)", maxWidth: 420, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--line2)", boxShadow: "0 12px 30px -10px rgba(0,0,0,0.6)" }}>
          <div className="font-semibold">{toast.pseudo}</div>
          <div className="truncate" style={{ color: "var(--muted)" }}>{toast.preview}</div>
        </button>
      )}

      {incoming && !call && (
        <div className="fixed top-0 bottom-0 z-[70] flex flex-col items-center justify-between py-16 px-6" style={Object.assign({ background: "radial-gradient(120% 70% at 50% 0%, var(--glow) 0%, var(--bg) 70%)", color: "var(--fg)" }, shell)}>
          <div className="text-center">
            <div className="text-sm mb-6" style={{ color: "var(--muted)" }}>{incoming.rec.kind === "video" ? "Appel vidéo entrant" : "Appel audio entrant"}</div>
            <div className="flex justify-center mb-5"><Avatar code={incoming.other.id} pseudo={incoming.other.pseudo} size={110} /></div>
            <div className="text-2xl font-bold">{incoming.other.pseudo}</div>
          </div>
          <div className="flex gap-16">
            <button onClick={declineIncoming} className={round} style={{ background: "#FF4D4D", color: "#fff" }} title="Refuser">✖</button>
            <button onClick={acceptIncoming} className={round} style={{ background: "#22C55E", color: "#fff" }} title="Répondre">📞</button>
          </div>
        </div>
      )}

      {call && (
        <div className="fixed top-0 bottom-0 z-[70] flex flex-col" style={Object.assign({ background: "radial-gradient(120% 70% at 50% 0%, var(--glow) 0%, var(--bg) 70%)", color: "var(--fg)" }, shell)}>
          <video ref={rVid} autoPlay playsInline style={call.kind === "video" ? { position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", background: "#000" } : { position: "absolute", width: 1, height: 1, opacity: 0 }} />
          {call.kind === "video" && <video ref={lVid} autoPlay playsInline muted style={{ position: "absolute", top: 16, right: 16, width: 96, height: 128, objectFit: "cover", borderRadius: 14, background: "#222", border: "2px solid rgba(255,255,255,0.3)", zIndex: 2, transform: "scaleX(-1)" }} />}
          <div className="relative z-[1] flex-1 flex flex-col items-center pt-20 text-center" style={{ position: "relative", zIndex: 1 }}>
            {call.kind !== "video" && <div className="mb-5"><Avatar code={call.other.id} pseudo={call.other.pseudo} size={110} /></div>}
            <div className="text-2xl font-bold" style={call.kind === "video" ? { textShadow: "0 2px 8px rgba(0,0,0,0.7)", color: "#fff" } : {}}>{call.other.pseudo}</div>
            <div className="text-sm mt-1" style={call.kind === "video" ? { textShadow: "0 2px 8px rgba(0,0,0,0.7)", color: "#fff" } : { color: "var(--muted)" }}>{status}</div>
          </div>
          <div className="relative z-[1] flex items-center justify-center gap-6 pb-12" style={{ position: "relative", zIndex: 1 }}>
            <button onClick={toggleMute} className={round} style={{ background: muted ? "#fff" : "rgba(255,255,255,0.18)", color: muted ? "#111" : "#fff" }} title="Micro">{muted ? "🔇" : "🎤"}</button>
            {call.kind === "video" && <button onClick={toggleCam} className={round} style={{ background: camOff ? "#fff" : "rgba(255,255,255,0.18)", color: camOff ? "#111" : "#fff" }} title="Caméra">{camOff ? "🚫" : "📹"}</button>}
            <button onClick={() => finish("ended", false)} className={round} style={{ background: "#FF4D4D", color: "#fff" }} title="Raccrocher">📞</button>
          </div>
        </div>
      )}
    </>
  );
}

function Admin({ me, onBack }) {
  const [ok, setOk] = useState(null);
  const [rows, setRows] = useState(null);
  const [stats, setStats] = useState(null);
  const [msgCount, setMsgCount] = useState(null);
  const [target, setTarget] = useState(null);
  const [busy, setBusy] = useState(false);
  const [q, setQ] = useState("");
  const [tmpPw, setTmpPw] = useState("");
  const [note, setNote] = useState("");
  const [annText, setAnnText] = useState("");
  const [anns, setAnns] = useState([]);
  const [flt, setFlt] = useState("all");
  const [codeEdit, setCodeEdit] = useState(null);
  const [srt, setSrt] = useState("new");

  const flash = (t) => { setNote(t); setTimeout(() => setNote(""), 3000); };

  const loadAnns = async () => {
    const raw = await safeGet("announce", true);
    setAnns(raw ? JSON.parse(raw) : []);
  };

  const load = useCallback(async () => {
    const keys = await safeList("profile:");
    const now = Date.now();
    const list = await Promise.all(keys.map(async (k) => {
      const id = k.slice(8);
      const r = await Promise.all([safeGet(k, true), safeGet("seen:" + id, true), safeGet("banned:" + id, true)]);
      const p = r[0] ? JSON.parse(r[0]) : null;
      if (!p) return null;
      if (p.avatar) AVATARS[id] = p.avatar;
      return { id: id, pseudo: p.pseudo, code: p.code, createdAt: p.createdAt || 0, seen: parseInt(r[1], 10) || 0, banned: !!r[2] };
    }));
    const accounts = list.filter(Boolean).sort((a, b) => b.createdAt - a.createdAt);
    const convs = (await safeList("last:")).length;
    setRows(accounts);
    setStats({
      total: accounts.length,
      today: accounts.filter((a) => now - a.createdAt < 86400000).length,
      week: accounts.filter((a) => now - a.createdAt < 7 * 86400000).length,
      online: accounts.filter((a) => now - a.seen < 45000).length,
      banned: accounts.filter((a) => a.banned).length,
      inactive: accounts.filter((a) => a.id !== ADMIN_ID && now - Math.max(a.seen, a.createdAt) > 30 * 86400000).length,
      convs: convs,
    });
  }, []);

  useEffect(() => {
    (async () => {
      const raw = await safeGet("account:" + me.code, true);
      const acc = raw ? JSON.parse(raw) : null;
      const allowed = !!(acc && acc.admin && me.id === ADMIN_ID);
      setOk(allowed);
      if (allowed) { load(); loadAnns(); }
    })();
  }, []);

  const countMessages = async () => {
    setMsgCount("…");
    const keys = await safeList("conv:");
    let total = 0;
    for (let i = 0; i < keys.length; i++) {
      const raw = await safeGet(keys[i], true);
      try { total += raw ? JSON.parse(raw).length : 0; } catch (e) { /* ignore */ }
    }
    setMsgCount(total);
  };

  const sendAnnounce = async () => {
    const text = annText.trim();
    if (!text) return;
    const raw = await safeGet("announce", true);
    const list = raw ? JSON.parse(raw) : [];
    const item = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 6), text: text, ts: Date.now() };
    await safeSet("announce", JSON.stringify(list.concat([item]).slice(-20)), true);
    const seenRaw = await safeGet("annSeen:" + me.id, false);
    await safeSet("annSeen:" + me.id, JSON.stringify((seenRaw ? JSON.parse(seenRaw) : []).concat([item.id])), false);
    setAnnText("");
    await loadAnns();
    flash("Annonce envoyée à tout le monde ✓");
  };

  const deleteAnn = async (id) => {
    await safeSet("announce", JSON.stringify(anns.filter((a) => a.id !== id)), true);
    await loadAnns();
  };

  const exportCsv = () => {
    const head = "pseudo;code;cree_le;derniere_connexion;statut";
    const lines = (rows || []).map((a) => [a.pseudo, a.code, new Date(a.createdAt).toISOString(), a.seen ? new Date(a.seen).toISOString() : "", a.banned ? "suspendu" : "actif"].join(";"));
    const blob = new Blob(["\\ufeff" + [head].concat(lines).join("\\n")], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "comptes.csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const run = async () => {
    const t = target;
    if (t.action === "reset" && tmpPw.length < 4) { flash("Mot de passe : 4 caractères minimum."); return; }
    setBusy(true);
    if (t.action === "ban") await safeSet("banned:" + t.id, "1", true);
    if (t.action === "unban") await safeDelete("banned:" + t.id, true);
    if (t.action === "delete") await deleteAccountData(t.id, t.code);
    if (t.action === "purge") { for (let i = 0; i < t.list.length; i++) await deleteAccountData(t.list[i].id, t.list[i].code); }
    if (t.action === "reset") {
      const raw = await safeGet("account:" + t.code, true);
      if (raw) {
        const acc = JSON.parse(raw);
        acc.salt = randomSalt();
        acc.hash = await hashPassword(tmpPw, acc.salt);
        await safeSet("account:" + t.code, JSON.stringify(acc), true);
        flash("Mot de passe de " + t.pseudo + " réinitialisé ✓");
      }
    }
    setBusy(false);
    setTarget(null);
    setTmpPw("");
    await load();
  };

  const openPurge = () => {
    const now = Date.now();
    const list = (rows || []).filter((a) => a.id !== ADMIN_ID && now - Math.max(a.seen, a.createdAt) > 30 * 86400000);
    if (!list.length) { flash("Aucun compte inactif depuis 30 jours."); return; }
    setTarget({ action: "purge", list: list, pseudo: list.length + " comptes" });
  };

  const nowA = Date.now();
  const shown = (rows || []).filter((a) => a.pseudo.toLowerCase().indexOf(q.toLowerCase()) !== -1 || (a.code || "").indexOf(q.toUpperCase()) !== -1)
    .filter((a) => flt === "all" || (flt === "online" && nowA - a.seen < 45000) || (flt === "banned" && a.banned) || (flt === "inactive" && a.id !== ADMIN_ID && nowA - Math.max(a.seen, a.createdAt) > 30 * 86400000))
    .sort((x, y) => (srt === "name" ? x.pseudo.localeCompare(y.pseudo) : srt === "seen" ? y.seen - x.seen : y.createdAt - x.createdAt));
  const logAdmin = async (t) => { const raw = await safeGet("adminlog", true); let l = []; try { l = raw ? JSON.parse(raw) : []; } catch (e) { l = []; } await safeSet("adminlog", JSON.stringify(l.concat([{ ts: Date.now(), t: t }]).slice(-60)), true); };
  const kickUser = async (a) => { await safeSet("kick:" + a.id, String(Date.now()), true); await logAdmin("Déconnexion forcée de " + a.pseudo); flash(a.pseudo + " sera déconnecté ✓"); };
  const warnUser = async (a) => { const t = window.prompt("Message d'avertissement pour " + a.pseudo + " :"); if (!t) return; await safeSet("warn:" + a.id, JSON.stringify({ text: t.slice(0, 280), ts: Date.now() }), true); await logAdmin("Avertissement envoyé à " + a.pseudo); flash("Avertissement envoyé ✓"); };
  const card = { background: "var(--card)", border: "1px solid var(--line)" };
  const title = { color: "var(--muted)" };
  const label = (t) => <div className="text-[11px] uppercase tracking-widest mb-2 px-1" style={title}>{t}</div>;
  const small = "flex-1 rounded-xl py-2 text-xs font-semibold";

  return (
    <div className="h-full overflow-y-auto px-4 pt-5 pb-12 relative" style={{ background: "radial-gradient(120% 60% at 50% -10%, var(--glow) 0%, var(--bg) 60%)", color: "var(--fg)" }}>
      <div className="flex items-center gap-2 mb-5">
        <button onClick={onBack} className="w-10 h-10 rounded-full flex items-center justify-center"><ArrowLeft size={20} /></button>
        <h1 className="text-xl font-bold">🛡️ Administration</h1>
      </div>
      {ok && stats && (
        <div className="sticky top-0 z-20 -mx-4 px-4 py-2 mb-3 flex gap-1.5 overflow-x-auto" style={{ background: "color-mix(in srgb, var(--bg) 85%, transparent)", backdropFilter: "blur(12px)" }}>
          {[["adm-stats", "📊 Vue"], ["adm-support", "💬 Aide"], ["adm-reports", "🚩 Signalements"], ["adm-ann", "📢 Annonces"], ["adm-log", "📜 Journal"], ["adm-users", "👥 Comptes"]].map((t) => <button key={t[0]} onClick={() => { const el = document.getElementById(t[0]); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }} className="rounded-full px-3 py-1.5 text-xs font-semibold shrink-0" style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>{t[1]}</button>)}
        </div>
      )}

      {ok === null && <div className="flex justify-center pt-10"><Loader2 size={20} className="animate-spin" /></div>}
      {ok === false && <p className="text-sm" style={{ color: "#FF6B5D" }}>Accès refusé : ce compte n'est pas administrateur.</p>}

      {ok && stats && (
        <>
          <div id="adm-stats" style={{ scrollMarginTop: 56 }} />
          <SignupChart rows={rows} card={card} title={title} label={label} />
          <div className="grid grid-cols-2 gap-3 mb-3">
            {[["Comptes", stats.total], ["En ligne", stats.online], ["Nouveaux (24 h)", stats.today], ["Nouveaux (7 j)", stats.week], ["Conversations", stats.convs], ["Suspendus", stats.banned], ["Inactifs (30 j)", stats.inactive]].map((s) => (
              <div key={s[0]} className="rounded-2xl p-4" style={Object.assign({}, card, { background: "linear-gradient(145deg, color-mix(in srgb, var(--accent) 14%, var(--card)), var(--card))" })}>
                <div className="text-2xl font-bold" style={{ color: "var(--accent-text)" }}>{s[1]}</div>
                <div className="text-xs mt-0.5" style={title}>{s[0]}</div>
              </div>
            ))}
            <div className="rounded-2xl p-4 flex items-center justify-between" style={card}>
              <div>
                <div className="text-2xl font-bold" style={{ color: "var(--accent-text)" }}>{msgCount === null ? "—" : msgCount}</div>
                <div className="text-xs mt-0.5" style={title}>Messages</div>
              </div>
              <button onClick={countMessages} className="rounded-xl px-3 py-2 text-xs font-semibold" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>Compter</button>
            </div>
          </div>

          {codeEdit && <CodeEditModal acc={codeEdit} onClose={() => setCodeEdit(null)} onDone={(m) => { setCodeEdit(null); flash(m); load(); }} />}
          <div id="adm-support" style={{ scrollMarginTop: 56 }} />
          <SupportPanel flash={flash} card={card} title={title} label={label} onSearch={(n) => { setQ(n || ""); const el = document.getElementById("adm-users"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }} />
          <div id="adm-reports" style={{ scrollMarginTop: 56 }} />
          <ReportsPanel flash={flash} card={card} title={title} label={label} adminId={ADMIN_ID} />
          <div id="adm-ann" style={{ scrollMarginTop: 56 }} />

          <div className="mt-6">{label("📢 Annonce à tous les utilisateurs")}</div>
          <div className="rounded-2xl p-3 mb-5" style={card}>
            <textarea value={annText} onChange={(e) => setAnnText(e.target.value)} rows={2} maxLength={280} placeholder="Ex. : Maintenance ce soir à 22 h" className="w-full rounded-xl px-3 py-2 text-sm outline-none mb-2" style={{ background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--line)", resize: "none" }} />
            <button onClick={sendAnnounce} className="w-full rounded-xl py-2.5 text-sm font-semibold" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>Envoyer l'annonce</button>
            {anns.length > 0 && (
              <div className="mt-3">
                {anns.slice().reverse().slice(0, 5).map((a) => (
                  <div key={a.id} className="flex items-start justify-between gap-2 py-1.5 text-xs" style={{ borderTop: "1px solid var(--line)" }}>
                    <span style={title}>{new Date(a.ts).toLocaleDateString("fr-FR")} · <span style={{ color: "var(--fg)" }}>{a.text}</span></span>
                    <button onClick={() => deleteAnn(a.id)} className="shrink-0 underline" style={{ color: "#FF6B5D" }}>Retirer</button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex gap-2 mb-5">
            <button onClick={exportCsv} className={small} style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>⬇️ Exporter les comptes</button>
            <button onClick={openPurge} className={small} style={{ background: "rgba(255,107,93,0.15)", color: "#FF6B5D" }}>🧹 Purger les inactifs</button>
          </div>

          <div id="adm-log" style={{ scrollMarginTop: 56 }} />
          <AdminLog card={card} title={title} label={label} />
          <div id="adm-users" style={{ scrollMarginTop: 56 }} />

          {label("Comptes créés (" + shown.length + ")")}
          <div className="flex gap-1.5 mb-2 flex-wrap">
            {[["all", "Tous"], ["online", "En ligne"], ["banned", "Suspendus"], ["inactive", "Inactifs"]].map((f) => <button key={f[0]} onClick={() => setFlt(f[0])} className="rounded-full px-3 py-1.5 text-xs font-semibold" style={flt === f[0] ? { background: "var(--accent)", color: "var(--on-accent)" } : { background: "var(--card2)", border: "1px solid var(--line)" }}>{f[1]}</button>)}
            <select value={srt} onChange={(e) => setSrt(e.target.value)} className="rounded-full px-3 py-1.5 text-xs" style={{ background: "var(--card2)", color: "var(--fg)", border: "1px solid var(--line)" }}>
              <option value="new">Récents</option><option value="seen">Dernière connexion</option><option value="name">A → Z</option>
            </select>
          </div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un pseudo ou un code" className="w-full rounded-full px-4 py-2.5 text-sm outline-none mb-3" style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }} />

          {shown.map((a) => {
            const isAdmin = a.id === ADMIN_ID;
            const online = Date.now() - a.seen < 45000;
            return (
              <div key={a.id} className="rounded-2xl p-3 mb-2" style={card}>
                <div className="flex items-center gap-3">
                  <Avatar code={a.id} pseudo={a.pseudo} size={42} />
                  <div className="min-w-0 flex-1">
                    <div className="font-semibold truncate">{a.pseudo} {isAdmin && "🛡️"} {a.banned && <span className="text-[11px] rounded-full px-2 py-0.5 ml-1" style={{ background: "rgba(255,107,93,0.18)", color: "#FF6B5D" }}>Suspendu</span>}</div>
                    <div className="text-[11px]" style={title}>
                      <span className="font-mono">{a.code}</span> · créé le {new Date(a.createdAt).toLocaleDateString("fr-FR")} · {online ? "en ligne" : a.seen ? "vu " + dayLabel(a.seen).toLowerCase() : "jamais vu"}
                    </div>
                  </div>
                </div>
                {!isAdmin && (
                  <div className="flex gap-2 mt-3 flex-wrap">
                    <button onClick={() => setCodeEdit(a)} className={small} style={{ background: "var(--card2)", border: "1px solid var(--line)", minWidth: 90 }}>✏️ Code ami</button>
                    <button onClick={() => warnUser(a)} className={small} style={{ background: "var(--card2)", border: "1px solid var(--line)", minWidth: 90 }}>⚠️ Avertir</button>
                    <button onClick={() => kickUser(a)} className={small} style={{ background: "var(--card2)", border: "1px solid var(--line)", minWidth: 90 }}>⏏️ Déconnecter</button>
                    <button onClick={() => setTarget({ id: a.id, code: a.code, pseudo: a.pseudo, action: a.banned ? "unban" : "ban" })} className={small} style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>{a.banned ? "Réactiver" : "Suspendre"}</button>
                    <button onClick={() => { setTmpPw(""); setTarget({ id: a.id, code: a.code, pseudo: a.pseudo, action: "reset" }); }} className={small} style={{ background: "var(--card2)", border: "1px solid var(--line)" }}>Mot de passe</button>
                    <button onClick={() => setTarget({ id: a.id, code: a.code, pseudo: a.pseudo, action: "delete" })} className={small} style={{ background: "rgba(255,107,93,0.15)", color: "#FF6B5D" }}>Supprimer</button>
                  </div>
                )}
              </div>
            );
          })}
        </>
      )}

      {note && <div className="fixed left-1/2 bottom-6 z-[60] rounded-full px-4 py-2 text-sm font-medium" style={{ transform: "translateX(-50%)", background: "var(--fg)", color: "var(--bg)" }}>{note}</div>}

      {target && (
        <div className="fixed inset-x-0 bottom-0 z-50 mx-auto p-4" style={{ maxWidth: 480 }}>
          <div className="rounded-3xl p-5" style={{ background: "var(--bg)", border: "1px solid var(--line2)", boxShadow: "0 -10px 40px -10px rgba(0,0,0,0.6)" }}>
            <div className="font-semibold mb-1">
              {target.action === "delete" || target.action === "purge" ? "Supprimer" : target.action === "ban" ? "Suspendre" : target.action === "reset" ? "Nouveau mot de passe pour" : "Réactiver"} {target.action === "purge" ? target.pseudo + " inactifs" : "le compte de " + target.pseudo} ?
            </div>
            <p className="text-xs mb-4" style={title}>
              {target.action === "delete" || target.action === "purge" ? "Les comptes, leurs conversations et leurs données seront effacés définitivement." : target.action === "ban" ? "Il sera déconnecté et ne pourra plus se connecter." : target.action === "reset" ? "Donne-lui ce mot de passe provisoire, il pourra le changer dans ses réglages." : "Il pourra de nouveau se connecter."}
            </p>
            {target.action === "reset" && (
              <input value={tmpPw} onChange={(e) => setTmpPw(e.target.value)} placeholder="Nouveau mot de passe" className="w-full rounded-xl px-4 py-3 text-sm outline-none mb-3" style={{ background: "var(--card)", color: "var(--fg)", border: "1px solid var(--line)" }} />
            )}
            <div className="flex gap-2">
              <button onClick={() => { setTarget(null); setTmpPw(""); }} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: "var(--card2)" }}>Annuler</button>
              <button onClick={run} disabled={busy} className="flex-1 rounded-xl py-3 text-sm font-semibold" style={{ background: target.action === "delete" || target.action === "purge" ? "#FF6B5D" : "var(--accent)", color: "var(--on-accent)" }}>
                {busy ? <Loader2 size={16} className="animate-spin inline" /> : "Confirmer"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- App ----------

function App() {
  const [screen, setScreen] = useState("loading"); // loading | welcome | signup | signin | home | chat
  const [me, setMe] = useState(null);
  const [openWith, setOpenWith] = useState(null);
  const [prefs, setPrefs] = useState({ theme: "dark", accent: "#2DD4BF", pinned: [], muted: [], blocked: [] });
  const updatePrefs = (np) => { setPrefs(np); if (me) safeSet("prefs:" + me.id, JSON.stringify(np), false); };
  const [kickMsg, setKickMsg] = useState("");
  const [callReq, setCallReq] = useState(null);
  const [showNews, setShowNews] = useState(false);
  const [locked, setLocked] = useState(false);
  const [warn, setWarn] = useState(null);
  const [nbDismiss, setNbDismiss] = useState(false);
  const [wide, setWide] = useState(() => !!(window.matchMedia && window.matchMedia("(min-width: 820px) and (min-height: 480px) and (min-aspect-ratio: 6/5)").matches));
  const [blurred, setBlurred] = useState(false);

  useEffect(() => {
    (async () => {
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => { window.__swReg = r; }).catch((e) => { window.__swErr = String((e && e.message) || e); });
      await ensureAdmin();
      const raw = await safeGet("profile", false);
      if (raw) {
        setMe(JSON.parse(raw));
        setScreen("home");
      } else {
        setScreen("welcome");
      }
    })();
  }, []);

  useEffect(() => {
    if (!me) return;
    (async () => {
      const rp = await safeGet("prefs:" + me.id, false);
      if (rp) setPrefs(Object.assign({ theme: "dark", accent: "#2DD4BF", pinned: [], muted: [], blocked: [] }, JSON.parse(rp)));
    })();
  }, [me && me.id]);

  useEffect(() => {
    if (!me || me.id === ADMIN_ID) return;
    const t = setInterval(async () => {
      if (document.hidden) return;
      const r = await Promise.all([probe("profile:" + me.id), probe("banned:" + me.id)]);
      if (r[0] === "no" || r[1] === "yes") {
        await handleLogout();
        setKickMsg(r[1] === "yes" ? "Ton compte a été suspendu par l'administrateur." : "Ton compte a été supprimé.");
        setTimeout(() => setKickMsg(""), 8000);
      }
    }, 8000);
    return () => clearInterval(t);
  }, [me && me.id]);

  useEffect(() => {
    if (!me) return;
    (async () => {
      const raw = await safeGet("profile:" + me.id, true);
      if (raw) {
        const pr = JSON.parse(raw);
        if (JSON.stringify(pr.avatar || null) !== JSON.stringify(me.avatar || null)) setMe(Object.assign({}, me, { avatar: pr.avatar || undefined }));
      }
      const v = await safeGet("seenVersion", false);
      if (v !== APP_VERSION) setShowNews(true);
    })();
  }, [me && me.id]);

  const handleLogout = async () => {
    await safeDelete("profile", false);
    setMe(null);
    setOpenWith(null);
    setScreen("welcome");
  };

  const blurBgRef = useRef(false);
  blurBgRef.current = !!prefs.blurBg;
  useEffect(() => {
    const mq = window.matchMedia("(min-width: 820px) and (min-height: 480px) and (min-aspect-ratio: 6/5)");
    const f = () => setWide(mq.matches);
    f();
    if (mq.addEventListener) mq.addEventListener("change", f); else mq.addListener(f);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", f); else mq.removeListener(f); };
  }, []);
  useEffect(() => {
    const hide = () => { if (blurBgRef.current) setBlurred(true); };
    const show = () => setBlurred(false);
    const vis = () => { if (document.hidden) hide(); else show(); };
    document.addEventListener("visibilitychange", vis);
    window.addEventListener("blur", hide);
    window.addEventListener("focus", show);
    return () => { document.removeEventListener("visibilitychange", vis); window.removeEventListener("blur", hide); window.removeEventListener("focus", show); };
  }, []);
  const lockRef = useRef(false);
  const hiddenAt = useRef(0);
  useEffect(() => {
    if (!me) { setLocked(false); lockRef.current = false; return; }
    const read = async () => { const l = await safeGet("lock:" + me.id, false); lockRef.current = !!l; if (!l) setLocked(false); return !!l; };
    read().then((has) => { if (has) setLocked(true); });
    const onChange = () => { read(); };
    const onVis = () => { if (document.hidden) hiddenAt.current = Date.now(); else if (lockRef.current && hiddenAt.current && Date.now() - hiddenAt.current > 30000) setLocked(true); };
    window.addEventListener("st-lock-changed", onChange);
    document.addEventListener("visibilitychange", onVis);
    return () => { window.removeEventListener("st-lock-changed", onChange); document.removeEventListener("visibilitychange", onVis); };
  }, [me && me.id]);

  useEffect(() => {
    if (!me) return;
    savePushCfg(me);
    if (notifOn(prefs)) registerPush(me);
  }, [me && me.id, prefs.notif]);

  useEffect(() => {
    if (!me || me.id === ADMIN_ID) return;
    const t = setInterval(async () => {
      if (document.hidden) return;
      const w = await safeGet("warn:" + me.id, true);
      if (w) { try { setWarn(JSON.parse(w)); } catch (e) { /* ignore */ } }
      const kk = await safeGet("kick:" + me.id, true);
      const at = parseInt(await safeGet("loginAt", false), 10) || 0;
      if (kk && at && parseInt(kk, 10) > at) { await handleLogout(); setKickMsg("L'administrateur t'a déconnecté."); setTimeout(() => setKickMsg(""), 8000); }
      const prr = await safeGet("profile:" + me.id, true);
      if (prr) { try { const pp = JSON.parse(prr); if (pp.code && pp.code !== me.code) { const upd = Object.assign({}, me, { code: pp.code }); await safeSet("profile", JSON.stringify(upd), false); setMe(upd); } } catch (e) { /* ignore */ } }
    }, 9000);
    return () => clearInterval(t);
  }, [me && me.id]);

  useEffect(() => {
    if (!me) return;
    const openById = async (oid) => {
      const pr = await safeGet("profile:" + oid, true);
      if (!pr) return;
      const p = JSON.parse(pr);
      setOpenWith({ id: oid, pseudo: p.pseudo, avatar: p.avatar || null });
      setScreen("chat");
    };
    const doReply = async (d) => {
      const pr = await safeGet("profile:" + d.to, true);
      if (!pr) return;
      await sendTo(me, { id: d.to, pseudo: JSON.parse(pr).pseudo }, { id: Date.now() + "-" + Math.random(), from: me.id, type: "text", content: String(d.text).slice(0, 2000), ts: Date.now() });
    };
    const onMsg = (ev) => { const d = ev.data || {}; if (d.type === "reply") doReply(d); if (d.type === "open") openById(d.to); };
    if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("message", onMsg);
    try {
      const q = new URLSearchParams(location.search);
      if (q.get("reply")) doReply(JSON.parse(q.get("reply")));
      if (q.get("open")) openById(q.get("open"));
      if (q.get("reply") || q.get("open")) history.replaceState(null, "", location.pathname);
    } catch (e) { /* ignore */ }
    return () => { if (navigator.serviceWorker) navigator.serviceWorker.removeEventListener("message", onMsg); };
  }, [me && me.id]);

  if (me) { if (me.avatar) AVATARS[me.id] = me.avatar; else delete AVATARS[me.id]; }

  return (
    <div className="w-full mx-auto" style={Object.assign({ maxWidth: wide && me ? 1280 : 480, height: "100dvh", fontFamily: "'Inter', system-ui, sans-serif" }, themeVars(prefs), wide && me ? { display: "grid", gridTemplateColumns: "minmax(320px, 400px) 1fr", gridTemplateRows: "100%", boxShadow: "0 0 0 1px var(--line), 0 40px 90px -40px rgba(0,0,0,0.7)", background: "var(--bg)", color: "var(--fg)" } : {}, { "--fs": (prefs.fontSize || 15) + "px" })}>
      <style>{`
        input:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent) !important; }
        * { -webkit-tap-highlight-color: transparent; }
        button:active:not(:disabled) { transform: scale(0.97); }
        input.bare:focus { box-shadow: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; }
        @keyframes stSheet { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes stMsgIn { from { transform: translateY(6px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
        .stMsg { animation: stMsgIn .18s ease-out; }
        .stBar { background: rgba(0,0,0,0.26); border-radius: 22px; padding: 7px 11px; backdrop-filter: blur(10px); animation: stSheet .16s ease-out; }
        .stBar > button[class*="text-base"] { font-size: 23px; padding: 2px 3px; transition: transform .12s; }
        .stBar > button[class*="text-base"]:active { transform: scale(1.4); }
        .stBar > button[class*="text-[11px]"] { text-decoration: none; background: rgba(255,255,255,0.15); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; margin-left: 0 !important; }
        .stMenuItem:hover { background: var(--card2); }
        .stMenu { animation: stMenuIn .2s cubic-bezier(.2,.9,.3,1.2); transform-origin: top right; }
        @keyframes stMenuIn { from { opacity: 0; transform: scale(.86) translateY(-8px); } to { opacity: 1; transform: none; } }
        .stPane { min-height: 0; height: 100%; overflow: hidden; position: relative; }
        @media (min-width: 820px) { .stSheetWrap { align-items: center !important; } .stSheetBox { border-radius: 28px !important; } }
        @media (min-width: 820px) and (min-aspect-ratio: 6/5) { .stMsg { max-width: 62% !important; } }
        ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }
        button[style*="background: var(--accent)"] { background-image: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #3B82F6)) !important; box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--accent) 80%, transparent); }
        [style*="background: var(--card)"][class*="rounded"] { box-shadow: 0 10px 28px -20px rgba(0,0,0,0.6); }
        .stRow { transition: transform .12s ease, background-color .2s ease; }
        .stRow:hover { background: color-mix(in srgb, var(--accent) 8%, var(--card)) !important; }
        .stRow:active { transform: scale(0.985); }
        input:not(.bare), textarea, select { border-radius: 14px; }
        h1 { letter-spacing: -0.02em; }
        button { transition: transform .12s ease, background-color .2s ease, opacity .2s ease, box-shadow .2s ease; }
        input, textarea, select { transition: box-shadow .15s ease, border-color .15s ease; }
        html { scroll-behavior: smooth; }
      `}</style>
      {me && <CallManager me={me} req={callReq} prefs={prefs} viewing={screen === "chat" && openWith ? openWith.id : null} onOpenChat={(ct) => { setOpenWith(ct); setScreen("chat"); }} />}
      <div className="fixed bottom-1 left-2 text-[9px] pointer-events-none" style={{ opacity: 0.35, color: "var(--fg)" }}>v5</div>
      {me && <><LocationSharer me={me} /><MsgScheduler me={me} /><Outbox me={me} /></>}
      {me && locked && <LockScreen me={me} onUnlock={() => setLocked(false)} onLogout={() => { setLocked(false); handleLogout(); }} />}
      {me && typeof Notification !== "undefined" && Notification.permission === "default" && !nbDismiss && screen !== "chat" && (
        <div className="fixed left-1/2 z-50 rounded-2xl px-4 py-3 text-sm flex items-center gap-3" style={{ bottom: 16, transform: "translateX(-50%)", width: "calc(100% - 24px)", maxWidth: 440, background: "var(--bg)", color: "var(--fg)", border: "1px solid var(--line2)", boxShadow: "0 8px 30px rgba(0,0,0,0.4)" }}>
          <span style={{ fontSize: 22 }}>🔔</span>
          <span className="flex-1 leading-snug">Reçois tes messages et appels dans la barre de notifications, même appli fermée.</span>
          <button className="rounded-xl px-3 py-2 font-semibold" style={{ background: "var(--accent)", color: "var(--on-accent)" }} onClick={async () => {
            const r = await Notification.requestPermission();
            setNbDismiss(true);
            if (r === "granted") { updatePrefs(Object.assign({}, prefs, { notif: true })); registerPush(me); notify("Notifications activées", "Tu seras prévenu des nouveaux messages et appels.", "msg-test"); }
          }}>Activer</button>
          <button className="px-1" style={{ color: "var(--muted)" }} onClick={() => setNbDismiss(true)} aria-label="Plus tard"><X size={16} /></button>
        </div>
      )}
      {blurred && <div className="fixed inset-0 z-[150] flex flex-col items-center justify-center" style={{ background: "var(--bg)", color: "var(--fg)" }}><div style={{ fontSize: 56 }}>💬</div><div className="font-semibold mt-2">Sans-Trace</div></div>}
      {warn && <Sheet title="⚠️ Message de l'administrateur" onClose={() => { safeDelete("warn:" + me.id, true); setWarn(null); }}><p className="text-sm mb-4">{warn.text}</p><button onClick={() => { safeDelete("warn:" + me.id, true); setWarn(null); }} className="w-full rounded-xl py-3 text-sm font-semibold" style={{ background: "var(--accent)", color: "var(--on-accent)" }}>J'ai compris</button></Sheet>}
      {showNews && me && <NewsModal onClose={() => { safeSet("seenVersion", APP_VERSION, false); setShowNews(false); }} />}
      {kickMsg && (
        <div className="fixed top-3 left-1/2 z-50 rounded-2xl px-4 py-3 text-sm font-medium" style={{ transform: "translateX(-50%)", background: "#FF6B5D", color: "#0F1115", maxWidth: 360 }}>{kickMsg}</div>
      )}
      {screen === "loading" && (
        <div className="h-full flex items-center justify-center" style={{ background: "var(--bg)" }}>
          <Loader2 size={24} className="animate-spin" color="#2DD4BF" />
        </div>
      )}
      {screen === "welcome" && <Welcome onSelect={(which) => setScreen(which)} />}
      {screen === "signup" && (
        <SignUp
          onBack={() => setScreen("welcome")}
          onDone={(session) => {
            safeSet("seenVersion", APP_VERSION, false);
            setMe(session);
            setScreen("home");
          }}
        />
      )}
      {screen === "signin" && (
        <SignIn
          onBack={() => setScreen("welcome")}
          onDone={(session) => {
            setMe(session);
            setScreen("home");
          }}
        />
      )}
      {me && (screen === "home" || (wide && ["chat", "settings", "admin", "ai"].indexOf(screen) !== -1)) && (
        <div className="stPane" style={{ borderRight: wide ? "1px solid var(--line)" : "none", background: "var(--bg)" }}>
        <Home
          me={me}
          onOpenChat={(contact) => {
            setOpenWith(contact);
            setScreen("chat");
          }}
          onLogout={handleLogout}
          onSettings={() => setScreen("settings")}
          prefs={prefs}
          onPrefs={updatePrefs}
          onProfileUpdate={setMe}
        />
          <button onClick={() => setScreen("ai")} className="absolute z-20 flex items-center justify-center" style={{ right: 16, bottom: 18, width: 54, height: 54, borderRadius: 27, fontSize: 24, background: "linear-gradient(135deg, var(--accent), #8B5CF6)", boxShadow: "0 12px 28px -8px rgba(139,92,246,0.75)" }} title="Assistant IA">✨</button>
        </div>
      )}
      {me && wide && screen === "home" && (
        <div className="stPane flex flex-col items-center justify-center text-center px-6" style={{ background: "radial-gradient(70% 50% at 50% 30%, color-mix(in srgb, var(--accent) 12%, transparent), transparent), var(--bg)", color: "var(--muted)" }}>
          <div style={{ fontSize: 60 }}>💬</div>
          <div className="font-semibold mt-3 text-lg" style={{ color: "var(--fg)" }}>Sans-Trace</div>
          <div className="text-sm mt-1">Choisis une discussion pour commencer</div>
        </div>
      )}
      {screen === "settings" && me && <div className="stPane"><Settings me={me} prefs={prefs} onPrefs={updatePrefs} onProfileUpdate={setMe} onBack={() => setScreen("home")} onLogout={handleLogout} onAdmin={() => setScreen("admin")} /></div>}
      {screen === "admin" && me && <div className="stPane" style={{ overflowY: "auto" }}><Admin me={me} onBack={() => setScreen("settings")} /></div>}
      {screen === "ai" && me && <div className="stPane"><AssistantScreen me={me} onBack={() => setScreen("home")} /></div>}
      {screen === "chat" && me && openWith && <div className="stPane"><Chat key={openWith.id} me={me} other={openWith} prefs={prefs} onPrefs={updatePrefs} onBack={() => setScreen("home")} onCall={(kind) => setCallReq({ other: openWith, kind: kind, n: Date.now() })} /></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
