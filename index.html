        <br>
        <button type="button" id="validerSelection" class="admin-btn" style="margin-top: 10px; background-color: #10b981;">Valider la sélection</button>
    </div>

    <!-- Zone réservée pour la suite -->
    <div id="suite-traitement" style="display: none; margin-top: 15px;">
        <!-- C'est ici que tu pourras écrire la suite -->
    </div>
</div>

<script>
    // 1. Quand on clique sur le bouton admin, on affiche la liste des contacts
    document.getElementById('monBoutonAdmin').addEventListener('click', function() {
        const section = document.getElementById('contact-section');
        section.style.display = 'block'; // Affiche la section des contacts
    });

    // 2. Quand on valide le contact sélectionné
    document.getElementById('validerSelection').addEventListener('click', function() {
        const selectBox = document.getElementById('contactSelect');
        const contactId = selectBox.value;
        const contactNom = selectBox.options[selectBox.selectedIndex].text;

        if (contactId === "") {
            alert("Veuillez sélectionner un contact dans la liste.");
            return;
        }

        // On récupère le contact choisi
        console.log("Contact sélectionné ID:", contactId, "Nom:", contactNom);

        // Afficher la zone pour la suite
        const zoneSuite = document.getElementById('suite-traitement');
        zoneSuite.style.display = 'block';
        zoneSuite.innerHTML = `<p style="color: green;"><strong>Contact sélectionné :</strong> ${contactNom}</p>`;

        // === C'EST ICI QUE TU POURRAS ÉCRIRE LA SUITE ===
    });
</script>
</script>
</body>
</html>
